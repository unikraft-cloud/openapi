openapi: 3.0.3
info:
    title: Unikraft Cloud Control Plane API
    description: This specification describes the Unikraft Cloud Control Plane API, which provides mechanisms to interact with globally provided Unikraft Cloud system.
    contact:
        name: Unikraft Support
        url: https://unikraft.com/contact
        email: support@unikraft.com
    version: v1.0.0
servers:
    - url: https://controlplane.unikraft.cloud
      description: Official Unikraft Cloud Control Plane API
paths:
    /v1/auth:
        get:
            tags:
                - Auth
            summary: Get Authorization Status
            description: Get authorization details for a token.
            operationId: GetAuthorization
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetAuthorizationResponse'
            x-package: controlplane
    /v1/auth/check:
        post:
            tags:
                - Auth
            summary: Check Authorization of Sign-In Request
            description: |-
                Check the authorization status of a request.  The responses are streamed
                back to the client, indicating whether the signin request is authorized or
                not.
            operationId: CheckAuthorization
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckAuthorizationRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        text/event-stream:
                            schema:
                                $ref: '#/components/schemas/CheckAuthorizationResponse'
            x-package: controlplane
    /v1/auth/signin:
        post:
            tags:
                - Auth
            summary: Request Sign-In
            description: |-
                Initiate the sign-in process and return an authorization URL.  The user
                should be redirected to this URL to complete the sign-in.
            operationId: RequestSignin
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RequestSigninRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RequestSigninResponse'
            x-package: controlplane
    /v1/images:
        get:
            tags:
                - Images
            summary: List Images
            description: ListImages lists all images for the authenticated user.
            operationId: ListImages
            parameters:
                - name: details
                  in: query
                  description: Whether to include image tag details.
                  schema:
                    type: boolean
                - name: namespace
                  in: query
                  description: Optional namespaces to filter images by.
                  schema:
                    type: array
                    items:
                        type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListImagesResponse'
            x-package: controlplane
    /v1/metros:
        get:
            tags:
                - Metros
            summary: Get Metros
            description: ListMetros lists all available metros.
            operationId: ListMetros
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMetroResponse'
            x-package: controlplane
    /v1/nodes:
        get:
            tags:
                - NodeService
            summary: List Node Nodes
            description: |-
                Get one or more nodes.

                Returns nodes matching the specified filters. If no filters are
                provided, all nodes are returned.
            operationId: ListNodes
            parameters:
                - name: uuid
                  in: query
                  description: The UUID of the resource.
                  schema:
                    type: array
                    items:
                        type: string
                - name: name
                  in: query
                  description: The name of the resource.
                  schema:
                    type: array
                    items:
                        type: string
                - name: cloudprovider
                  in: query
                  description: Optional filter by cloud provider.
                  schema:
                    $ref: '#/components/schemas/CloudProvider'
                - name: state
                  in: query
                  description: Optional filter by state.
                  schema:
                    $ref: '#/components/schemas/NodeState'
                - name: metro
                  in: query
                  description: Optional filter by metro.
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Maximum number of results to return.
                  schema:
                    type: integer
                    format: uint32
                - name: offset
                  in: query
                  description: Offset for pagination.
                  schema:
                    type: integer
                    format: uint32
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListNodesResponse'
            x-package: controlplane
        post:
            tags:
                - NodeService
            summary: Create Node Node
            description: |-
                Create a new node.

                Creates a new compute node on the specified cloud provider. The node
                will go through provisioning (PROVISIONING state) and configuration
                (CONFIGURING state) before becoming ready (READY state) for use.
            operationId: ProvisionNode
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProvisionNodeRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProvisionNodeResponse'
            x-package: controlplane
        delete:
            tags:
                - NodeService
            summary: Delete Node Nodes
            description: |-
                Delete one or more nodes.

                Batch deletion of nodes by their identifiers.
            operationId: DestroyNode
            parameters:
                - name: force
                  in: query
                  description: Force deletion even if nodes are in use.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DestroyNodeResponse'
            x-package: controlplane
        patch:
            tags:
                - NodeService
            summary: Update Node Nodes
            description: |-
                Update one or more nodes.

                Batch update of mutable properties for multiple nodes.
            operationId: UpdateNodes
            parameters:
                - name: property
                  in: query
                  description: The property to update.
                  schema:
                    type: array
                    items:
                        $ref: '#/components/schemas/MutableNodeProperty'
                - name: operation
                  in: query
                  description: The operation to perform on the property.
                  schema:
                    type: array
                    items:
                        $ref: '#/components/schemas/MutableNodeOperation'
                - name: value
                  in: query
                  description: |-
                    The value for the update operation. The type depends on the property:
                    - TAGS: google.protobuf.Struct with key-value pairs
                    - DELETE_LOCK: google.protobuf.Value with boolean
                    - SSH_KEYS: google.protobuf.ListValue with SSHKey objects
                  schema:
                    type: array
                    items:
                        type: string
                        format: bytes
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateNodesResponse'
            x-package: controlplane
    /v1/nodes/activate:
        post:
            tags:
                - NodeActivationService
            description: |-
                Activates a new node, or renews an existing node's license. For first-time
                activation, a secret must be provided. For renewal, the CSR self-signature
                is used as proof of key possession and the secret is omitted.
            operationId: NodeActivate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NodeActivateRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NodeActivateResponse'
            x-package: controlplane
    /v1/nodes/heartbeat:
        post:
            tags:
                - NodeHeartbeatService
            description: Sends a heartbeat from a node to report its platform status.
            operationId: NodeHeartbeat
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/NodeHeartbeatRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/NodeHeartbeatResponse'
            x-package: controlplane
    /v1/nodes/providers/{cloudprovider}/regions:
        get:
            tags:
                - NodeService
            summary: List Regions
            description: |-
                List available regions for a provider.

                Returns the regions available for provisioning on the specified cloud
                provider, including availability zone information.
            operationId: ListRegions
            parameters:
                - name: cloudprovider
                  in: path
                  description: The cloud provider to list regions for.
                  required: true
                  schema:
                    $ref: '#/components/schemas/CloudProvider'
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListRegionsResponse'
            x-package: controlplane
    /v1/nodes/providers/{cloudprovider}/types:
        get:
            tags:
                - NodeService
            summary: List Machine Types
            description: |-
                List available machine types for a provider.

                Returns the machine types (instance types) available for provisioning
                on the specified cloud provider.
            operationId: ListMachineTypes
            parameters:
                - name: cloudprovider
                  in: path
                  description: The cloud provider to list machine types for.
                  required: true
                  schema:
                    $ref: '#/components/schemas/CloudProvider'
                - name: region
                  in: query
                  description: Optional region filter. Some providers have region-specific availability.
                  schema:
                    type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMachineTypesResponse'
            x-package: controlplane
    /v1/nodes/wait:
        get:
            tags:
                - NodeService
            summary: Wait for Node Nodes States
            description: Wait for multiple nodes to reach specific states.
            operationId: WaitNodes
            parameters:
                - name: uuid
                  in: query
                  description: The UUID of the resource.
                  schema:
                    type: array
                    items:
                        type: string
                - name: name
                  in: query
                  description: The name of the resource.
                  schema:
                    type: array
                    items:
                        type: string
                - name: states
                  in: query
                  description: The desired state(s) to wait for.
                  schema:
                    type: array
                    items:
                        $ref: '#/components/schemas/NodeState'
                - name: timeout_ms
                  in: query
                  description: Timeout in milliseconds. Use -1 for infinite wait.
                  schema:
                    type: integer
                    format: int64
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WaitNodesResponse'
            x-package: controlplane
    /v1/nodes/{uuid}:
        get:
            tags:
                - NodeService
            summary: Get Node Node by UUID
            description: Get a single node by its UUID.
            operationId: GetNodeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the node to retrieve.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListNodesResponse'
            x-package: controlplane
        delete:
            tags:
                - NodeService
            summary: Delete Node Node by UUID
            description: |-
                Destroy (delete) a node by its UUID.

                Deprovisions and deletes the node. The node will transition to
                DEPROVISIONING state and then be removed. If the node has a delete lock,
                this operation will fail unless the lock is first removed.
            operationId: DestroyNodeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the node to delete.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
                - name: force
                  in: query
                  description: Force deletion even if the node is in use.
                  schema:
                    type: boolean
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DestroyNodeResponse'
            x-package: controlplane
        patch:
            tags:
                - NodeService
            summary: Update Node Node by UUID
            description: |-
                Update a node by its UUID.

                Updates mutable properties of a node such as tags, delete lock,
                or SSH keys.
            operationId: UpdateNodeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the node to update.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/UpdateNodePayload'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateNodesResponse'
            x-package: controlplane
    /v1/nodes/{uuid}/wait:
        get:
            tags:
                - NodeService
            summary: Wait for Node Node State by UUID
            description: |-
                Wait for a node to reach a specific state.

                Blocks until the specified node reaches one of the desired states
                or the timeout is reached.
            operationId: WaitNodeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the node to wait for.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
                - name: states
                  in: query
                  description: |-
                    The desired state(s) to wait for. The request completes when any of
                    these states is reached.
                  schema:
                    type: array
                    items:
                        $ref: '#/components/schemas/NodeState'
                - name: timeout_ms
                  in: query
                  description: Timeout in milliseconds. Use -1 for infinite wait.
                  schema:
                    type: integer
                    format: int64
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WaitNodesResponse'
            x-package: controlplane
components:
    schemas:
        AWSConfig:
            required:
                - dedicated_host
                - region
                - machine_type
            type: object
            properties:
                vpc_id:
                    example: vpc-0123456789abcdef0
                    type: string
                    description: |-
                        The VPC ID where the instance will be launched. If not specified, the
                        default VPC for the region will be used.
                subnet_id:
                    example: subnet-0123456789abcdef0
                    type: string
                    description: |-
                        The subnet ID where the instance will be launched. If not specified,
                        a subnet will be selected from the VPC.
                security_group_ids:
                    example: ["sg-0123456789abcdef0"]
                    type: array
                    items:
                        type: string
                    description: |-
                        Security group IDs to attach to the instance. If not specified, the
                        default security group for the VPC will be used.
                iam_instance_profile:
                    example: arn:aws:iam::123456789012:instance-profile/MyProfile
                    type: string
                    description: The IAM instance profile ARN or name to attach to the instance.
                root_volume:
                    allOf:
                        - $ref: '#/components/schemas/AWSEBSConfig'
                    description: |-
                        Root EBS volume configuration. If not specified, provider defaults
                        will be used.
                additional_volumes:
                    type: array
                    items:
                        $ref: '#/components/schemas/AWSEBSConfig'
                    description: Additional EBS volumes to attach to the instance.
                dedicated_host:
                    type: boolean
                    description: |-
                        Whether to use a dedicated host. Dedicated hosts provide visibility and
                        control over how instances are placed on physical servers.
                placement_group:
                    example: my-cluster-placement-group
                    type: string
                    description: |-
                        Placement group name for the instance. Placement groups influence how
                        instances are placed on underlying hardware.
                region:
                    example: us-east-1
                    type: string
                    description: The AWS region where the machine is located.
                machine_type:
                    example: c8i.large
                    type: string
                    description: |-
                        The AWS machine type. This determines the compute resources
                        (CPU, memory, etc.) available on the machine. The valid values depend
                        on the chosen provider.
            description: AWSConfig contains AWS-specific configuration for node provisioning.
            x-package: controlplane
        AWSEBSConfig:
            required:
                - size_gib
                - volume_type
                - encrypted
                - delete_on_termination
            type: object
            properties:
                device_name:
                    example: /dev/xvdf
                    type: string
                    description: |-
                        The device name (e.g., "/dev/sda1", "/dev/xvdf"). Required for
                        additional volumes.
                size_gib:
                    example: 100
                    type: integer
                    description: Size of the volume in GiB.
                    format: uint32
                volume_type:
                    example: gp3
                    type: string
                    description: The volume type (gp3, gp2, io1, io2, st1, sc1, standard).
                iops:
                    example: 3000
                    type: integer
                    description: The number of IOPS. Only valid for io1, io2, and gp3 volumes.
                    format: uint32
                throughput_mibps:
                    example: 125
                    type: integer
                    description: The throughput in MiB/s. Only valid for gp3 volumes.
                    format: uint32
                encrypted:
                    type: boolean
                    description: Whether the volume should be encrypted.
                kms_key_id:
                    example: arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
                    type: string
                    description: |-
                        The KMS key ID for encryption. If encrypted is true and this is not
                        specified, the default EBS encryption key will be used.
                delete_on_termination:
                    type: boolean
                    description: Whether to delete the volume when the instance is terminated.
            description: AWSEBSConfig defines the configuration for an AWS EBS volume.
            x-package: controlplane
        CheckAuthorizationRequest:
            required:
                - request_id
            type: object
            properties:
                request_id:
                    type: string
                    description: |-
                        The request ID is a unique identifier for the request.  This is used to
                        track the request in the system and should be provided by the client.
            description: The request message for checking authorization given a request ID.
            x-package: controlplane
        CheckAuthorizationResponse:
            required:
                - status
                - op_time_us
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/CheckAuthorizationResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                op_time_us:
                    example: 56
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                        the request and generate the response.
                    format: uint64
            description: The response message for checking authorization.
            x-package: controlplane
        CheckAuthorizationResponseData:
            required:
                - token
                - organization_name
                - organization_display_name
                - registry
            type: object
            properties:
                token:
                    type: string
                    description: The authorization token which can be used to authenticate requests.
                organization_name:
                    type: string
                    description: The organization name the token is associated with.
                organization_display_name:
                    type: string
                    description: The display name of the organization the token is associated with.
                registry:
                    type: string
                    description: The global image registry.
            x-package: controlplane
        CloudProvider:
            enum:
                - "manual"
                - "aws"
            type: string
            description: |-
                CloudProvider identifies the cloud infrastructure provider where nodes are
                provisioned.
            format: enum
            x-package: controlplane
        CloudProviderConfig:
            type: object
            allOf:
                - oneOf:
                    - title: aws
                      type: object
                      properties:
                        aws:
                            allOf:
                                - $ref: '#/components/schemas/AWSConfig'
                            description: AWS-specific configuration.
            description: |-
                CloudProviderConfig contains provider-specific configuration for node
                provisioning.
            x-package: controlplane
        DestroyNodeResponse:
            required:
                - status
                - op_time_us
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/DestroyNodeResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                op_time_us:
                    example: 2341
                    type: integer
                    description: The operation time in microseconds.
                    format: uint64
            description: Response message for deleting nodes.
            x-package: controlplane
        DestroyNodeResponseData:
            type: object
            properties:
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Node'
                    description: The deleted nodes (with their final state before deletion).
            x-package: controlplane
        GetAuthorizationResponse:
            required:
                - status
                - op_time_us
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/GetAuthorizationResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                op_time_us:
                    example: 56
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                        the request and generate the response.
                    format: uint64
            description: The response message for getting authorization details.
            x-package: controlplane
        GetAuthorizationResponseData:
            required:
                - organization_name
                - organization_display_name
                - registry
            type: object
            properties:
                organization_name:
                    type: string
                    description: The organization name the token is associated with.
                organization_display_name:
                    type: string
                    description: The display name of the organization the token is associated with.
                registry:
                    type: string
                    description: The global image registry.
            x-package: controlplane
        Image:
            required:
                - name
            type: object
            properties:
                name:
                    example: namespace/image1
                    type: string
                    description: The canonical name of the image.
                tags:
                    example: [{name: latest, digest: 'sha256:1111111111111111111111111111111111111111111111111111111111111111'}]
                    type: array
                    items:
                        $ref: '#/components/schemas/ImageTag'
                    description: The list of tags for the image.  Only populated when details are requested.
            x-package: controlplane
        ImageTag:
            required:
                - name
                - digest
                - size
                - push_time
            type: object
            properties:
                name:
                    example: latest
                    type: string
                    description: The tag name.
                digest:
                    example: sha256:1111111111111111111111111111111111111111111111111111111111111111
                    type: string
                    description: The digest for the tag.
                size:
                    example: 12345678
                    type: integer
                    description: The size of the image in bytes.
                    format: uint64
                push_time:
                    example: 2024-01-02T15:04:05Z
                    type: string
                    description: The push time of the image.
                    format: date-time
            x-package: controlplane
        ListImagesResponse:
            required:
                - status
                - op_time_us
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/ListImagesResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                op_time_us:
                    example: 87
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                        the request and generate the response.
                    format: uint64
            x-package: controlplane
        ListImagesResponseData:
            type: object
            properties:
                images:
                    type: array
                    items:
                        $ref: '#/components/schemas/Image'
                    description: The list of images.
            x-package: controlplane
        ListMachineTypesResponse:
            required:
                - status
                - op_time_us
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/ListMachineTypesResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
