        Node:
            required:
                - uuid
                - name
                - created_at
                - state
                - vcpus
                - memory_mib
                - uptime_seconds
                - delete_lock
            type: object
            properties:
                uuid:
                    type: string
                    description: |-
                        The UUID of the machine.

                        This is a unique identifier for the machine that is generated when the
                        machine is created. The UUID is used to reference the machine in API calls and
                        can be used to identify the machine in all API calls that require a machine
                        identifier.
                    format: uuid
                name:
                    example: machine-fra-aws-001
                    type: string
                    description: |-
                        The name of the machine.

                        This is a human-readable name that can be used to identify the machine.
                        The name must be unique within the context of your account. The name can
                        also be used to identify the machine in API calls.
                created_at:
                    example: 2024-01-15T10:30:00Z
                    type: string
                    description: The time the machine was created.
                    format: date-time
                updated_at:
                    example: 2024-01-15T12:45:00Z
                    type: string
                    description: The time the machine was last updated.
                    format: date-time
                state:
                    allOf:
                        - $ref: '#/components/schemas/NodeState'
                    description: The current state of the machine.
                state_message:
                    example: Provisioning in progress, waiting for instance to become available
                    type: string
                    description: |-
                        An optional message providing additional information about the current
                        state, particularly useful for error states.
                cloudprovider:
                    allOf:
                        - $ref: '#/components/schemas/CloudProvider'
                    description: The cloud provider where this machine is provisioned.
                vcpus:
                    example: 4
                    type: integer
                    description: The number of vCPUs available on this machine.
                    format: uint32
                memory_mib:
                    example: 16384
                    type: integer
                    description: The amount of memory in MiB available on this machine.
                    format: uint64
                ssh_keys:
                    type: array
                    items:
                        $ref: '#/components/schemas/SSHKey'
                    description: The SSH keys configured for access to this machine.
                public_ipv4:
                    example: 203.0.113.50
                    type: string
                    description: The public IPv4 address of the machine, if assigned.
                    format: ipv4
                public_ipv6:
                    example: 2001:db8::1
                    type: string
                    description: The public IPv6 address of the machine, if assigned.
                    format: ipv6
                private_ipv4:
                    example: 10.0.1.50
                    type: string
                    description: The private IPv4 address of the machine within the provider's network.
                    format: ipv4
                metro:
                    example: fra
                    type: string
                    description: The Unikraft Cloud metro this machine is associated with.
                provider_instance_id:
                    example: i-0123456789abcdef0
                    type: string
                    description: The provider-specific instance ID or resource identifier.
                provider_config:
                    allOf:
                        - $ref: '#/components/schemas/CloudProviderConfig'
                    description: Provider-specific configuration that was used to provision this node.
                tags:
                    example: {"environment": "production", "team": "platform"}
                    type: object
                    additionalProperties:
                        type: string
                    description: User-defined tags for organizing and filtering nodes.
                ready_at:
                    example: 2024-01-15T10:35:00Z
                    type: string
                    description: The time when the machine became ready (entered READY state).
                    format: date-time
                uptime_seconds:
                    example: 86400
                    type: integer
                    description: The total uptime of the machine in seconds since it became ready.
                    format: uint64
                delete_lock:
                    type: boolean
                    description: |-
                        Whether the machine is protected from deletion. When true, delete operations
                        will fail until this is set to false.
                api_endpoint:
                    example: https://api.node-metro1.unikraft.cloud/v1
                    type: string
                    description: The API endpoint for the node, used to connect to the node's platform SDK.
            description: |-
                Node represents a physical or virtual compute node provisioned on a
                cloud provider for use as part of the Unikraft Cloud infrastructure.

                Node nodes are the underlying compute resources where Unikraft Cloud
                instances run.  They are provisioned on-demand across multiple cloud
                providers and managed through a unified API.
            x-package: controlplane
        NodeActivateRequest:
            required:
                - csr
            type: object
            allOf:
                - type: object
                  properties:
                    csr:
                        example: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURSBSRVFVRVNULS0tLS0KLi4uCi0tLS0tRU5EIENFUlRJRklDQVRFIFJFUVVFU1QtLS0tLQ==
                        type: string
                        description: |-
                            The certificate signing request (CSR) for the license which is base64
                            encoded.
                - oneOf:
                    - title: secret
                      type: object
                      properties:
                        secret:
                            type: string
                            description: |-
                                An opaque secret for first-time activation. On renewal (where the node's
                                public key is already known), this field is omitted and the CSR
                                self-signature is used as proof of key possession.
                    - title: serial
                      type: object
                      properties:
                        serial:
                            type: string
                            description: The serial number of the last issued certificate.
            description: The request message for certificate activation.
            x-package: controlplane
        NodeActivateResponse:
            required:
                - status
                - op_time_us
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    type: string
                    description: / An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/NodeActivateResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                op_time_us:
                    example: 234
                    type: integer
                    description: The operation time in microseconds.
                    format: uint64
            description: The response message for certificate activation.
            x-package: controlplane
        NodeActivateResponseData:
            required:
                - license
            type: object
            properties:
                license:
                    type: string
                    description: The issued license certificate in base64 URL encoded PEM format.
            x-package: controlplane
