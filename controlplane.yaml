openapi: 3.0.0
info:
  title: Unikraft Cloud Control Plane API
  version: v1.0.0
  contact:
    name: Unikraft Support
    url: https://unikraft.com/contact
    email: support@unikraft.com
  description: |-
    This specification describes the Unikraft Cloud Control Plane API, which
    provides mechanisms to interact with globally provided Unikraft Cloud system.
tags:
  - name: Auth
    description: Authenticate with Unikraft Cloud.
  - name: Images
  - name: Metros
  - name: NodeService
    description: |-
      NodeService service provides APIs for provisioning and managing compute nodes
      across multiple cloud providers for use in Unikraft Cloud.
paths:
  /v1/auth:
    get:
      operationId: GetAuthorization
      description: Get authorization details for a token.
      parameters: []
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAuthorizationResponse'
      tags:
        - Auth
  /v1/auth/check:
    post:
      operationId: CheckAuthorization
      description: |-
        Check the authorization status of a request.  The responses are streamed
        back to the client, indicating whether the signin request is authorized or
        not.
      parameters: []
      responses:
        default:
          description: An unexpected error response.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CheckAuthorizationResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckAuthorizationRequest'
      security:
        - {}
  /v1/auth/signin:
    post:
      operationId: RequestSignin
      description: |-
        Initiate the sign-in process and return an authorization URL.  The user
        should be redirected to this URL to complete the sign-in.
      parameters: []
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestSigninResponse'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestSigninRequest'
      security:
        - {}
  /v1/images:
    get:
      operationId: ListImages
      description: ListImages lists all images for the authenticated user.
      parameters:
        - name: details
          in: query
          required: false
          description: Whether to include image tag details.
          schema:
            type: boolean
        - name: namespace
          in: query
          required: false
          description: Optional namespaces to filter images by.
          schema:
            type: array
            items:
              type: string
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListImagesResponse'
      tags:
        - Images
  /v1/metros:
    get:
      operationId: ListMetros
      description: ListMetros lists all available metros.
      parameters: []
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMetroResponse'
      tags:
        - Metros
  /v1/nodes:
    get:
      operationId: ListNodes
      description: |-
        Get one or more nodes.

        Returns nodes matching the specified filters. If no filters are
        provided, all nodes are returned.
      parameters:
        - name: uuid
          in: query
          required: false
          description: The UUID of the resource.
          schema:
            type: array
            items:
              type: string
        - name: name
          in: query
          required: false
          description: The name of the resource.
          schema:
            type: array
            items:
              type: string
        - name: cloudprovider
          in: query
          required: false
          description: Optional filter by cloud provider.
          schema:
            $ref: '#/components/schemas/CloudProvider'
        - name: state
          in: query
          required: false
          description: Optional filter by state.
          schema:
            $ref: '#/components/schemas/NodeState'
        - name: metro
          in: query
          required: false
          description: Optional filter by metro.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            format: uint32
        - name: offset
          in: query
          required: false
          description: Offset for pagination.
          schema:
            type: integer
            format: uint32
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNodesResponse'
      tags:
        - NodeService
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NameOrUUID'
    post:
      operationId: ProvisionNode
      description: |-
        Create a new node.

        Creates a new compute node on the specified cloud provider. The node
        will go through provisioning (PROVISIONING state) and configuration
        (CONFIGURING state) before becoming ready (READY state) for use.
      parameters: []
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionNodeResponse'
      tags:
        - NodeService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionNodeRequest'
    delete:
      operationId: DestroyNode
      description: |-
        Delete one or more nodes.

        Batch deletion of nodes by their identifiers.
      parameters:
        - name: force
          in: query
          required: false
          description: Force deletion even if nodes are in use.
          schema:
            type: boolean
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestroyNodeResponse'
      tags:
        - NodeService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NameOrUUID'
    patch:
      operationId: UpdateNodes
      description: |-
        Update one or more nodes.

        Batch update of mutable properties for multiple nodes.
      parameters:
        - name: property
          in: query
          required: false
          description: The property to update.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MutableNodeProperty'
        - name: operation
          in: query
          required: false
          description: The operation to perform on the property.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MutableNodeOperation'
        - name: value
          in: query
          required: false
          description: The value for the update operation.
          schema:
            type: array
            items:
              type: string
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNodesResponse'
      tags:
        - NodeService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/NameOrUUID'
  /v1/nodes/providers/{cloudprovider}/regions:
    get:
      operationId: ListRegions
      description: |-
        List available regions for a provider.

        Returns the regions available for provisioning on the specified cloud
        provider, including availability zone information.
      parameters:
        - name: cloudprovider
          in: path
          required: true
          description: The cloud provider to list regions for.
          schema:
            $ref: '#/components/schemas/CloudProvider'
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRegionsResponse'
      tags:
        - NodeService
  /v1/nodes/providers/{cloudprovider}/types:
    get:
      operationId: ListMachineTypes
      description: |-
        List available machine types for a provider.

        Returns the machine types (instance types) available for provisioning
        on the specified cloud provider.
      parameters:
        - name: cloudprovider
          in: path
          required: true
          description: The cloud provider to list machine types for.
          schema:
            $ref: '#/components/schemas/CloudProvider'
        - name: region
          in: query
          required: false
          description: Optional region filter. Some providers have region-specific availability.
          schema:
            type: string
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMachineTypesResponse'
      tags:
        - NodeService
  /v1/nodes/wait:
    get:
      operationId: WaitNodes
      description: Wait for multiple nodes to reach specific states.
      parameters:
        - name: uuid
          in: query
          required: false
          description: The UUID of the resource.
          schema:
            type: array
            items:
              type: string
        - name: name
          in: query
          required: false
          description: The name of the resource.
          schema:
            type: array
            items:
              type: string
        - name: states
          in: query
          required: false
          description: The desired state(s) to wait for.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/NodeState'
        - name: timeout_ms
          in: query
          required: false
          description: Timeout in milliseconds. Use -1 for infinite wait.
          schema:
            type: integer
            format: int64
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitNodesResponse'
      tags:
        - NodeService
  /v1/nodes/{uuid}:
    get:
      operationId: GetNodeByUUID
      description: Get a single node by its UUID.
      parameters:
        - name: uuid
          in: path
          required: true
          description: The UUID of the node to retrieve.
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNodesResponse'
      tags:
        - NodeService
    delete:
      operationId: DestroyNodeByUUID
      description: |-
        Destroy (delete) a node by its UUID.

        Deprovisions and deletes the node. The node will transition to
        DEPROVISIONING state and then be removed. If the node has a delete lock,
        this operation will fail unless the lock is first removed.
      parameters:
        - name: uuid
          in: path
          required: true
          description: The UUID of the node to delete.
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          description: Force deletion even if the node is in use.
          schema:
            type: boolean
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestroyNodeResponse'
      tags:
        - NodeService
    patch:
      operationId: UpdateNodeByUUID
      description: |-
        Update a node by its UUID.

        Updates mutable properties of a node such as tags, delete lock,
        or SSH keys.
      parameters:
        - name: uuid
          in: path
          required: true
          description: The UUID of the node to update.
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNodesResponse'
      tags:
        - NodeService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/UpdateNodePayload'
  /v1/nodes/{uuid}/wait:
    get:
      operationId: WaitNodeByUUID
      description: |-
        Wait for a node to reach a specific state.

        Blocks until the specified node reaches one of the desired states
        or the timeout is reached.
      parameters:
        - name: uuid
          in: path
          required: true
          description: The UUID of the node to wait for.
          schema:
            type: string
            format: uuid
        - name: states
          in: query
          required: false
          description: |-
            The desired state(s) to wait for. The request completes when any of these
            states is reached.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/NodeState'
        - name: timeout_ms
          in: query
          required: false
          description: Timeout in milliseconds. Use -1 for infinite wait.
          schema:
            type: integer
            format: int64
      responses:
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitNodesResponse'
      tags:
        - NodeService
security:
  - bearerToken: []
components:
  schemas:
    AWSConfig:
      type: object
      required:
        - dedicated_host
        - region
        - machine_type
      properties:
        vpc_id:
          type: string
          description: |-
            The VPC ID where the instance will be launched. If not specified, the
            default VPC for the region will be used.
        subnet_id:
          type: string
          description: |-
            The subnet ID where the instance will be launched. If not specified,
            a subnet will be selected from the VPC.
        security_group_ids:
          type: array
          items:
            type: string
          description: |-
            Security group IDs to attach to the instance. If not specified, the
            default security group for the VPC will be used.
        iam_instance_profile:
          type: string
          description: The IAM instance profile ARN or name to attach to the instance.
        root_volume:
          allOf:
            - $ref: '#/components/schemas/AWSEBSConfig'
          description: |-
            Root EBS volume configuration. If not specified, provider defaults
            will be used.
        additional_volumes:
          type: array
          items:
            $ref: '#/components/schemas/AWSEBSConfig'
          description: Additional EBS volumes to attach to the instance.
        dedicated_host:
          type: boolean
          description: |-
            Whether to use a dedicated host. Dedicated hosts provide visibility and
            control over how instances are placed on physical servers.
        placement_group:
          type: string
          description: |-
            Placement group name for the instance. Placement groups influence how
            instances are placed on underlying hardware.
        region:
          type: string
          description: The AWS region where the machine is located.
        machine_type:
          type: string
          description: |-
            The AWS machine type. This determines the compute resources
            (CPU, memory, etc.) available on the machine. The valid values depend
            on the chosen provider.
      description: AWSConfig contains AWS-specific configuration for node provisioning.
    AWSEBSConfig:
      type: object
      required:
        - size_gib
        - volume_type
        - encrypted
        - delete_on_termination
      properties:
        device_name:
          type: string
          description: |-
            The device name (e.g., "/dev/sda1", "/dev/xvdf"). Required for
            additional volumes.
        size_gib:
          type: integer
          format: uint32
          description: Size of the volume in GiB.
        volume_type:
          type: string
          description: The volume type (gp3, gp2, io1, io2, st1, sc1, standard).
        iops:
          type: integer
          format: uint32
          description: The number of IOPS. Only valid for io1, io2, and gp3 volumes.
        throughput_mibps:
          type: integer
          format: uint32
          description: The throughput in MiB/s. Only valid for gp3 volumes.
        encrypted:
          type: boolean
          description: Whether the volume should be encrypted.
        kms_key_id:
          type: string
          description: |-
            The KMS key ID for encryption. If encrypted is true and this is not
            specified, the default EBS encryption key will be used.
        delete_on_termination:
          type: boolean
          description: Whether to delete the volume when the instance is terminated.
      description: AWSEBSConfig defines the configuration for an AWS EBS volume.
    CheckAuthorizationRequest:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
          description: |-
            The request ID is a unique identifier for the request.  This is used to
            track the request in the system and should be provided by the client.
      description: The request message for checking authorization given a request ID.
    CheckAuthorizationResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/CheckAuthorizationResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: The response message for checking authorization.
    CheckAuthorizationResponseData:
      type: object
      required:
        - token
        - organization_name
        - organization_display_name
        - registry
        - organization_uuid
        - user_uuid
      properties:
        token:
          type: string
          description: The authorization token which can be used to authenticate requests.
        organization_name:
          type: string
          description: The organization name the token is associated with.
        organization_display_name:
          type: string
          description: The display name of the organization the token is associated with.
        registry:
          type: string
          description: The global image registry.
        organization_uuid:
          type: string
          format: uuid
          description: The UUID of the organization the token is associated with.
        user_uuid:
          type: string
          format: uuid
          description: The UUID of the user who approved the login.
    CloudProvider:
      type: string
      enum:
        - manual
        - aws
      description: |-
        CloudProvider identifies the cloud infrastructure provider where nodes are
        provisioned.
    CloudProviderConfig:
      type: object
      properties:
        aws:
          allOf:
            - $ref: '#/components/schemas/AWSConfig'
          description: AWS-specific configuration.
      description: |-
        CloudProviderConfig contains provider-specific configuration for node
        provisioning.
    DestroyNodeResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/DestroyNodeResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Response message for deleting nodes.
    DestroyNodeResponseData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
          description: The deleted nodes (with their final state before deletion).
    GetAuthorizationResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/GetAuthorizationResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: The response message for getting authorization details.
    GetAuthorizationResponseData:
      type: object
      required:
        - organization_name
        - organization_display_name
        - registry
        - organization_uuid
        - permissions
      properties:
        organization_name:
          type: string
          description: The organization name the token is associated with.
        organization_display_name:
          type: string
          description: The display name of the organization the token is associated with.
        registry:
          type: string
          description: The global image registry.
        organization_uuid:
          type: string
          format: uuid
          description: The UUID of the organization the token is associated with.
        permissions:
          type: array
          items:
            type: string
          description: The permissions of the organization that are not revoked.
    Image:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The canonical name of the image.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ImageTag'
          description: The list of tags for the image.  Only populated when details are requested.
    ImageTag:
      type: object
      required:
        - name
        - digest
        - size
        - push_time
      properties:
        name:
          type: string
          description: The tag name.
        digest:
          type: string
          description: The digest for the tag.
        size:
          type: integer
          format: uint64
          description: The size of the image in bytes.
        push_time:
          type: string
          format: date-time
          description: The push time of the image.
    ListImagesResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ListImagesResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Standard response envelope wrapping all API responses.
    ListImagesResponseData:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          description: The list of images.
    ListMachineTypesResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ListMachineTypesResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Response message for listing machine types.
    ListMachineTypesResponseData:
      type: object
      properties:
        machine_types:
          type: array
          items:
            $ref: '#/components/schemas/MachineType'
          description: The list of available machine types.
    ListMetroResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ListMetroResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Standard response envelope wrapping all API responses.
    ListMetroResponseData:
      type: object
      properties:
        metros:
          type: array
          items:
            $ref: '#/components/schemas/Metro'
          description: The list of metros.
    ListNodesResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ListNodesResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Response message for getting nodes.
    ListNodesResponseData:
      type: object
      required:
        - total_count
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
          description: The list of nodes matching the request.
        total_count:
          type: integer
          format: uint32
          description: Total count of nodes matching the filters (for pagination).
    ListRegionsResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ListRegionsResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Response message for listing regions.
    ListRegionsResponseData:
      type: object
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
          description: The list of available regions.
    MachineType:
      type: object
      required:
        - name
        - vcpus
        - memory_mib
        - nested_virtualization
      properties:
        name:
          type: string
          description: The machine type identifier (e.g., "m5.xlarge", "n2-standard-4").
        description:
          type: string
          description: Human-readable description.
        vcpus:
          type: integer
          format: uint32
          description: Number of vCPUs.
        memory_mib:
          type: integer
          format: uint64
          description: Memory in MiB.
        category:
          type: string
          description: |-
            Machine category (e.g., "general-purpose", "compute-optimized",
            "memory-optimized").
        available_regions:
          type: array
          items:
            type: string
          description: Regions where this machine type is available.
        nested_virtualization:
          type: boolean
          description: Whether this machine type supports nested virtualization.
      description: Information about an available machine type.
    Metro:
      type: object
      required:
        - uuid
        - endpoint
        - name
        - iata_code
        - country
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the metro.
        endpoint:
          type: string
          format: uri
          description: The API endpoint for the metro.
        name:
          type: string
          description: The name of the metro.
        iata_code:
          type: string
          description: The IATA code of the metro.
        country:
          type: string
          description: The country where the metro is located.
    MutableNodeOperation:
      type: string
      enum:
        - set
        - add
        - del
      description: The operations available on a node's mutable properties.
    MutableNodeProperty:
      type: string
      enum:
        - tags
        - delete_lock
        - ssh_keys
        - api_endpoint
      description: The mutable properties of a node which can be updated.
    NameOrUUID:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: Mutually exclusive with name.
        name:
          type: string
          description: Mutually exclusive with UUID.
        metro:
          type: string
          description: |-
            (Only applies when using global control plane).
            The metro of the resource.
      description: An identifier for a node.  Either a name or a UUID.
    Node:
      type: object
      required:
        - uuid
        - name
        - created_at
        - state
        - vcpus
        - memory_mib
        - uptime_seconds
        - delete_lock
      properties:
        uuid:
          type: string
          format: uuid
          description: |-
            The UUID of the machine.

            This is a unique identifier for the machine that is generated when the
            machine is created. The UUID is used to reference the machine in API calls and
            can be used to identify the machine in all API calls that require a machine
            identifier.
        name:
          type: string
          description: |-
            The name of the machine.

            This is a human-readable name that can be used to identify the machine.
            The name must be unique within the context of your account. The name can
            also be used to identify the machine in API calls.
        created_at:
          type: string
          format: date-time
          description: The time the machine was created.
        updated_at:
          type: string
          format: date-time
          description: The time the machine was last updated.
        state:
          allOf:
            - $ref: '#/components/schemas/NodeState'
          description: The current state of the machine.
        state_message:
          type: string
          description: |-
            An optional message providing additional information about the current
            state, particularly useful for error states.
        cloudprovider:
          allOf:
            - $ref: '#/components/schemas/CloudProvider'
          description: The cloud provider where this machine is provisioned.
        vcpus:
          type: integer
          format: uint32
          description: The number of vCPUs available on this machine.
        memory_mib:
          type: integer
          format: uint64
          description: The amount of memory in MiB available on this machine.
        ssh_keys:
          type: array
          items:
            $ref: '#/components/schemas/SSHKey'
          description: The SSH keys configured for access to this machine.
        public_ipv4:
          type: string
          format: ipv4
          description: The public IPv4 address of the machine, if assigned.
        public_ipv6:
          type: string
          format: ipv6
          description: The public IPv6 address of the machine, if assigned.
        private_ipv4:
          type: string
          format: ipv4
          description: The private IPv4 address of the machine within the provider's network.
        metro:
          type: string
          description: The Unikraft Cloud metro this machine is associated with.
        provider_instance_id:
          type: string
          description: The provider-specific instance ID or resource identifier.
        provider_config:
          allOf:
            - $ref: '#/components/schemas/CloudProviderConfig'
          description: Provider-specific configuration that was used to provision this node.
        tags:
          type: object
          additionalProperties:
            type: string
          description: User-defined tags for organizing and filtering nodes.
        ready_at:
          type: string
          format: date-time
          description: The time when the machine became ready (entered READY state).
        uptime_seconds:
          type: integer
          format: uint64
          description: The total uptime of the machine in seconds since it became ready.
        delete_lock:
          type: boolean
          description: |-
            Whether the machine is protected from deletion. When true, delete operations
            will fail until this is set to false.
        api_endpoint:
          type: string
          description: The API endpoint for the node, used to connect to the node's platform SDK.
      description: |-
        Node represents a physical or virtual compute node provisioned on a
        cloud provider for use as part of the Unikraft Cloud infrastructure.

        Node nodes are the underlying compute resources where Unikraft Cloud
        instances run.  They are provisioned on-demand across multiple cloud
        providers and managed through a unified API.
    NodeState:
      type: string
      enum:
        - unspecified
        - pending
        - provisioning
        - configuring
        - ready
        - deprovisioning
        - deprovisioned
        - error
        - maintenance
      description: |-
        NodeState defines the provisioning lifecycle state of a machine which will
        run the Unikraft Cloud Platform.
    ProvisionNodeRequest:
      type: object
      required:
        - ssh_keys
      properties:
        name:
          type: string
          description: |-
            Optional name for the node. If not provided, a name will be
            auto-generated.
        cloudprovider:
          allOf:
            - $ref: '#/components/schemas/CloudProvider'
          description: The cloud provider where the machine should be provisioned.
        ssh_keys:
          type: array
          items:
            $ref: '#/components/schemas/SSHKey'
          description: SSH keys for accessing the node. At least one key is required.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Optional user-defined tags.
        cloudprovider_config:
          allOf:
            - $ref: '#/components/schemas/CloudProviderConfig'
          description: Optional provider-specific configuration for advanced customization.
        metro:
          type: string
          description: The Unikraft Cloud metro to associate this machine with.
        platform_config:
          type: object
          additionalProperties:
            type: string
          description: |-
            Optional user overrides for platform configuration. Keys should be
            kebab-case (e.g., "vm-user-min-memory").
        image_pulls:
          type: array
          items:
            type: string
          description: Optional image references to pre-pull on the provisioned machine.
        net_count:
          type: integer
          format: uint32
          description: Optional network count override. If not specified, defaults to 1000.
      description: Request message for creating a new node.
    ProvisionNodeResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ProvisionNodeResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Response message for creating a node.
    ProvisionNodeResponseData:
      type: object
      required:
        - node
      properties:
        node:
          allOf:
            - $ref: '#/components/schemas/Node'
          description: The created node.
    Region:
      type: object
      required:
        - name
        - iata
      properties:
        name:
          type: string
          description: The region identifier (e.g., "us-east-1", "us-central1").
        iata:
          type: string
          description: The IATA code for the region.
      description: Information about an available region.
    RequestSigninRequest:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
          description: |-
            The hostname is the name of the machine making the request.  This is
            mandatory as it consitutes a unique identifier for the machine.
        os:
          type: string
          description: The operating system of the machine making the request.
        os_version:
          type: string
          description: |-
            The version of the operating system of the machine making the request, if
            available.

            For Android, it's like "10", "11", "12", etc.  For iOS and macOS it's like
            "15.6.1" or "12.4.0".  For Windows it's like "10.0.19044.1889". For FreeBSD
            it's like "12.3-STABLE".  For Linux, this is simply the kernel version on
            Linux, like "5.10.0-17-amd64".
        container:
          type: boolean
          description: A best-effort whether the client is running in a container.
        distro:
          type: string
          description: The OS distribution, if known.  E.g. "debian", "ubuntu", "nixos", ...
        distro_version:
          type: string
          description: The OS distribution version if known.  E.g. "20.04", ...
        distro_codename:
          type: string
          description: TThe OS distribution codename if known.  E.g. "jammy", "bullseye", ...
        cli_version:
          type: string
          description: |-
            The CLI version is the version of the Unikraft CLI that is making the
            request.
        goarch:
          type: string
          description: If available, the GOARCH value (of the built binary).
        goos:
          type: string
          description: If available, the GOOS value (of the built binary)
        go_version:
          type: string
          description: if available, the Go version binary was built with.
      description: The request message for a sign-in request.
    RequestSigninResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/RequestSigninResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: The response message for a sign-in request.
    RequestSigninResponseData:
      type: object
      required:
        - authorization_url
        - request_id
      properties:
        authorization_url:
          type: string
          description: The full URL which can be used to remotely confirm the signin.
        request_id:
          type: string
          description: |-
            A unique identifier for the request.  This can be used to track the
            request in the system.
    SSHKey:
      type: object
      required:
        - name
        - public_key
      properties:
        name:
          type: string
          description: A name or label for this SSH key.
        public_key:
          type: string
          description: |-
            The SSH public key in OpenSSH format (e.g., "ssh-rsa AAAA... user@host"
            or "ssh-ed25519 AAAA... user@host").
      description: SSHKey represents an SSH public key for authentication.
    UnikraftCloud.Common.ResponseError:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          format: uint64
          description: The HTTP status code of the error.
      description: The error response message for an API request.
    UnikraftCloud.Common.ResponseStatus:
      type: string
      enum:
        - success
        - error
        - partial_success
      description: The response status of an API request.
    UpdateNodePayload:
      type: object
      required:
        - property
        - operation
      properties:
        property:
          allOf:
            - $ref: '#/components/schemas/MutableNodeProperty'
          description: The property to update.
        operation:
          allOf:
            - $ref: '#/components/schemas/MutableNodeOperation'
          description: The operation to perform on the property.
        value:
          type: string
          description: |-
            The value for the update operation. The type depends on the property:
            - TAGS: google.protobuf.Struct with key-value pairs
            - DELETE_LOCK: google.protobuf.Value with boolean
            - SSH_KEYS: google.protobuf.ListValue with SSHKey objects
            - API_ENDPOINT: the URL as plain text
      description: UpdateNodePayload contains the changes to apply to a node.
    UpdateNodesResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/UpdateNodesResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Response message for updating nodes.
    UpdateNodesResponseData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
          description: The updated nodes.
    WaitNodesResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/UnikraftCloud.Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/WaitNodesResponseData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/UnikraftCloud.Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: Response message for wait operations.
    WaitNodesResponseData:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
          description: The nodes after reaching the desired state.
  securitySchemes:
    bearerToken:
      type: http
      scheme: Bearer
      description: A bearer token in the Authorization header.
servers:
  - url: https://controlplane.unikraft.cloud
    description: Official Unikraft Cloud Control Plane API
    variables: {}
