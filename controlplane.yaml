tags:
    - name: Auth
      description: Authenticate with Unikraft Cloud.
    - name: Images
    - name: Metros
    - name: NodeActivationService
      description: |-
        NodeActivationService provides APIs for activating and renewing node
        licenses.
    - name: NodeHeartbeatService
      description: NodeHeartbeatService provides APIs for reporting node platform status.
    - name: NodeService
      description: |-
        NodeService service provides APIs for provisioning and managing compute nodes
        across multiple cloud providers for use in Unikraft Cloud.
