          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: |-
        The response message for getting the metrics of one or more instance(s) by
        their UUID(s) or name(s).
    Instances.GetInstancesMetricsResponseInstanceMetrics:
      type: object
      required:
        - uuid
        - name
        - rss_bytes
        - cpu_time_ms
        - boot_time_us
        - net_time_us
        - rx_bytes
        - rx_packets
        - tx_bytes
        - tx_packets
        - nconns
        - nreqs
        - nqueued
        - ntotal
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: Indicates whether the operation was successful for this item.
        message:
          type: string
          description: An optional message providing additional information.
        error:
          type: integer
          format: int32
          description: An optional error code.
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The human-readable name of the resource.
        rss_bytes:
          type: integer
          format: uint64
          description: |-
            Resident set size of the VMM in bytes.

            The resident set size (RSS) specifies the amount of physical memory that
            has been touched by the instance and is currently reserved for the
            instance on the Unikraft Cloud server. The RSS grows until the instance
            has touched all memory assigned to it via the memory_mb setting and may
            also exceed this value as supporting services running outside the
            instance acquire memory. The RSS is different from the current amount of
            memory allocated by the application, which is likely to fluctuate over
            the lifetime of the application. The RSS is not a cumulative metric.
            When the instance is stopped rss goes down to 0.
          example: 5677765543
        cpu_time_ms:
          type: integer
          format: uint64
          description: Consumed CPU time in milliseconds.
          example: 560007005
        boot_time_us:
          type: integer
          format: uint64
          description: |-
            The boot time of the instance in microseconds. We take a pragmatic
            approach is to define the boot time. We calculate this as the difference
            in time between the moment the virtualization toolstack is invoked to
            respond to a VM boot request and the moment the OS starts executing user
            code (i.e., the end of the guest OS boot process). This is essentially the
            time that a user would experience in a deployment, minus the application
            initialization time, which we leave out since it is independent from the
            OS.
          example: 560007005
        net_time_us:
          type: integer
          format: uint64
          description: |-
            This is the time it took for the user-level application to start listening
            on a non-localhost port measured in microseconds. This is the time from
            when the instance started until it reasonably ready to start responding to
            network requests. This is useful for measuring the time it takes for the
            instance to become operationally ready.
          example: 560007005
        rx_bytes:
          type: integer
          format: uint64
          description: Total amount of bytes received from network.
          example: 12312353
        rx_packets:
          type: integer
          format: uint64
          description: Total count of packets received from network.
          example: 43432
        tx_bytes:
          type: integer
          format: uint64
          description: Total amount of bytes transmitted over network.
          example: 6565643
        tx_packets:
          type: integer
          format: uint64
          description: Total count of packets transmitted over network.
          example: 54534
        nconns:
          type: integer
          format: uint64
          description: Number of currently established inbound connections (non-HTTP).
          example: 5
        nreqs:
          type: integer
          format: uint64
          description: Number of in-flight HTTP requests.
          example: 12
        nqueued:
          type: integer
          format: uint64
          description: Number of queued inbound connections and HTTP requests.
          example: 5
        ntotal:
          type: integer
          format: uint64
          description: Total number of inbound connections and HTTP requests handled.
          example: 21
      description: Per-item result for a get instances metrics operation.
