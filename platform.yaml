    Autoscale.AdjustmentType:
      type: string
      enum:
        - change
        - exact
        - percentage
      description: |-
        AdjustmentType defines the type of adjustment to be made in an autoscaling
        step policy.
    Autoscale.AutoscalePolicy:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the policy.
        enabled:
          type: boolean
          description: Whether the policy is enabled.
        metric:
          allOf:
            - $ref: '#/components/schemas/Autoscale.StepPolicyMetric'
          description: Metric to use for the step policy (only for step policies).
        adjustment_type:
          allOf:
            - $ref: '#/components/schemas/Autoscale.AdjustmentType'
          description: The type of adjustment to be made in the step policy (only for step policies).
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Autoscale.AutoscalePolicyStep'
          description: |-
            The steps for the step policy. Each step defines an adjustment value and
            optional bounds.
      description: |-
        AutoscalePolicy defines the autoscale policy for a service. Right now it
        contains fields from both the `ondemand` and `step` policies. They are
        marked both as optional, so only one of them should be set at a time. This
        is a current limitation of the API design.
    Autoscale.AutoscalePolicyStep:
      type: object
      required:
        - adjustment
      properties:
        adjustment:
          type: integer
          format: int64
          description: The adjustment value for the step.
        lower_bound:
          type: integer
          format: int64
          description: Lower bound for the step.
        upper_bound:
          type: integer
          format: int64
          description: Upper bound for the step.
      description: A single step in a step autoscaling policy.
