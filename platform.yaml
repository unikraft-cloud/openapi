                        format: uint64
                - oneOf:
                    - title: message
                      type: object
                      properties:
                        message:
                            type: string
                            description: An optional message providing additional information about the response.
            description: The response to a CreateAutoscaleConfigurationRequest.
        CreateAutoscaleConfigurationResponseConfigurationsResponse:
            type: object
            properties:
                status:
                    enum:
                        - "success"
                        - "error"
                    type: string
                    description: The status of the response.
                    format: enum
                uuid:
                    type: string
                    description: The UUID of the service where the configuration was created.
                    format: uuid
                name:
                    type: string
                    description: The name of the service where the configuration was created.
        CreateAutoscaleConfigurationResponseData:
            type: object
            properties:
                service_groups:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreateAutoscaleConfigurationResponseConfigurationsResponse'
                    description: The configuration(s) which were created by the request.
        CreateCertificateRequest:
            type: object
            allOf:
                - type: object
                  properties:
                    cn:
                        type: string
                        description: The common name (CN) of the certificate.
                    chain:
                        type: string
                        description: The chain of the certificate.
                    key:
                        type: string
                        description: The private key of the certificate.
                - oneOf:
                    - title: name
                      type: object
                      properties:
                        name:
                            type: string
                            description: |-
                                The name of the certificate.

                                This is a human-readable name that can be used to identify the certificate.
                                The name must be unique within the context of your account.  If no name is
                                specified, a random name is generated for you.  The name can also be used
                                to identify the certificate in API calls.
            description: The request message for creating/uploading a new certificate.
        CreateCertificateResponse:
            type: object
            properties:
                status:
                    enum:
                        - "success"
                        - "error"
                    type: string
                    description: The status of the response.
                    format: enum
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/CreateCertificateResponseData'
                    description: The response data for this request.
                op_time_us:
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                        the request and generate the response.
                    format: uint64
