openapi: 3.0.3
info:
    title: Unikraft Cloud Platform API
    description: This specification describes the Unikraft Cloud Platform API, which provides mechanisms to interact with Unikraft Cloud metros. It allows you to create, manage, and interact with instances running on the platform.
    contact:
        name: Unikraft Support
        url: https://unikraft.com/contact
        email: support@unikraft.com
    version: v1.0.0
servers:
    - url: https://api.{metro}.unikraft.cloud
      description: Official Unikraft Cloud Metros
      variables:
        metro:
            enum:
                - dal0
                - fra0
                - sin0
                - was1
            default: fra0
            description: The IATA and numeric code of the metro to connect to.
paths:
    /v1/certificates:
        get:
            tags:
                - CertificateService
            description: |-
                Get one or many certificates with their current status and configuration.
                 It's possible to filter this list by name or UUID.
            operationId: GetCertificates
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the certificate in the response.  By
                     default this is set to true, meaning that all information about the
                     certificate will be included in the response.  If set to false, only the
                     basic information about the certificate will be included, such as its name
                     and UUID.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetCertificatesRequestID'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCertificatesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - CertificateService
            description: Upload a new certificate with the given configuration.
            operationId: CreateCertificate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCertificateRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateCertificateResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - CertificateService
            description: |-
                Delete a specified certificate by its UUID.  After this call the UUID of
                 the certificate are no longer valid.
            operationId: DeleteCertificates
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DeleteCertificatesRequestID'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCertificatesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/certificates/{uuid}:
        get:
            tags:
                - CertificateService
            description: Get a specified certificate by its UUID.
            operationId: GetCertificateByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCertificatesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - CertificateService
            description: |-
                Delete the specified certificate(s).  After this call the name of the
                 certificate(s) are no longer valid.
            operationId: DeleteCertificateByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCertificatesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/images/digest/{digest}:
        get:
            tags:
                - ImageService
            description: GetImageByDigest retrieves an image by its digest.
            operationId: GetImageByDigest
            parameters:
                - name: digest
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetImageResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/images/tag/{tag}:
        get:
            tags:
                - ImageService
            description: GetImageByTag retrieves an image by its tag.
            operationId: GetImageByTag
            parameters:
                - name: tag
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetImageResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances:
        get:
            tags:
                - InstanceService
            description: |-
                Get one or many instances with their current status and configuration.
                 It's possible to filter this list by name or UUID.
            operationId: GetInstances
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the instance in the response.  By default
                     this is set to true, meaning that all information about the instance will
                     be included in the response.  If set to false, only the basic information
                     about the instance will be included, such as its name and UUID.
                  schema:
                    type: boolean
                - name: metrics
                  in: query
                  description: |-
                    Whether to include metrics about the instance in the response.  By default
                     this is set to false, meaning that no metrics will be included in the
                     response.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetInstancesRequestID'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - InstanceService
            description: Creates one or more new instances.
            operationId: CreateInstance
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateInstanceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateInstanceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - InstanceService
            description: |-
                Delete the specified instance(s).  After this call the name of the
                 instances are no longer valid.  If the instances are currently running,
                 they are force stopped.
            operationId: DeleteInstances
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteInstancesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/logs:
        put:
            tags:
                - InstanceService
            description: Retrieve the logs of an instance by its UUID or name.
            operationId: GetInstanceLogs
            parameters:
                - name: uuid
                  in: query
                  description: |-
                    The UUID of the instance to retrieve logs for.  Mutually exclusive with
                     name.
                  schema:
                    type: string
                - name: name
                  in: query
                  description: |-
                    The name of the instance to retrieve logs for.  Mutually exclusive with
                     UUID.
                  schema:
                    type: string
                - name: offset
                  in: query
                  description: |-
                    The byte offset of the log output to receive.  A negative sign makes the
                     offset relative to the end of the log.
                  schema:
                    type: integer
                    format: uint64
                - name: limit
                  in: query
                  description: The amount of bytes to return at most.
                  schema:
                    type: integer
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceLogsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/metrics:
        put:
            tags:
                - InstanceService
            description: Get the metrics of an instance by its UUID or name.
            operationId: GetInstanceMetrics
            parameters:
                - name: uuid
                  in: query
                  description: |-
                    The UUID of the instance to retrieve metrics for.  Mutually exclusive
                     with name.
                  schema:
                    type: string
                - name: name
                  in: query
                  description: |-
                    The name of the instance to retrieve metrics for.  Mutually exclusive
                     with UUID.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceMetricsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/start:
        put:
            tags:
                - InstanceService
            description: |-
                Starts previously stopped instances by their UUID(s) or name(s) or does
                 nothing if the instance is already running.
            operationId: StartInstances
            requestBody:
                content:
                    application/json: {}
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StartInstanceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/stop:
        put:
            tags:
                - InstanceService
            description: |-
                Stops one or more running instance by their UUID(s) or name(s) or does
                 nothing if the instance is already stopped.
            operationId: StopInstances
            parameters:
                - name: force
                  in: query
                  description: Whether to immediately force stop the instance.
                  schema:
                    type: boolean
                - name: drain_timeout_ms
                  in: query
                  description: |-
                    Timeout for draining connections in milliseconds.  The instance does not
                     receive new connections in the draining phase.  The instance is stopped
                     when the last connection has been closed or the timeout expired.  The
                     maximum timeout may vary.  Use -1 for the largest possible value.

                     Note: This endpoint does not block.  Use the wait endpoint for the
                     instance to reach the stopped state.
                  schema:
                    type: integer
                    format: uint64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/StopInstancesRequestID'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StopInstanceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/wait:
        get:
            tags:
                - InstanceService
            description: |-
                Waits for an instance to reach a certain state by its UUID or name.

                 If the instance is already in the desired state, the request will return
                 immediately.  If the instance is not in the desired state, the request will
                 block until the instance reaches the desired state or the timeout is
                 reached.  If the timeout is reached, the request will fail with an error.
                 If the timeout is -1, the request will block indefinitely until the
                 instance reaches the desired state.
            operationId: WaitInstances
            parameters:
                - name: state
                  in: query
                  description: The desired state to wait for.  Default is `running`.
                  schema:
                    enum:
                        - "stopped"
                        - "starting"
                        - "running"
                        - "draining"
                        - "stopping"
                        - "standby"
                    type: string
                    format: enum
                - name: timeout_ms
                  in: query
                  description: |-
                    Timeout in milliseconds to wait for the instance to reach the desired
                     state.  If the timeout is reached, the request will fail with an error.
                     A value of -1 means to wait indefinitely until the instance reaches the
                     desired state.
                  schema:
                    type: integer
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/WaitInstancesRequestID'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WaitInstanceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/{uuid}:
        get:
            tags:
                - InstanceService
            description: Get a single instance by its ID which can either be its name or UUID.
            operationId: GetInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        delete:
            tags:
                - InstanceService
            description: |-
                Delete a specified instance by its UUID.  After this call the UUID of the
                 instances are no longer valid.  If the instances are currently running,
                 they are force stopped.
            operationId: DeleteInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteInstancesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/{uuid}/logs:
        put:
            tags:
                - InstanceService
            description: Retrieve the logs of an instance by its UUID.
            operationId: GetInstanceLogsByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
                - name: offset
                  in: query
                  description: |-
                    The byte offset of the log output to receive.  A negative sign makes the
                     offset relative to the end of the log.
                  schema:
                    type: integer
                    format: uint64
                - name: limit
                  in: query
                  description: The amount of bytes to return at most.
                  schema:
                    type: integer
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceLogsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/{uuid}/metrics:
        put:
            tags:
                - InstanceService
            description: Get the metrics of an instance by its UUID.
            operationId: GetInstanceMetricsByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceMetricsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/{uuid}/start:
        put:
            tags:
                - InstanceService
            description: |-
                Starts previously stopped instance by its UUID or does nothing if the
                 instance is already running.
            operationId: StartInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StartInstanceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/{uuid}/stop:
        put:
            tags:
                - InstanceService
            description: |-
                Stops a running instance by its UUID or does nothing if the instance is
                 already stopped.
            operationId: StopInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
                - name: force
                  in: query
                  description: Whether to immediately force stop the instance.
                  schema:
                    type: boolean
                - name: drain_timeout_ms
                  in: query
                  description: |-
                    Timeout for draining connections in milliseconds.  The instance does not
                     receive new connections in the draining phase.  The instance is stopped
                     when the last connection has been closed or the timeout expired.  The
                     maximum timeout may vary.  Use -1 for the largest possible value.

                     Note: This endpoint does not block.  Use the wait endpoint for the instance
                     to reach the stopped state.
                  schema:
                    type: integer
                    format: uint64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StopInstanceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/instances/{uuid}/wait:
        get:
            tags:
                - InstanceService
            description: |-
                Waits for an instance to reach a certain state by its UUID.

                 If the instance is already in the desired state, the request will return
                 immediately.  If the instance is not in the desired state, the request will
                 block until the instance reaches the desired state or the timeout is
                 reached.  If the timeout is reached, the request will fail with an error.
                 If the timeout is -1, the request will block indefinitely until the
                 instance reaches the desired state.
            operationId: WaitInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
                - name: state
                  in: query
                  description: The desired state to wait for.  Default is `running`.
                  schema:
                    enum:
                        - "stopped"
                        - "starting"
                        - "running"
                        - "draining"
                        - "stopping"
                        - "standby"
                    type: string
                    format: enum
                - name: timeout_ms
                  in: query
                  description: |-
                    Timeout in milliseconds to wait for the instance to reach the desired
                     state.  If the timeout is reached, the request will fail with an error.
                     A value of -1 means to wait indefinitely until the instance reaches the
                     desired state.
                  schema:
                    type: integer
                    format: int64
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WaitInstanceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        Certificate:
            type: object
            properties:
                uuid:
                    type: string
                    description: |-
                        The UUID of the certificate.

                         This is a unique identifier for the certificate that is generated when the
                         certificate is created.  The UUID is used to reference the certificate in
                         API calls and can be used to identify the certificate in all API calls that
                         require an identifier.
                name:
                    type: string
                    description: |-
                        The name of the certificate.

                         This is a human-readable name that can be used to identify the certificate.
                         The name must be unique within the context of your account.  The name can
                         also be used to identify the certificate in API calls.
                created_at:
                    type: string
                    description: The time the certificate was created.
                    format: date-time
                common_name:
                    type: string
                state:
                    enum:
                        - "pending"
                        - "valid"
                        - "error"
                    type: string
                    format: enum
        CreateCertificateRequest:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        The name of the certificate.

                         This is a human-readable name that can be used to identify the certificate.
                         The name must be unique within the context of your account.  If no name is
                         specified, a random name is generated for you.  The name can also be used
                         to identify the certificate in API calls.
                cn:
                    type: string
                    description: The common name (CN) of the certificate.
                chain:
                    type: string
                    description: The chain of the certificate.
                key:
                    type: string
                    description: The private key of the certificate.
            description: The request message for creating/uploading a new certificate.
        CreateCertificateResponse:
            type: object
            properties:
                status:
                    enum:
                        - "success"
                        - "error"
                    type: string
                    description: The status of the response.
                    format: enum
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/CreateCertificateResponseData'
                    description: The response data for this request.
                op_time_us:
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                         the request and generate the response.
                    format: uint64
            description: The response message for creating of a certificate.
        CreateCertificateResponseData:
            type: object
            properties:
                certificates:
                    type: array
                    items:
                        $ref: '#/components/schemas/Certificate'
                    description: |-
                        The certificate which was created by this request.

                         Note: only one certificate can be specified in the request, so this
                         will always contain a single entry.
        CreateInstanceRequest:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        (Optional).  The name of the instance.

                         If not provided, a random name will be generated. The name must be unique.
                image:
                    type: string
                    description: The image to use for the instance.
                args:
                    type: array
                    items:
                        type: string
                    description: (Optional).  The arguments to pass to the instance when it starts.
                env:
                    type: object
                    additionalProperties:
                        type: string
                    description: (Optional).  Environment variables to set for the instance.
                memory_mb:
                    type: integer
                    description: (Optional).  Memory in MB to allocate for the instance.  Default is 128.
                    format: int64
                service_group:
                    allOf:
                        - $ref: '#/components/schemas/CreateInstanceRequestServiceGroup'
                    description: |-
                        (Optional).  The service group configuration when creating an instance.

                         When creating an instance, either a previously created (persistent) service
                         group can be referenced (either through its name or UUID), or a new
                         (ephemeral) service group can be created for the instance by specifying the
                         list of services it should expose and optionally the domains it should use.
                volumes:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreateInstanceRequestVolume'
                    description: |-
                        Volumes to attach to the instance.

                         This list can contain both existing and new volumes to create as part of
                         the instance creation.  Existing volumes can be referenced by their name or
                         UUID.  New volumes can be created by specifying a name, size in MiB, and
                         mount point in the instance.  The mount point is the directory in the
                         instance where the volume will be mounted.
                autostart:
                    type: boolean
                    description: Whether the instance should start automatically on creation.
                replicas:
                    type: integer
                    description: Number of replicas for the instance.
                    format: int64
                restart_policy:
                    enum:
                        - "never"
                        - "always"
                        - "on_failure"
                    type: string
                    description: |-
                        Restart policy for the instance.  This defines how the instance should
                         behave when it stops or crashes.
                    format: enum
                scale_to_zero:
                    allOf:
                        - $ref: '#/components/schemas/InstanceScaleToZero'
                    description: Scale-to-zero configuration for the instance.
                vcpus:
                    type: integer
                    description: Number of vCPUs to allocate for the instance.
                    format: int32
                wait_timeout_ms:
                    type: integer
                    description: |-
                        Timeout to wait for all new instances to reach running state in
                         milliseconds.  If you autostart your new instance, you can wait for it to
                         finish starting with a blocking API call if you specify a wait timeout
                         greater than zero.  No wait performed for a value of 0.
                    format: int64
                features:
                    type: array
                    items:
                        enum:
                            - "delete_on_stop"
                        type: string
                        format: enum
                    description: |-
                        Features to enable for the instance.  Features are specific
                         configurations or capabilities that can be enabled for the instance.
            description: The request message for creating a new instance.
        CreateInstanceRequestCertificate:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        (Optional).  The name of the existing certificate.  Mutually
                         exclusive with UUID.
                uuid:
                    type: string
                    description: |-
                        (Optional).  The UUID for the existing certificate.  Mutually
                         exclusive with name.
            description: |-
                A reference to an existing certificate which can be used for the
                 specified domain.  If unspecified, Unikraft Cloud will
                 automatically generate a new certificate for the domain based on Let's
                 Encrypt and seek to accomplish a DNS-01 challenge.
        CreateInstanceRequestDomain:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Publicly accessible domain name.

                         If this name ends in a period `.` it must be a valid Full Qualified
                         Domain Name (FQDN), e.g. `example.com.`; otherwise it will become a
                         subdomain of the target metro, e.g. `example` becomes
                         `example.fra0.unikraft.app`.
                certificate:
                    allOf:
                        - $ref: '#/components/schemas/CreateInstanceRequestCertificate'
                    description: |-
                        Use an existing certificate for the domain.  If this field is specified,
                         the domain must be associated with a valid certificate.
            description: |-
                The domain configuration for the service group.

                 A domain defines a publicly accessible domain name for the instance.  If
                 the domain name ends with a period `.`, it must be a valid Fully Qualified
                 Domain Name (FQDN), otherwise it will become a subdomain of the target
                 metro.  The domain can be associated with an existing certificate by
                 specifying the certificate's name or UUID.  If no certificate is specified
                 and a FQDN is provided, Unikraft Cloud will automatically generate a new
                 certificate for the domain based on Let's Encrypt and seek to accomplish a
                 DNS-01 challenge.
        CreateInstanceRequestServiceGroup:
            type: object
            properties:
                uuid:
                    type: string
                    description: |-
                        (Optional).  Reference an existing (persistent) service group by its
                         UUID.  Mutually exclusive with name.
                name:
                    type: string
                    description: |-
                        (Optional).  Reference an existing (persistent) service group by its
                         name.  Mutually exclusive with UUID.
                domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreateInstanceRequestDomain'
                    description: |-
                        Similarly, if no existing (persistent) service group is specified via its
                         identifier, a new (ephemeral) service group can be created.  In addition
                         to the services it must expose, you can specify which domains it should
                         use too.
            description: |-
                The service group configuration when creating an instance.

                 If no existing (persistent) service group is specified via its identifier,
                 a new (ephemeral) service group can be created by specifying the services
                 it should expose.  A service defines the configuration settings of an
                 exposed port by the instance.  A service is a combination of a public port,
                 an internal port, and a set of handlers that define how the service will
                 handle incoming connections.
        CreateInstanceRequestVolume:
            type: object
            properties:
                uuid:
                    type: string
                    description: |-
                        The UUID of an existing volume.

                         If this is the only specified field, then it will look up an existing
                         volume by this UUID.
                name:
                    type: string
                    description: |-
                        The name of the volume.

                         If this is the only specified field, then it will look up an existing
                         volume by this name.  If the volume does not exist, the request will
                         fail.  If a new volume is intended to be created, then this field must be
                         specified along with the size in MiB and the mount point in the instance.
                size_mb:
                    type: integer
                    description: |-
                        The size of the volume when creating a new volume.

                         When creating a new volume as part of the instance create request,
                         specify the size of the volume in MiB.
                    format: int64
                at:
                    type: string
                    description: The mount point for the volume in the instance.
                read_only:
                    type: boolean
                    description: |-
                        Whether the volume is read-only.

                         If this field is set to true, the volume will be mounted as read-only in
                         the instance.  This field is optional and defaults to false and is only
                         applicable when using an existing volume.
            description: A volume defines a storage volume that can be attached to the instance.
        CreateInstanceResponse:
            type: object
            properties:
                status:
                    enum:
                        - "success"
                        - "error"
                    type: string
                    description: The status of the response.
                    format: enum
                message:
                    type: string
                    description: An optional message providing additional information about the response.
                data:
                    allOf:
                        - $ref: '#/components/schemas/CreateInstanceResponseData'
                    description: The response data for this request.
                op_time_us:
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                         the request and generate the response.
                    format: uint64
            description: The response message for creating a new instance.
        CreateInstanceResponseData:
            type: object
            properties:
                instances:
                    type: array
                    items:
                        $ref: '#/components/schemas/Instance'
                    description: The instance that was created in this request.
