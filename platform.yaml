    Instances.Instance:
      type: object
      required:
        - uuid
        - name
        - created_at
        - state
        - image
        - memory_mb
        - vcpus
        - restart_policy
        - type
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: Indicates whether the operation was successful for this item.
        message:
          type: string
          description: An optional message providing additional information.
        error:
          type: integer
          format: int32
          description: An optional error code.
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The human-readable name of the resource.
        created_at:
          type: string
          format: date-time
          description: The time the instance was created.
        state:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceState'
          description: |-
            The state of the instance. This indicates the current state of the
            instance, such as whether it is running, stopped, or in an error state.
        private_fqdn:
          type: string
          description: |-
            The internal hostname of the instance. This address can be used privately
            within the Unikraft Cloud network to access the instance. It is not
            accessible from the public Internet.
          example: funky-town-g756b5d.internal
        image:
          type: string
          description: |-
            The image used to create the instance. This is a reference to the
            Unikraft image that was used to create the instance.
          example: nginx:latest
        memory_mb:
          type: integer
          format: uint64
          description: |-
            The amount of memory in megabytes allocated for the instance. This is the
            total amount of memory that is available to the instance for its
            operations.
          example: 1024
        vcpus:
          type: integer
          format: uint32
          description: |-
            The number of vCPUs allocated for the instance. This is the total
            number of virtual CPUs that are available to the instance for its
            operations.
          example: 1
        args:
          type: array
          items:
            type: string
          description: |-
            The arguments passed to the instance when it was started. This is a
            list of command-line arguments that were provided to the instance at
            startup. These arguments can be used to configure the behavior of the
            instance and its applications.
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables set for the instance.
          example:
            ENV_VAR: value
        start_count:
          type: integer
          format: uint64
          description: |-
            The total number of times the instance has been started. This is a counter
            that increments each time the instance is started, regardless of whether it
            was manually stopped or restarted. This can be useful for tracking the
            usage of the instance over time and/or for debugging purposes.

            Not used for template instances.
          example: 6
        restart_count:
          type: integer
          format: uint64
          description: |-
            The total number of times the instance has been restarted. This is a counter
            that increments each time the instance has been restarted. This can be
            useful for tracking the usage of the instance over time and/or for
            debugging purposes.
            Not used for template instances.
          example: 1
        started_at:
          type: string
          format: date-time
          description: |-
            The time the instance was started. This is the timestamp when the
            instance was last started.
            Not used for template instances.
        stopped_at:
          type: string
          format: date-time
          description: |-
            The time the instance was stopped. This is the timestamp when the
            instance was last stopped. If the instance is currently running, this
            field will be empty.
            Not used for template instances.
        uptime_ms:
          type: integer
          format: uint64
          description: |-
            The total amount of time the instance has been running in milliseconds.
            Not used for template instances.
          example: 8954050300
        retained_until:
          type: string
          format: date-time
          description: Time when the instance will be permanently deleted (for deleted instances).
        vmm_start_time_us:
          type: integer
          format: uint64
          description: |-
            (Developer-only). The time taken between the main controller and the
            beginning of execution of the VMM (Virtual Machine Monitor) measured in
            microseconds. This field is primarily used for debugging and performance
            analysis purposes.
            Not used for template instances.
          example: 70040
        vmm_load_time_us:
          type: integer
          format: uint64
          description: |-
            (Developer-only). The time it took the VMM (Virtual Machine Monitor) to
            load the instance's kernel and initramfs into VM memory measured in
            microseconds. This field is primarily used for debugging and performance
            analysis purposes.
            Not used for template instances.
          example: 4050
        vmm_ready_time_us:
          type: integer
          format: uint64
          description: |-
            (Developer-only). The time taken for the VMM (Virtual Machine Monitor) to
            become ready to execute the instance measured in microseconds. This is the
            time from when the VMM started until it was ready to execute the instance's
            code. This field is primarily used for debugging and performance analysis
            purposes.
            Not used for template instances.
          example: 400
        boot_time_us:
          type: integer
          format: uint64
          description: |-
            The boot time of the instance in microseconds. We take a pragmatic
            approach is to define the boot time. We calculate this as the difference
            in time between the moment the virtualization toolstack is invoked to
            respond to a VM boot request and the moment the OS starts executing user
            code (i.e., the end of the guest OS boot process). This is essentially the
            time that a user would experience in a deployment, minus the application
            initialization time, which we leave out since it is independent from the
            OS.
            Not used for template instances.
          example: 9000
        net_time_us:
          type: integer
          format: uint64
          description: |-
            This is the time it took for the user-level application to start listening
            on a non-localhost port measured in microseconds. This is the time from
            when the instance started until it reasonably ready to start responding to
            network requests. This is useful for measuring the time it takes for the
            instance to become operationally ready.
            Not used for template instances.
          example: 11000
        template_time_us:
          type: integer
          format: uint64
          description: Template creation time in microseconds.
        stop_reason:
          type: integer
          format: uint32
          description: |-
            The instance stop reason.

            Provides reason as to why an instance is stopped or in the process of
            shutting down. The stop reason is a bitmask that tells you the origin of
            the shutdown:

            | Bit | 4 | 3 | 2 | 1 | 0 (LSB) |
            |---------|------------|------------|------------|------------|--------------|
            | Purpose | [F]orced | [U]ser | [P]latform | [A]pp | [K]ernel |

            - **Forced**: This was a force stop. A forced stop does not give the
            instance a chance to perform a clean shutdown. Bits 0
            (Kernel) and 1 (App) can thus never be set for forced
            shutdowns. Consequently, there won't be an `exit_code` or
            `stop_code`.
            - **User**: Stop initiated by user, e.g. via an API call.
            - **Platform**: Stop initiated by platform, e.g. an autoscale policy.
            - **App**: The Application exited. The `exit_code` field will be set.
            - **Kernel**: The kernel exited. The `stop_code` field will be set.

            For example, the stop reason will contain the following values in the given
            scenarios:

            | Value | Bitmask | Aliases | Scenario |
            |-------|---------|---------|----------|
            | 28 | `11100` | `FUP--` | Forced user-initiated shutdown. |
            | 15 | `01111` | `-UPAK` | Regular user-initiated shutdown. The application and kernel have exited. The exit_code and stop_code indicate if the application and kernel shut down cleanly. |
            | 13 | `01101` | `-UP-K` | The user initiated a shutdown but the application was forcefully killed by the kernel during shutdown. This can be the case if the image does not support a clean application exit or the application crashed after receiving a termination signal. The exit_code won’t be present in this scenario. |
            | 7 | `00111` | `--PAK` | Unikraft Cloud initiated the shutdown, for example, due to scale-to-zero. The application and kernel have exited. The exit_code and stop_code indicate if the application and kernel shut down cleanly. |
            | 3 | `00011` | `---AK` | The application exited. The exit_code and stop_code indicate if the application and kernel shut down cleanly. |
            | 1 | `00001` | `----K` | The instance likely expierenced a fatal crash and the stop_code contains more information about the cause of the crash. |
            | 0 | `00000` | `-----` | The stop reason is unknown. |
            Not used for template instances.
          example: 15
        exit_code:
          type: integer
          format: uint32
          description: |-
            The application exit code.

            This is the code which the application returns upon leaving its main entry
            point. The encoding of the exit code is application specific. See the
            documentation of the application for more details. Usually, an exit code
            of `0` indicates success / no failure.
            Not used for template instances.
          example: 137
        stop_code:
          type: integer
          format: uint32
          description: |-
            The kernel stop code.

            This value encodes multiple details about the stop irrespective of the
            application.

            ```
            MSB LSB
            ┌──────────────┬──────────┬──────────┬───────────┬────────┐
            │ 31 ────── 24 │ 23 ── 16 │ 15 │ 14 ──── 8 │ 7 ── 0 │
            ├──────────────┼──────────┼──────────┼───────────┼────────┤
            │ reserved[^1] │ errno │ shutdown │ initlevel │ reason │
            └──────────────┴──────────┴──────────┴───────────┴────────┘
            ```

            - **errno**: The application errno, using Linux's errno.h values.
            (Optional, can be 0.)
            - **shutdown**: Whether the shutdown originated from the inittable (0) or
            from the termtable (1).
            - **initlevel**: The initlevel at the time of the stop.
            - **reason**: The reason for the stop. See `StopCodeReason`.

            [^1]: Reserved for future use.
            Not used for template instances.
          example: 33024
        restart_policy:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceRestartPolicy'
          description: |-
            The restart configuration for the instance.

            When an instance stops either because the application exits or the instance
            crashes, Unikraft Cloud can auto-restart your instance. Auto-restarts are
            performed according to the restart policy configured for a particular
            instance.

            The policy can have the following values:

            | Policy | Description |
            |--------------|-------------|
            | `never` | Never restart the instance (default). |
            | `always` | Always restart the instance when the stop is initiated from within the instance (i.e., the application exits or the instance crashes). |
            | `on-failure` | Only restart the instance if it crashes. |

            When an instance stops, the stop reason and the configured restart policy
            are evaluated to decide if a restart should be performed. Unikraft Cloud
            uses an exponential back-off delay (immediate, 5s, 10s, 20s, 40s, ..., 5m)
            to slow down restarts in tight crash loops. If an instance runs without
            problems for 10s the back-off delay is reset and the restart sequence ends.

            The `restart.attempt` attribute reported in counts the number of restarts
            performed in the current sequence. The `restart.next_at` field indicates
            when the next restart will take place if a back-off delay is in effect.

            A manual start or stop of the instance aborts the restart sequence and
            resets the back-off delay.
        scale_to_zero:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceScaleToZero'
          description: |-
            The scale-to-zero configuration for the instance.

            With conventional cloud platforms you need to keep at least one instance
            running at all times to be able to respond to incoming requests. Performing
            a just-in-time cold boot is simply too time-consuming and would create a
            response latency of multiple seconds. This is not the case with Unikraft
            Cloud. Instances on Unikraft Cloud are able to cold boot within
            milliseconds, which allows us to perform low-latency scale-to-zero.

            To enable scale-to-zero for an instance it is sufficient to add a
            `scale_to_zero` configuration block. Unikraft Cloud will then put the
            instance into standby if there is no traffic to your service within the
            window of a cooldown period. When there is new traffic coming in, it is
            automatically started again.

            If you have a heavyweight application that takes long to cold boot or has
            bad first request latency (e.g., with JIT compilation) consider to enable
            stateful scale-to-zero.
        service_group:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceServiceGroup'
          description: The service group configuration for the instance.
        services:
          type: array
          items:
            type: string
          description: 'Services exposed by this instance (format: "protocol:port").'
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstanceVolume'
          description: The list of volumes attached to the instance.
        network_interfaces:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstanceNetworkInterface'
          description: |-
            The network interfaces of the instance.
            Not used for template instances.
        tags:
          type: array
          items:
            type: string
          description: The tags associated with the instance.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: |-
            The annotations associated with the instance.

            Keys follow the Kubernetes annotation key syntax, `[<prefix>/]<name>`: the
            optional prefix is a non-wildcard DNS subdomain of at most 253 characters,
            and the name is at most 63 characters of `[-_.a-zA-Z0-9]` starting and
            ending with an alphanumeric. Values are unconstrained apart from ASCII
            control characters, which are rejected because they would corrupt the
            console log output annotations can be forwarded to.

            An instance holds at most 256 annotations.
          example:
            my-key: value1
            example.com/annotation2: value2
        snapshot:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceSnapshot'
          description: The snapshot of the instance, if exists.
        delete_lock:
          type: boolean
          description: If set to true, the instance cannot be deleted until the lock is removed.
        features:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstanceFeature'
        restart:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceRestartAttempt'
          description: |-
            The current restart attempt for the instance.
            Not used for template instances.
        roms:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstanceRom'
          description: |-
            Read-Only Memory (ROM) blobs to attach to the instance.
            Unikraft Cloud supports the ability to attach Read-Only Memory (ROM) blobs
            to instances. It allows you to create a general-purpose base image and
            then customize individual instances by attaching code or data as separate
            ROM blobs.
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstancePlugin'
          description: |-
            Plugins attached to the instance. Plugins let you attach small helper
            programs to an instance and reach each one over a direct, authenticated
            HTTP endpoint. Each plugin loads from its own ROM image, mounts at
            `/uk/plugins/<plugin_name>`, and is reachable at
            `.../v1/instances/<uuid>/plugins/<plugin_name>/<path>`. At most 8
            plugins may be attached to an instance.
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Instances.Schedule'
          description: |-
            Scheduled operations for this instance.

            Each schedule defines a calendar expression and an action (`start`,
            `stop`, `delete`, or `exec`) to perform at matching times. When the
            action is `exec`, the `args` field of the schedule specifies the command
            to run inside the instance.
        autokill:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceAutokill'
          description: |-
            Automatic delete-on-idle/request-limit configuration.
            Not used for template instances.
        updates:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstancePendingUpdate'
          description: Queued property changes awaiting application.
        sched_priority:
          allOf:
            - $ref: '#/components/schemas/Common.SchedPriority'
          description: |-
            The scheduling priority for the instance. Only present for
            users with scheduling priority override permissions.
          example: high
        template_autokill:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceTemplateAutokill'
          description: |-
            Template-specific automatic delete-on-idle configuration.
            Not used for non-template instances.
        checkpoint_autokill:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceTemplateAutokill'
          description: |-
            Checkpoint-specific automatic delete-on-idle configuration.
            Only used for checkpoint instances.
        private_ip:
          type: string
          description: The private IP address of the instance.
          example: 10.0.0.5
        gateway:
          type: string
          description: The default gateway configured inside the guest.
          example: 10.0.0.1
        nameserver:
          type: string
          description: The DNS resolver configured inside the guest.
          example: 8.8.8.8
        type:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceType'
          description: The type of virtual machine used to run the instance.
        gpus:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstanceGpu'
          description: |-
            GPUs attached to the instance. Only present for instances of type
            `full`.
      description: Instance with per-item response envelope fields merged in.
    Instances.InstanceAutokill:
      type: object
      properties:
        time_ms:
          type: integer
          format: uint64
          description: |-
            Time in milliseconds after the instance was stopped before it is deleted.
            A value of 0 disables time-based autokill.
        num_requests:
          type: integer
          format: uint32
          description: |-
            Maximum number of requests/connections the instance serves before it is
            deleted. A value of 0 disables request-based autokill.
      description: |-
        Automatic delete-on-idle/request-limit configuration for non-template
        instances. Not used for template instances.
    Instances.InstanceFeature:
      type: string
      enum:
        - delete-on-stop
        - nested-virt
      description: |-
        Features are specific configurations or capabilities that can be enabled for
        the instance.

        The list of available features to enable for the instance:

        | Feature            | Description |
        |--------------------|-------------|
        | `delete-on-stop`   | The instance will be deleted when it is stopped. This is useful for instances that are not needed after they are stopped, such as temporary or ephemeral instances. Cannot be combined with a `restart_policy` other than `never`. |
        | `nested-virt`      | Expose virtualization extensions to the guest, so that it can run virtual machines of its own. Requires the `nested_virt` permission. |
    Instances.InstanceGpu:
      type: object
      required:
        - uuid
        - model
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the GPU.
        model:
          type: string
          description: |-
            The GPU model, given as its PCI vendor and device ID in the form
            `<vendor>:<device>`.
          example: 10de:1eb8
      description: A GPU attached to the instance.
    Instances.InstanceNetworkInterface:
      type: object
      required:
        - uuid
        - private_ip
        - mac
      properties:
        uuid:
          type: string
          format: uuid
        private_ip:
          type: string
          description: |-
            The private IP address of the network interface. This is the internal IP
            address that is used for communication between instances within the same
            network.
          example: 10.0.0.61
        mac:
          type: string
          description: The MAC address of the network interface.
          example: 12:b0:a0:00:00:3d
        name:
          type: string
          description: |-
            The interface name. If omitted, Unikraft Cloud generates one as
            <instance-name>-ethX, falling back to eth-<suffix> when the
            instance name is too long.
          example: eth0
        tap_name:
          type: string
          description: The TAP device to attach the interface. Provide it together with ip.
          example: tap0
        autoconfig:
          type: boolean
          description: |-
            Whether the interface is automatically configured inside the guest
            (IP address, routes, etc.). When absent or true, autoconfiguration
            is enabled. Present and false when the guest is expected to
            configure the interface manually.
          example: false
        relay:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceNetworkInterfaceRelay'
          description: Relay configuration for this interface.
      description: A network interface attached to an instance.
    Instances.InstanceNetworkInterfaceRelay:
      type: object
      required:
        - uuid
        - name
        - relay_dns
      properties:
        uuid:
          type: string
          format: uuid
          description: UUID of the relay interface.
        name:
          type: string
          description: Name of the relay interface.
          example: eth-relay
        relay_dns:
          type: boolean
          description: |-
            Whether DNS traffic is relayed through this interface.
            Defaults to true.
          example: true
      description: An object that routes all traffic through another interface.
    Instances.InstancePendingUpdate:
      type: object
      required:
        - prop
        - op
        - value
        - status
      properties:
        prop:
          allOf:
            - $ref: '#/components/schemas/Instances.MutableInstanceProperty'
          description: The property being updated.
        op:
          allOf:
            - $ref: '#/components/schemas/Instances.MutableInstanceOperation'
          description: The patch operation type.
        value:
          description: The new value for the property. Type depends on the property being updated.
        status:
          type: string
          enum:
            - pending
            - failed
          description: The status of this update.
        error:
          type: string
          description: Error message. Only present when status is "failed".
      description: A queued property change awaiting application on an instance.
    Instances.InstancePlugin:
      type: object
      required:
        - name
        - rom
      properties:
        name:
          type: string
          description: |-
            The plugin name. It becomes the `<plugin_name>` segment in the plugin
            endpoint (`.../plugins/<plugin_name>/<path>`). A plugin name has a
            maximum length of 63 characters and contains only letters (`a`-`z`,
            `A`-`Z`), digits (`0`-`9`), hyphen (`-`), and underscore (`_`).
          example: my-plugin
        rom:
          type: string
          description: |-
            The plugin's ROM image, given as an image reference string such as
            `user/myplugin:latest`. The platform loads the image, mounts it at
            `/uk/plugins/<plugin_name>`, and runs its `init` program when the
            plugin starts.
          example: user/myplugin:latest
        config:
          description: |-
            Arbitrary JSON configuration that the platform passes to the plugin's
            `init` program on `STDIN`. Any JSON value works, including a string, a
            number, or an object.
      description: |-
        A helper program attached to the instance and reachable over a direct,
        authenticated HTTP endpoint. A plugin runs inside the instance next to
        the main application, loads from its own ROM image, and answers requests
        that the Unikraft Cloud API forwards to it.
    Instances.InstanceRestartAttempt:
      type: object
      required:
        - attempt
      properties:
        attempt:
          type: integer
          format: uint32
          description: |-
            Current restart attempt number. This is incremented each time the instance
            is restarted automatically by the platform.
          example: 1
        next_at:
          type: string
          format: date-time
          description: Timestamp of the next scheduled restart attempt.
      description: Restart attempt information for an instance.
    Instances.InstanceRestartPolicy:
      type: string
      enum:
        - never
        - always
        - on-failure
      description: |-
        The restart policy of an instance.

        When an instance stops either because the application exits or the instance
        crashes, Unikraft Cloud can auto-restart your instance. Auto-restarts are
        performed according to the restart policy configured for a particular
        instance. The policy can have the following values:

        | Policy       | Description |
        |--------------|-------------|
        | `never`      | Never restart the instance (default). |
        | `always`     | Always restart the instance when the stop is initiated from within the instance (i.e., the application exits or the instance crashes). |
        | `on-failure` | Only restart the instance if it crashes. |

        When an instance stops, the stop reason and the configured restart policy
        are evaluated to decide if a restart should be performed. Unikraft Cloud
        uses an exponential back-off delay (immediate, 5s, 10s, 20s, 40s, ..., 5m)
        to slow down restarts in tight crash loops. If an instance runs without
        problems for 10s the back-off delay is reset and the restart sequence ends.
        The `restart.attempt` attribute reported in counts the number of restarts
        performed in the current sequence. The `restart.next_at` field indicates
        when the next restart will take place if a back-off delay is in effect. A
        manual start or stop of the instance aborts the restart sequence and resets
        the back-off delay.
    Instances.InstanceRom:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the ROM to use for the instance configuration.
          example: funky-rom
        image:
          type: string
          description: |-
            The image of the ROM to use for the instance configuration. Mutually
            exclusive with `files`.
          example: nginx:latest
        at:
          type: string
          description: |-
            The path at which the ROM should be automatically mounted inside the
            instance. When set, the platform mounts the ROM device at the specified
            path so the guest does not need to mount it manually. When omitted, the
            ROM is exposed as a raw block device and the guest is responsible for
            mounting it.
          example: /rom0
        files:
          type: array
          items:
            $ref: '#/components/schemas/Common.InlineFile'
          description: |-
            Inline files to use as the ROM content. When specified, the platform
            creates an EROFS image from the provided files. Mutually exclusive with
            `image`.
      description: A ROM attached to an instance.
    Instances.InstanceScaleToZero:
      type: object
      properties:
        enabled:
          type: boolean
          description: Indicates whether scale-to-zero is enabled for the instance.
          example: true
        policy:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceScaleToZeroPolicy'
          description: The specific policy to use for scaling the instance to zero.
        stateful:
          type: boolean
          description: |-
            Whether the instance should be stateful when scaled to zero. If set to
            true, the instance will retain its state (e.g., RAM contents) when scaled
            to zero. This is useful for instances that need to maintain their state
            across scale-to-zero operations. If set to false, the instance will lose
            its state when scaled to zero, and it will be restarted from scratch when
            scaled back up.
          example: true
        cooldown_time_ms:
          type: integer
          format: int32
          description: |-
            The cooldown time in milliseconds before the instance can be scaled to
            zero again. This is useful to prevent rapid scaling to zero and back up,
            which can lead to performance issues or resource exhaustion.
          example: 3000
        notify_time_ms:
          type: integer
          format: int32
          description: |-
            The notification time in milliseconds before the instance is scaled to
            zero. This allows the instance to perform any necessary cleanup or state
            saving before being scaled down.
          example: 1000
      description: |-
        Scale-to-zero defines the configuration for scaling the instance to zero.
        When an instance is scaled-to-zero it can be either stopped (and fully
        shutdown) or paused wherein the state of the instance is preserved (e.g.,
        RAM contents) and the instance can be resumed later without losing its
        state, i.e. "stateful".
    Instances.InstanceScaleToZeroPolicy:
      type: string
      enum:
        - 'off'
        - 'on'
        - idle
      description: |-
        Scale-to-zero policy types to use when creating an instance.

        The policy can be one of the following values:

        | Policy | Description |
        |--------|-------------|
        | `on`   | The instance should be scaled-to-zero (when possible). |
        | `off`  | The instance should never be scaled-to-zero. |
        | `idle` | The instance should be scaled-to-zero even with established but idle TCP connections. |
    Instances.InstanceServiceGroup:
      type: object
      required:
        - uuid
        - name
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The human-readable name of the resource.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Instances.ServiceGroupInstanceDomain'
          description: The domain configuration for the service group.
      description: |-
        The service group configuration for the instance. This is a reference to the
        service group that the instance is part of. The service group defines the
        services (e.g. ports, connection handling) that the instance exposes and how
        they are configured.
    Instances.InstanceSnapshot:
      type: object
      required:
        - uuid
      properties:
        uuid:
          type: string
          format: uuid
      description: A snapshot reference for an instance.
    Instances.InstanceState:
      type: string
      enum:
        - stopped
        - starting
        - running
        - draining
        - stopping
        - template
        - standby
        - deleted
        - checkpoint
      description: The current state of an instance.
    Instances.InstanceTemplateAutokill:
      type: object
      properties:
        time_ms:
          type: integer
          format: uint64
          description: |-
            Time in milliseconds after the template was last used for cloning before
            it is deleted. A value of 0 disables template autokill.
      description: Autokill configuration for a template instance.
    Instances.InstanceType:
      type: string
      enum:
        - micro
        - full
      description: |-
        The type of virtual machine used to run an instance.

        | Type    | Description |
        |---------|-------------|
        | `micro` | A lightweight microVM (default). Boots in milliseconds and is suitable for most workloads. |
        | `full`  | A full virtual machine with broader hardware support, such as GPU passthrough. Requires a plan with full VM support. |
    Instances.InstanceVolume:
      type: object
      required:
        - uuid
        - name
        - at
        - readonly
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The human-readable name of the resource.
        at:
          type: string
          description: |-
            The mount point of the volume in the instance. This is the directory in
            the instance where the volume will be mounted.
          example: /mnt/funky-volume
        readonly:
          type: boolean
          description: Whether the volume is read-only or not.
          example: true
      description: |-
        A volume defines a storage which can be attached to the instance. Volumes
        can be used to store persistent data which should remain available even if
        the instance is stopped or restarted.
    Instances.ItemAutokill:
      type: object
      properties:
        time_ms:
          type: integer
          format: uint64
          description: |-
            Time in milliseconds after the template was last used for cloning before
            it is deleted. A value of 0 disables template autokill.
          example: 60000
      description: Automatic delete-on-idle configuration for the template instance.
    Instances.MutableCheckpointInstanceOperation:
      type: string
      enum:
        - set
