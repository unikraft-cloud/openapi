          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: The response message for unpinning one or more images.
    Images.UnpinImagesResponseImage:
      type: object
      required:
        - status
        - uuid
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: Indicates whether the operation was successful for this item.
        message:
          type: string
          description: An optional message providing additional information.
        error:
          type: integer
          format: int32
          description: An optional error code.
        uuid:
          type: string
          format: uuid
          description: The UUID of the image.
        name:
          type: string
          description: |-
            The name of the image. Only set on success, and only if the image
            has a name.
      description: The result of unpinning a single image.
    Instances.CheckpointAutokill:
      type: object
      properties:
        time_ms:
          type: integer
          format: uint64
          description: |-
            Time in milliseconds after the checkpoint was last used for restoring
            before it is deleted. A value of 0 disables checkpoint autokill.
          example: 60000
      description: Automatic delete-on-idle configuration for the checkpoint instance.
    Instances.CheckpointHistoryEntry:
      type: object
      required:
        - uuid
        - name
        - created_at
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the checkpoint.
        name:
          type: string
          description: The name of the checkpoint.
          example: my-checkpoint
        created_at:
          type: string
          format: date-time
          description: The time the checkpoint was created.
      description: A checkpoint history entry, representing a single checkpoint in the history of an instance.
    Instances.CreateCheckpointInstancesRequestItem:
      type: object
      required:
        - from
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/Common.NameOrUUID'
          description: The source instance to create a checkpoint from (by name or UUID).
        name:
          type: string
          description: The name of the checkpoint. If not provided, a name will be generated.
          example: my-checkpoint
        timeout_s:
          type: integer
          format: int64
          description: |-
            Timeout in seconds to wait for the checkpoint to be created.
            No wait performed for a value of 0.
          example: 10
        tags:
          type: array
          items:
            type: string
          description: Tags to associate with the checkpoint.
        autokill:
          allOf:
            - $ref: '#/components/schemas/Instances.CheckpointAutokill'
          description: Automatic delete-on-idle configuration for the new checkpoint.
      description: A single checkpoint creation request.
    Instances.CreateCheckpointInstancesResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          type: object
          properties:
            instances:
              type: array
              items:
                $ref: '#/components/schemas/Instances.CreateCheckpointInstancesResponseCheckpointInstance'
              description: List of checkpoint instances that were created during the operation.
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: |-
        The response message for creating one or more checkpoint(s) from existing
        instance(s).
    Instances.CreateCheckpointInstancesResponseCheckpointInstance:
      type: object
      required:
        - status
        - uuid
        - name
        - state
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: Indicates whether the operation was successful for this item.
        message:
          type: string
          description: An optional message providing additional information.
        error:
          type: integer
          format: int32
          description: An optional error code.
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The human-readable name of the resource.
        state:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceState'
          description: The current state of the checkpoint.
      description: Per-item result for a create checkpoint instances operation.
    Instances.CreateInstanceRequest:
      type: object
      properties:
        name:
          type: string
          description: |-
            The name of the instance.

            If not provided, a random name will be generated. The name must be
            unique.
          example: funky-town-g756b5d
        image:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/Instances.ImageSpec'
          description: |-
            The image to use for the instance.

            Either an image or a template must be specified. Accepts either a plain
            image reference string (`"nginx:latest"`) or an object carrying additional
            pull configuration (`{"url": "nginx:latest", "pull_policy": "always"}`).
        args:
          type: array
          items:
            type: string
          description: The arguments to pass to the instance when it starts.
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables to set for the instance.
          example:
            ENV_VAR1: value1
            ENV_VAR2: value2
        memory_mb:
          type: integer
          format: int64
          description: Memory in MB to allocate for the instance. Default is 128.
          example: 256
        service_group:
          allOf:
            - $ref: '#/components/schemas/Instances.CreateInstanceRequestServiceGroup'
          description: |-
            The service group configuration when creating an instance.

            When creating an instance, either a previously created (persistent)
            service group can be referenced (either through its name or UUID), or a
            new (ephemeral) service group can be created for the instance by
            specifying the list of services it should expose and optionally the
            domains it should use. Not used by template instances.
        volumes:
          type: array
          items:
            $ref: '#/components/schemas/Instances.CreateInstanceRequestVolume'
          description: |-
            Volumes to attach to the instance.

            This list can contain both existing and new volumes to create as part of
            the instance creation. Existing volumes can be referenced by their name or
            UUID. New volumes can be created by specifying a name, size in MiB, and
            mount point in the instance. The mount point is the directory in the
            instance where the volume will be mounted.
        autostart:
          type: boolean
          description: |-
            Whether the instance should start automatically on creation.
            Must be set to true when `timeout_s` is specified.
          example: true
        replicas:
          type: integer
          format: int64
          description: |-
            Number of additional replicas to create. The total number of instances
            created is `replicas + 1`. Defaults to 0.
          example: 5
        restart_policy:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceRestartPolicy'
          description: |-
            Restart policy for the instance. This defines how the instance
            should behave when it stops or crashes. Cannot be combined with
            the `delete-on-stop` feature.
        scale_to_zero:
          allOf:
            - $ref: '#/components/schemas/Instances.CreateInstanceScaleToZero'
          description: |-
            Scale-to-zero configuration for the instance. Requires
            `service_group` to be set. Cannot be combined with the
            `delete-on-stop` feature.
        vcpus:
          type: integer
          format: int32
          description: Number of vCPUs to allocate for the instance. Defaults to 1.
          example: 1
        wait_timeout_ms:
          type: integer
          format: int64
          description: |-
            Deprecated: Use `timeout_s` instead. Timeout in milliseconds to
            wait for all new instances to reach running state. Requires
            `autostart` to be set. If `timeout_s` is not set, this value is
            converted by rounding up to the next full second. No wait
            performed for a value of 0.
          deprecated: true
          example: 2000
        features:
          type: array
          items:
            $ref: '#/components/schemas/Instances.InstanceFeature'
          description: |-
            Features to enable for the instance. Features are specific
            configurations or capabilities that can be enabled for the
            instance. The `scale-to-zero` and `delete-on-stop` features are
            mutually exclusive.
        timeout_s:
          type: integer
          format: int64
          description: |-
            Timeout in seconds to wait for all new instances to reach running
            state. Requires `autostart` to be set. If you autostart your
            new instance, you can wait for it to finish starting with a
            blocking API call if you specify a wait timeout greater than
            zero. No wait performed for a value of 0.
          example: 2
        roms:
          type: array
          items:
            $ref: '#/components/schemas/Instances.CreateInstanceRequestRom'
          description: |-
            Read-Only Memory (ROM) blobs to attach to the instance.
            Unikraft Cloud supports the ability to attach Read-Only Memory (ROM) blobs
            to instances. It allows you to create a general-purpose base image and
            then customize individual instances by attaching code or data as separate
            ROM blobs.
        plugins:
          type: array
          items:
            $ref: '#/components/schemas/Instances.CreateInstanceRequestPlugin'
          description: |-
            Plugins to attach to the instance. Plugins let you attach small helper
            programs to an instance and reach each one over a direct, authenticated
            HTTP endpoint. Each plugin loads from its own ROM image, mounts at
            `/uk/plugins/<plugin_name>`, and is reachable at
            `.../v1/instances/<uuid>/plugins/<plugin_name>/<path>`. At most 8 plugins
            may be attached to an instance.
        tags:
          type: array
          items:
            type: string
          description: Tags to associate with the instance.
        annotations:
          type: object
          additionalProperties:
            type: string
          description: |-
            Annotations to associate with the instance.

            Unlike tags, annotations also reach the guest: they are included in the
            instance's startdata, and selected keys can be injected into the console
            log output.

            Keys follow the Kubernetes annotation key syntax, `[<prefix>/]<name>`:
            the optional prefix is a non-wildcard DNS subdomain of at most 253
            characters, and the name is at most 63 characters of `[-_.a-zA-Z0-9]`
            starting and ending with an alphanumeric. Values are unconstrained apart
            from ASCII control characters. An instance holds at most 256 annotations.

            When the instance inherits annotations from a template, branch, or
            checkpoint, the given annotations are merged into them rather than
            replacing them. On a key clash the value given here wins.
          example:
            my-key: value1
            example.com/annotation2: value2
        template:
          allOf:
            - $ref: '#/components/schemas/Instances.CreateInstanceRequestTemplate'
          description: |-
            Template instances.
            An existing instance can be saved as a template. This template is then
            used to create new instances that inherit the exact configuration and
            state the original instance had when the template was created.
        sched_priority:
          allOf:
            - $ref: '#/components/schemas/Common.SchedPriority'
          description: |-
            The scheduling priority for the instance. Only settable by
            users with scheduling priority override permissions.
          example: high
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/Instances.Schedule'
          description: |-
            Schedules for the instance. Scheduled operations let you automatically
            start, stop, delete, or exec a command in the instance on a calendar-
            based schedule. For `exec` schedules, set the `args` field to the command
            and its arguments. Each instance stores its own schedules, and cloning
            preserves them.
        autokill:
          allOf:
            - $ref: '#/components/schemas/Instances.CreateInstanceRequestAutokill'
          description: |-
            Automatic delete-on-idle/request-limit configuration. Not used for
            template instances.
        hostname:
          type: string
          description: |-
            The hostname of the instance.

            If not provided, the hostname will be set to the instance name. The
            hostname must be a valid DNS label (e.g., "my-instance") and is used for
            internal DNS resolution within the Unikraft Cloud network.
          example: my-instance
        dependencies:
          type: array
          items:
            $ref: '#/components/schemas/Common.NameOrUUID'
          description: |-
            Dependencies of the instance.

            A list of instance identifiers (name or UUID) that this instance depends
            on. Dependencies define startup ordering and can be used to ensure that
            prerequisite instances are running before this instance starts.
        branch_from:
          allOf:
            - $ref: '#/components/schemas/Common.NameOrUUID'
          description: |-
            Reference to an existing instance to branch from. The instance can be
            running or stopped. If the source instance is running, a snapshot will be
            taken asynchronously and the new instance will wait for it to complete
            before starting. Mutually exclusive with `image` and `template`.
        checkpoint:
          allOf:
            - $ref: '#/components/schemas/Common.NameOrUUID'
          description: |-
            Reference to an existing checkpoint to create the instance from. The
            checkpoint must be in the `checkpoint` state. The new instance will be
            created with the same configuration and state as the checkpoint. Mutually
            exclusive with `image`, `template`, and `branch_from`.
        gateway:
          type: string
          description: The default gateway to configure inside the guest.
          example: 10.0.0.1
        nameserver:
          type: string
          description: The DNS resolver to configure inside the guest.
          example: 8.8.8.8
        network_interfaces:
          type: array
          items:
            $ref: '#/components/schemas/Instances.CreateInstanceRequestNetworkInterface'
          description: Network interfaces to attach to the instance.
        type:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceType'
          description: |-
            The type of virtual machine to use for the instance. Defaults to `micro`,
            which runs on Firecracker. `full` runs on QEMU instead and is required
            for GPU passthrough (see `gpus`) and, in the future, Windows VMs. QEMU-
            backed instances currently do not support scale-to-zero, templates,
            branching, or checkpointing, and only support block-based volumes (no
            virtiofs). Requires a plan with full VM support and cannot be combined
            with `template`, `branch_from`, or `checkpoint`.
          example: full
        gpus:
          type: integer
          format: int32
          minimum: 0
          maximum: 1
          description: |-
            Number of GPUs to attach to the instance. Currently restricted to at most
            1. Requires `type` to be `full` and a plan with GPU support. A GPU stays
            assigned to the instance, even while stopped, until the instance is
            deleted. Cannot be combined with `template`, `branch_from`, or
            `checkpoint`.
          example: 1
      description: The request message for creating a new instance.
    Instances.CreateInstanceRequestAutokill:
      type: object
      properties:
        time_ms:
          type: integer
          format: uint64
          description: |-
            Time in milliseconds after the instance was stopped before it is deleted.
            A value of 0 disables time-based autokill.
        num_requests:
          type: integer
          format: uint32
          description: |-
            Maximum number of requests/connections the instance serves before it is
            deleted. A value of 0 disables request-based autokill.
      description: Automatic delete-on-idle/request-limit configuration for non-template instances.
    Instances.CreateInstanceRequestDomain:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: |-
            Publicly accessible domain name.

            If this name ends in a period `.` it must be a valid Full Qualified
            Domain Name (FQDN), e.g. `example.com.`; otherwise it will become a
            subdomain of the target metro, e.g. `example` becomes
            `example.fra0.unikraft.app`.
          example: funky-town-g756b5d.fra0.unikraft.app.
        certificate:
          allOf:
            - $ref: '#/components/schemas/Common.NameOrUUID'
          description: |-
            A reference to an existing certificate which can be used for the
            specified domain. If unspecified, Unikraft Cloud will
            automatically generate a new certificate for the domain based on Let's
            Encrypt and seek to accomplish a DNS-01 challenge.
      description: |-
        The domain configuration for the service group. A domain defines a publicly
        accessible domain name for the instance. If the domain name ends with a
        period `.`, it must be a valid Fully Qualified Domain Name (FQDN), otherwise
        it will become a subdomain of the target metro. The domain can be associated
        with an existing certificate by specifying the certificate's name or UUID.
        If no certificate is specified and a FQDN is provided, Unikraft Cloud will
        automatically generate a new certificate for the domain based on Let's
        Encrypt and seek to accomplish a DNS-01 challenge.
    Instances.CreateInstanceRequestNetworkInterface:
      type: object
      properties:
        name:
          type: string
          description: |-
            The interface name. If omitted, Unikraft Cloud generates one as
            <instance-name>-ethX, falling back to eth-<suffix> when the
            instance name is too long.
          example: eth0
        tap_name:
          type: string
          description: |-
            The TAP device to attach the interface to. Provide it together
            with ip.
          example: tap0
        ip:
          type: string
          description: |-
            The interface IP address in CIDR notation. Provide it together
            with tap_name to bring your own interface.
          example: 10.0.0.5/24
        autoconfig:
          type: boolean
          description: Whether the guest configures the interface itself. Defaults to true.
          example: true
        relay:
          allOf:
            - $ref: '#/components/schemas/Instances.NetworkInterfaceRelay'
          description: Relay configuration for this interface.
      description: Network interface configuration for a new instance.
    Instances.CreateInstanceRequestPlugin:
      type: object
      required:
        - name
        - rom
      properties:
        name:
          type: string
          description: |-
            The plugin name. It becomes the `<plugin_name>` segment in the plugin
            endpoint (`.../plugins/<plugin_name>/<path>`). A plugin name has a
            maximum length of 63 characters and contains only letters (`a`-`z`,
            `A`-`Z`), digits (`0`-`9`), hyphen (`-`), and underscore (`_`).
          example: my-plugin
        rom:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/Instances.ImageSpec'
          description: |-
            The plugin's ROM image. The platform loads the image, mounts it at
            `/uk/plugins/<plugin_name>`, and runs its `init` program when the plugin
            starts. Accepts either a plain image reference string
            (`"user/myplugin:latest"`) or an object carrying additional pull
            configuration (`{"url": "user/myplugin:latest", "pull_policy": "always"}`).
          example: user/myplugin:latest
        config:
          description: |-
            Arbitrary JSON configuration that the platform passes to the plugin's
            `init` program on `STDIN`. Any JSON value works, including a string, a
            number, or an object.
      description: |-
        A helper program attached to the instance and reachable over a direct,
        authenticated HTTP endpoint. A plugin runs inside the instance next to
        the main application, loads from its own ROM image, and answers requests
        that the Unikraft Cloud API forwards to it.
    Instances.CreateInstanceRequestRom:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The name of the ROM to use for the instance configuration.
          example: funky-rom
        image:
          anyOf:
            - type: string
            - $ref: '#/components/schemas/Instances.ImageSpec'
          description: |-
            The image of the ROM to use for the instance configuration. Mutually
            exclusive with `files`. Accepts either a plain image reference string
            (`"nginx:latest"`) or an object carrying additional pull configuration
            (`{"url": "nginx:latest", "pull_policy": "always"}`).
          example: nginx:latest
        at:
          type: string
          description: |-
            The path at which the ROM should be automatically mounted inside the
            instance. When set, the platform mounts the ROM device at the specified
            path so the guest does not need to mount it manually. When omitted, the
            ROM is exposed as a raw block device and the guest is responsible for
            mounting it.
          example: /rom0
        files:
          type: array
          items:
            $ref: '#/components/schemas/Common.InlineFile'
          description: |-
            Inline files to use as the ROM content. When specified, the platform
            creates an EROFS image from the provided files. Mutually exclusive with
            `image`.
      description: A ROM to attach when creating an instance.
    Instances.CreateInstanceRequestServiceGroup:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The name of the resource.
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Instances.CreateInstanceRequestDomain'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Services.Service'
        soft_limit:
          type: integer
          format: uint32
        hard_limit:
          type: integer
          format: uint32
      description: |-
        The service group configuration when creating an instance. If no existing
        (persistent) service group is specified via its identifier, a new
        (ephemeral) service group can be created by specifying the services it
        should expose. A service defines the configuration settings of an exposed
        port by the instance. A service is a combination of a public port, an
        internal port, and a set of handlers that define how the service will handle
        incoming connections.
      oneOf:
        - required:
            - uuid
        - required:
            - name
    Instances.CreateInstanceRequestTemplate:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The name of the resource.
        prepare:
          type: boolean
          description: Whether the instance needs to run in order to reach template state
          example: false
        create_args:
          allOf:
            - $ref: '#/components/schemas/Instances.Instance'
          description: |-
            Configuration parameters to apply when building the new instance from the
            source template.
        prepare_timeout_s:
          type: integer
          format: int64
          description: |-
            Timeout in seconds for preparing the template before the preparation is
            aborted. Only applies when `prepare` is set. A value of 0 means no
            timeout.
          example: 30
        autokill:
          allOf:
            - $ref: '#/components/schemas/Instances.TemplateAutokill'
          description: |-
            Automatic delete-on-idle configuration for the template. Only applies
            when `prepare` is set.
      description: Template configuration when creating an instance.
    Instances.CreateInstanceRequestVolume:
      type: object
      required:
        - at
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The name of the resource.
        size_mb:
          type: integer
          format: uint64
        host_path:
          type: string
        at:
          type: string
        readonly:
          type: boolean
        quota_policy:
          type: string
        filesystem:
          type: string
        tags:
          type: array
          items:
            type: string
        uid:
          type: integer
          format: uint32
        gid:
          type: integer
          format: uint32
        access_mode:
          $ref: '#/components/schemas/Volumes.VolumeAccessMode'
        args:
          type: object
          additionalProperties:
            type: string
      description: A volume defines a storage volume that can be attached to the instance.
      oneOf:
        - required:
            - size_mb
        - required:
            - host_path
    Instances.CreateInstanceResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          type: object
          properties:
            instances:
              type: array
              items:
                $ref: '#/components/schemas/Instances.Instance'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Common.ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: The response message for creating a new instance.
    Instances.CreateInstanceScaleToZero:
      type: object
      properties:
        policy:
          allOf:
            - $ref: '#/components/schemas/Instances.InstanceScaleToZeroPolicy'
          description: The specific policy to use for scaling the instance to zero.
        stateful:
          type: boolean
          description: |-
            Whether the instance should be stateful when scaled to zero. If set to
            true, the instance will retain its state (e.g., RAM contents) when scaled
            to zero. This is useful for instances that need to maintain their state
            across scale-to-zero operations. If set to false, the instance will lose
            its state when scaled to zero, and it will be restarted from scratch when
            scaled back up.
          example: true
        cooldown_time_ms:
          type: integer
          format: int32
          description: |-
            The cooldown time in milliseconds before the instance can be scaled to
            zero again. This is useful to prevent rapid scaling to zero and back up,
            which can lead to performance issues or resource exhaustion.
          example: 3000
        notify_time_ms:
          type: integer
          format: int32
          description: |-
            The notification time in milliseconds before the instance is scaled to
            zero. This allows the instance to perform any necessary cleanup or state
            saving before being scaled down.
          example: 1000
      description: Scale-to-zero configuration when creating an instance.
    Instances.CreateTemplateInstancesRequestItem:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The name of the resource.
        timeout_s:
          type: integer
          format: int64
          description: |-
            Timeout in seconds to wait for the template instances to be created.
            A value of -1 means to wait indefinitely until the instance reaches the
            desired state. No wait performed for a value of 0.
          example: 2
        autokill:
          allOf:
            - $ref: '#/components/schemas/Instances.ItemAutokill'
          description: Automatic delete-on-idle configuration for the new template.
      description: A single template instance to be created.
    Instances.CreateTemplateInstancesResponse:
      type: object
      required:
        - status
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: The status of the response.
