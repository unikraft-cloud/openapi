openapi: 3.0.3
info:
    title: Unikraft Cloud Platform API
    description: This specification describes the Unikraft Cloud Platform API, which provides mechanisms to interact with Unikraft Cloud metros. It allows you to create, manage, and interact with instances running on the platform.
    contact:
        name: Unikraft Support
        url: https://unikraft.com/contact
        email: support@unikraft.com
    version: v1.0.0
servers:
    - url: https://api.fra.unikraft.cloud
      description: Frankfurt, DE
    - url: https://api.dal.unikraft.cloud
      description: Dallas, TX, USA
    - url: https://api.sin.unikraft.cloud
      description: Singapore
    - url: https://api.was.unikraft.cloud
      description: Washington, DC, USA
    - url: https://api.sfo.unikraft.cloud
      description: San Francisco, CA, USA
paths:
    /v1/certificates:
        get:
            tags:
                - Certificates
            summary: List Certificates
            description: |-
                Get one or many certificates with their current status and configuration.
                It's possible to filter this list by name or UUID.
            operationId: GetCertificates
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the certificate in the response.  By
                    default this is set to true, meaning that all information about the
                    certificate will be included in the response.  If set to false, only the
                    basic information about the certificate will be included, such as its name
                    and UUID.
                  schema:
                    type: boolean
                - name: count
                  in: query
                  description: |-
                    The maximum number of certificates to return.  If set to 0 or not set, all
                    certificates matching filters will be returned.  When filtering by IDs,
                    this should not be set.
                  schema:
                    type: integer
                    format: uint32
                - name: from
                  in: query
                  description: |-
                    If set, the listing starts from the certificate with the given UUID or at
                    the given ISO8601 creation timestamp (inclusive).  When count is 0 or not
                    set, a UUID value may be used to match a specific certificate by UUID.
                  schema:
                    type: string
                - name: order
                  in: query
                  description: |-
                    The sort order for the returned certificates.

                    Valid values are `PAGINATION_ORDER_ASC` (ascending, oldest first) and
                    `PAGINATION_ORDER_DESC` (descending, newest first).  Defaults to
                    `PAGINATION_ORDER_ASC`.
                  schema:
                    enum:
                        - "asc"
                        - "desc"
                    type: string
                    format: enum
                - name: sortby
                  in: query
                  description: |-
                    The field to sort the certificates by.

                    Currently only `PAGINATION_SORT_BY_CREATE_TIME` is supported.  Defaults to
                    `PAGINATION_SORT_BY_CREATE_TIME`.
                  schema:
                    enum:
                        - "create_time"
                    type: string
                    format: enum
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCertificatesResponse'
        post:
            tags:
                - Certificates
            summary: Create Certificate
            description: Upload a new certificate with the given configuration.
            operationId: CreateCertificate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCertificateRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateCertificateResponse'
        delete:
            tags:
                - Certificates
            summary: Delete Certificates
            description: |-
                Delete the specified certificate(s).  After this call the name of the
                certificate(s) are no longer valid.
            operationId: DeleteCertificates
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCertificatesResponse'
        patch:
            tags:
                - Certificates
            summary: Update Certificate
            description: |-
                Update the specified certificate with a new certificate chain and private
                key. Only user-uploaded certificates can be updated; system-managed
                certificates cannot be modified. The new certificate must have the same
                common name (CN) as the existing certificate.
            operationId: UpdateCertificate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCertificateRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateCertificateResponse'
    /v1/certificates/{uuid}:
        get:
            tags:
                - Certificates
            summary: Get Certificate by UUID
            description: Get a specified certificate by its UUID.
            operationId: GetCertificateByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the certificate.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCertificatesResponse'
        delete:
            tags:
                - Certificates
            summary: Delete Certificate by UUID
            description: |-
                Delete a specified certificate by its UUID.  After this call the UUID of
                the certificate are no longer valid.
            operationId: DeleteCertificateByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the certificate to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCertificatesResponse'
        patch:
            tags:
                - Certificates
            summary: Update Certificate by UUID
            description: |-
                Update a specified certificate by its UUID with a new certificate chain
                and private key.
            operationId: UpdateCertificateByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the certificate to update.
                  required: true
                  schema:
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCertificateByUUIDRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateCertificateResponse'
    /v1/healthz:
        get:
            tags:
                - Node
            summary: Health Check
            description: Return the status of a full-system health check of the node.
            operationId: Healthz
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HealthzResponse'
    /v1/images/list:
        get:
            tags:
                - Images
            summary: Get Images
            description: Retrieve all images.
            operationId: GetImages
            parameters:
                - name: metro
                  in: query
                  description: |-
                    (Optional, only applies when using global control plane).
                    The metro to route the request to.
                  schema:
                    type: string
                - name: namespace
                  in: query
                  description: Optional namespace to filter images by.
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TagOrDigest'
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetImagesResponse'
    /v1/instances:
        get:
            tags:
                - Instances
            summary: List Instances
            description: |-
                Get one or many instances with their current status and configuration.
                It's possible to filter this list by ID(s) (name or UUID).
            operationId: GetInstances
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the instance in the response.  By default
                    this is set to true, meaning that all information about the instance will
                    be included in the response.  If set to false, only the basic information
                    about the instance will be included, such as its name and UUID.
                  schema:
                    type: boolean
                - name: count
                  in: query
                  description: |-
                    The maximum number of instances to return.  If set to 0 or not set, all
                    instances matching filters will be returned.  When filtering by IDs, this
                    should not be set.
                  schema:
                    type: integer
                    format: uint32
                - name: from
                  in: query
                  description: |-
                    If set, the listing starts from the instance with the given UUID or at
                    the given ISO8601 creation timestamp (inclusive).  When count is 0 or not
                    set, a UUID value may be used to match a specific instance by UUID.
                  schema:
                    type: string
                - name: tags
                  in: query
                  description: A list of tags to filter the instances by.
                  schema:
                    type: array
                    items:
                        type: string
                - name: order
                  in: query
                  description: |-
                    The sort order for the returned instances.

                    Valid values are `PAGINATION_ORDER_ASC` (ascending, oldest first) and
                    `PAGINATION_ORDER_DESC` (descending, newest first).  Defaults to
                    `PAGINATION_ORDER_ASC`.
                  schema:
                    enum:
                        - "asc"
                        - "desc"
                    type: string
                    format: enum
                - name: sortby
                  in: query
                  description: |-
                    The field to sort the instances by.

                    Currently only `PAGINATION_SORT_BY_CREATE_TIME` is supported.  Defaults to
                    `PAGINATION_SORT_BY_CREATE_TIME`.
                  schema:
                    enum:
                        - "create_time"
                    type: string
                    format: enum
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesResponse'
        post:
            tags:
                - Instances
            summary: Create Instance
            description: Create an instance in Unikraft Cloud.
            operationId: CreateInstance
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateInstanceRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateInstanceResponse'
        delete:
            tags:
                - Instances
            summary: Delete Instances
            description: |-
                Delete the specified instance(s) by ID(s) (name or UUID).  After this call
                the IDs of the instances are no longer valid.  If the instances are
                currently running, they are force-stopped.
            operationId: DeleteInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DeleteInstanceRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteInstancesResponse'
        patch:
            tags:
                - Instances
            summary: Update Instances
            description: |-
                Update (modify) one or more instances by ID(s) (name or UUID).  The
                instances must be in a stopped state for most update operations.
            operationId: UpdateInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/UpdateInstancesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateInstancesResponse'
    /v1/instances/log:
        get:
            tags:
                - Instances
            summary: Get Instances Logs
            description: Retrieve the logs of one or more instances by ID(s) (name or UUID).
            operationId: GetInstanceLogs
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetInstancesLogsRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesLogsResponse'
    /v1/instances/metrics:
        get:
            tags:
                - Instances
            summary: Get Instances Metrics
            description: Get the metrics of one or more instances by their ID(s) (name or UUID).
            operationId: GetInstanceMetrics
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesMetricsResponse'
    /v1/instances/start:
        put:
            tags:
                - Instances
            summary: Start Instances
            description: |-
                Start previously stopped instances by ID(s) (name or UUID) or do
                nothing if the instances are already running.
            operationId: StartInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/StartInstancesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StartInstancesResponse'
    /v1/instances/stop:
        put:
            tags:
                - Instances
            summary: Stop Instances
            description: |-
                Stop one or more running instance by ID(s) (name or UUID) or do
                nothing if the instances are already stopped.
            operationId: StopInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/StopInstancesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StopInstancesResponse'
    /v1/instances/suspend:
        put:
            tags:
                - Instances
            summary: Suspend Instances
            description: |-
                Suspend one or more running instances by ID(s) (name or UUID) or do
                nothing if the instances are already suspended.
            operationId: SuspendInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/SuspendInstancesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuspendInstancesResponse'
    /v1/instances/templates:
        get:
            tags:
                - Instances
            summary: List template instances
            description: Get one or more template instances by their UUID(s) or name(s).
            operationId: GetTemplateInstances
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the templates in the response.  By default
                    this is set to true, meaning that all information about the templates will
                    be included in the response.  If set to false, only the basic information
                    about the templates will be included, such as their name and UUID.
                  schema:
                    type: boolean
                - name: count
                  in: query
                  description: |-
                    The maximum number of template instances to return.  If set to 0 or not
                    set, all the template instances matching filters will be returned.  When
                    filtering by IDs, this should not be set.
                  schema:
                    type: integer
                    format: uint32
                - name: tags
                  in: query
                  description: A list of tags to filter the template instances by.
                  schema:
                    type: array
                    items:
                        type: string
                - name: from
                  in: query
                  description: |-
                    If set, the listing starts from the template with the given UUID or at the
                    given ISO8601 creation timestamp (inclusive).  When count is 0 or not set,
                    a UUID value may be used to match a specific template by UUID.
                  schema:
                    type: string
                - name: order
                  in: query
                  description: |-
                    The sort order for the returned template instances.

                    Valid values are `PAGINATION_ORDER_ASC` (ascending, oldest first) and
                    `PAGINATION_ORDER_DESC` (descending, newest first).  Defaults to
                    `PAGINATION_ORDER_ASC`.
                  schema:
                    enum:
                        - "asc"
                        - "desc"
                    type: string
                    format: enum
                - name: sortby
                  in: query
                  description: |-
                    The field to sort the template instances by.

                    Currently only `PAGINATION_SORT_BY_CREATE_TIME` is supported.  Defaults to
                    `PAGINATION_SORT_BY_CREATE_TIME`.
                  schema:
                    enum:
                        - "create_time"
                    type: string
                    format: enum
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetTemplateInstancesResponse'
        post:
            tags:
                - Instances
            summary: Create template instances from Instances
            description: |-
                Convert one or more existing instances by their UUID(s) or name(s) into
                template instances that can be used to create new instances.

                The existing instances must be in the `stopped` state and not have existing
                snapshots.
            operationId: CreateTemplateInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateTemplateInstancesResponse'
        delete:
            tags:
                - Instances
            summary: Delete template instances
            description: |-
                Delete the specified template instance(s) by ID(s) (name or UUID).  After
                this call the IDs of the template instances are no longer valid.
            operationId: DeleteTemplateInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteTemplateInstancesResponse'
        patch:
            tags:
                - Instances
            summary: Update template instances
            description: Update (modify) one or more template instances by ID(s) (name or UUID).
            operationId: UpdateTemplateInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/UpdateTemplateInstancesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateTemplateInstancesResponse'
    /v1/instances/templates/{uuid}:
        get:
            tags:
                - Instances
            summary: Get template instance by UUID
            description: Get a single template instance by its UUID.
            operationId: GetTemplateInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the template instance to retrieve.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the templates in the response.  By default
                    this is set to true, meaning that all information about the templates will
                    be included in the response.  If set to false, only the basic information
                    about the templates will be included, such as their name and UUID.
                  schema:
                    type: boolean
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetTemplateInstancesResponse'
        delete:
            tags:
                - Instances
            summary: Delete template instance by UUID
            description: |-
                Delete a specified template instance by its UUID.  After this call the UUID
                of the template instance is no longer valid.
            operationId: DeleteTemplateInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the template instance to delete.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteTemplateInstancesResponse'
        patch:
            tags:
                - Instances
            summary: Update template instance by UUID
            description: Update (modify) a template instance by its UUID.
            operationId: UpdateTemplateInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the template instance to update.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateTemplateInstanceByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateTemplateInstancesResponse'
    /v1/instances/wait:
        get:
            tags:
                - Instances
            summary: Wait for Instances States
            description: |-
                Wait for one or more instances to reach certain states by ID(s)
                (name or UUID).

                If the instances are already in the desired states, the request will return
                immediately.  If the instances are not in the desired state, the request will
                block until the instances reach the desired state or the timeout is
                reached.  If the timeout is reached, the request will fail with an error.
                If the timeout is -1, the request will block indefinitely until the
                instances reach the desired states.
            operationId: WaitInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/WaitInstancesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WaitInstancesResponse'
    /v1/instances/{uuid}:
        get:
            tags:
                - Instances
            summary: Get Instance by UUID
            description: Get a single instance by its UUID.
            operationId: GetInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to get.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the instance in the response.  By default
                    this is set to true, meaning that all information about the instance will
                    be included in the response.  If set to false, only the basic information
                    about the instance will be included, such as its name and UUID.
                  schema:
                    type: boolean
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesResponse'
        delete:
            tags:
                - Instances
            summary: Delete Instance by UUID
            description: |-
                Delete a specified instance by its UUID.  After this call the UUID of the
                instance is no longer valid.  If the instance is currently running,
                it is force-stopped.
            operationId: DeleteInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteInstanceByUUIDRequestBody'
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteInstancesResponse'
        patch:
            tags:
                - Instances
            summary: Update Instance by UUID
            description: |-
                Update (modify) an instance by its UUID.  The instance must be in a stopped
                state for most update operations.
            operationId: UpdateInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to update.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateInstanceByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateInstancesResponse'
    /v1/instances/{uuid}/log:
        get:
            tags:
                - Instances
            summary: Get Instance Logs by UUID
            description: Retrieve the logs of an instance by its UUID.
            operationId: GetInstanceLogsByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to retrieve logs for.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GetInstanceLogsByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
