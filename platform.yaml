      operationId: GetInstanceLogs
      summary: Get Instances Logs
      description: Get instances logs.
      parameters:
        - $ref: '#/components/parameters/Common.NameOrUUIDQueryParams.uuid'
        - $ref: '#/components/parameters/Common.NameOrUUIDQueryParams.name'
        - name: offset
          in: query
          required: false
          description: |-
            The byte offset of the log output to receive. A negative sign makes the
            offset relative to the end of the log.
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: limit
          in: query
          required: false
          description: The amount of bytes to return at most.
          schema:
            type: array
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.GetInstancesLogsResponse'
      tags:
        - instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Instances.GetInstancesLogsRequestItem'
