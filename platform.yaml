            tags:
                - Volumes
            summary: Detach Volumes
            description: |-
                Detach volumes specified by ID(s) (name or UUID) from instances.  If no
                particular instance is specified the volume is detached from all instances.
                The instances from which to detach must not have the volumes mounted.  The
                API returns an error for each instance from which it was unable to detach
                the volume.  If the volume has been created together with an instance,
                detaching the volume will make it persistent (i.e., it survives the
                deletion of the instance).
            operationId: DetachVolumes
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DetachVolumesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetachVolumesResponse'
    /v1/volumes/templates:
        get:
            tags:
                - Volumes
            summary: List template volumes
            description: |-
                Return the current status and the configuration of one or more template
                volumes specified by either UUID(s) or name(s).  If no identifier is
                provided, all template volumes are returned.
            operationId: GetTemplateVolumes
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the template volumes in the response.  By
                    default this is set to true, meaning that all information about the
                    templates will be included in the response.  If set to false, only the
                    basic information about the templates will be included, such as their name
                    and UUID.
                  schema:
                    type: boolean
                - name: count
                  in: query
                  description: |-
                    The maximum number of template volumes to return.  If set to 0 or not set,
                    all volumes matching filters will be returned.  When filtering by IDs, this
                    should not be set.
                  schema:
                    type: integer
                    format: uint32
                - name: from
                  in: query
                  description: |-
                    If set, the listing starts from the template with the given UUID or at the
                    given ISO8601 creation timestamp (inclusive).  When count is 0 or not set,
                    a UUID value may be used to match a specific template by UUID.
                  schema:
                    type: string
                - name: tags
                  in: query
                  description: A list of tags to filter the template volumes by.
                  schema:
                    type: array
                    items:
                        type: string
                - name: order
                  in: query
                  description: |-
                    The sort order for the returned template volumes.

                    Valid values are `PAGINATION_ORDER_ASC` (ascending, oldest first) and
                    `PAGINATION_ORDER_DESC` (descending, newest first).  Defaults to
                    `PAGINATION_ORDER_ASC`.
                  schema:
                    enum:
                        - "asc"
                        - "desc"
                    type: string
                    format: enum
                - name: sortby
                  in: query
                  description: |-
                    The field to sort the template volumes by.

                    Currently only `PAGINATION_SORT_BY_CREATE_TIME` is supported.  Defaults to
                    `PAGINATION_SORT_BY_CREATE_TIME`.
                  schema:
                    enum:
                        - "create_time"
                    type: string
                    format: enum
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetTemplateVolumesResponse'
        post:
            tags:
                - Volumes
            summary: Create template volume
            description: |-
                Converts one or more existing volumes given by their ID(s) (name or UUID)
                into template volumes.  This operation is irreversible in the sense that a
                template volume cannot be converted back into a regular volume.

                The existing volume(s) must not be attached to any instance and must be in
                the `available` state.
            operationId: CreateTemplateVolume
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateTemplateVolumesResponse'
        delete:
            tags:
                - Volumes
            summary: Delete template volumes
            description: |-
                Delete one or more template volumes by their UUID(s) or name(s).  After this
                call, the IDs associated with the template volumes are no longer valid.
            operationId: DeleteTemplateVolumes
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/NameOrUUID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteTemplateVolumesResponse'
        patch:
            tags:
                - Volumes
            summary: Update template volumes
            description: Update one or more template volumes specified by either UUID(s) or name(s).
            operationId: UpdateTemplateVolumes
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/UpdateTemplateVolumesRequestItem'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateTemplateVolumesResponse'
    /v1/volumes/templates/{uuid}:
        get:
            tags:
                - Volumes
            summary: Get template volume by UUID
            description: |-
                Return the current status and the configuration of a particular template
                volume by its UUID.
            operationId: GetTemplateVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the template volume to retrieve.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the template volume in the response.  By
                    default this is set to true, meaning that all information about the
                    template will be included in the response.  If set to false, only the
                    basic information about the template will be included, such as its name
                    and UUID.
                  schema:
                    type: boolean
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetTemplateVolumesResponse'
        delete:
            tags:
                - Volumes
            summary: Delete template volume by UUID
            description: |-
                Delete the specified template volume by its UUID.  After this call, the IDs
                associated with the template volume are no longer valid.
            operationId: DeleteTemplateVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the template volume to delete.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteTemplateVolumesResponse'
        patch:
            tags:
                - Volumes
            summary: Update template volume by UUID
            description: Update the specified template volume by its UUID.
            operationId: UpdateTemplateVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the template volume to update.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateTemplateVolumeByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateTemplateVolumesResponse'
    /v1/volumes/{uuid}:
        get:
            tags:
                - Volumes
            summary: Get Volume by UUID
            description: |-
                Return the current status and the configuration of a particular volume by
                its UUID.
            operationId: GetVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to retrieve.
                  required: true
                  schema:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    format: uuid
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the volume in the response.  By
                    default this is set to true, meaning that all information about the
                    volume will be included in the response.  If set to false, only the
                    basic information about the volume will be included, such as its name
                    and UUID.
                  schema:
                    type: boolean
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetVolumesResponse'
        delete:
            tags:
                - Volumes
            summary: Delete Volume by UUID
            description: |-
                Delete the specified volume by its UUID.  If the volume is still attached
                to an instance, the operation fails.  After this call, the IDs associated
                with the volume are no longer valid.
            operationId: DeleteVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to delete.
                  required: true
                  schema:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteVolumesResponse'
        patch:
            tags:
                - Volumes
            summary: Update Volume by UUID
            description: Update the specified volume by its UUID.
            operationId: UpdateVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to update.
                  required: true
                  schema:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateVolumeByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateVolumesResponse'
    /v1/volumes/{uuid}/attach:
        put:
            tags:
                - Volumes
            summary: Attach Volume by UUID
            description: |-
                Attach a volume by UUID to an instance so that the volume is mounted when
                the instance starts.  The volume needs to be in `available` state and the
                instance must be in `stopped` state.
            operationId: AttachVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to attach.
                  required: true
                  schema:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AttachVolumeByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttachVolumesResponse'
    /v1/volumes/{uuid}/clone:
        post:
            tags:
                - Volumes
            summary: Clone Volume by UUID
            description: |-
                Clone a volume given by its UUID.  The volume to be cloned must not be
                mounted to any instance or only mounted as read-only.  It also needs to not
                be busy or in an error state.  This operation is most useful when cloning
                template volumes.
            operationId: CloneVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to clone.
                  required: true
                  schema:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CloneVolumeByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CloneVolumesResponse'
    /v1/volumes/{uuid}/detach:
        put:
            tags:
                - Volumes
            summary: Detach Volume by UUID
            description: |-
                Detach a volume by UUID from instances.  If no particular instance is
                specified the volume is detached from all instances.  The instances from
                which to detach must not have the volume mounted.  The API returns an error
                for each instance from which it was unable to detach the volume.  If the
                volume has been created together with an instance, detaching the volume
                will make it persistent (i.e., it survives the deletion of the instance).
            operationId: DetachVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to detach.
                  required: true
                  schema:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DetachVolumeByUUIDRequestBody'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetachVolumesResponse'
components:
    schemas:
        AddUsersResponse:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    example: Failed to perform all operations
                    type: string
                    description: |-
                        An optional message providing additional information about the status.
                        This field is useful when the status is not `success`.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                data:
                    allOf:
                        - $ref: '#/components/schemas/AddUsersResponseData'
                    description: The response data for this request.
                op_time_us:
                    example: 46
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                        the request and generate the response.
                    format: uint64
        AddUsersResponseData:
            type: object
            properties:
                results:
                    type: array
                    items:
                        $ref: '#/components/schemas/DataResult'
                    description: The status of the operation for each user in the request.
        AttachVolumeByUUIDRequestBody:
            required:
                - attach_to
                - at
            type: object
            properties:
                attach_to:
                    allOf:
                        - $ref: '#/components/schemas/BodyInstanceID'
                    description: UUID or name of the instance to attach the volume to.
                at:
                    example: /mnt/my-volume
                    pattern: ^/(?!.*\.\./|.*\.$|.*/\.$)[^:]*$
                    type: string
                    description: |-
                        Path of the mountpoint.

                        The path must be absolute, not contain `.` and `..` components, and not
                        contain colons (`:`). The path must point to an empty directory. If the
                        directory does not exist, it is created.
                    format: regex
                readonly:
                    example: false
                    type: boolean
                    description: Whether the volume should be mounted read-only.
        AttachVolumesRequestItem:
            required:
                - attach_to
                - at
            type: object
            allOf:
                - type: object
                  properties:
                    attach_to:
                        allOf:
                            - $ref: '#/components/schemas/NameOrUUID'
                        description: UUID or name of the instance to attach the volume to.
                    at:
                        example: /mnt/my-volume
                        pattern: ^/(?!.*\.\./|.*\.$|.*/\.$)[^:]*$
                        type: string
                        description: |-
                            Path of the mountpoint.

                            The path must be absolute, not contain `.` and `..` components, and not
                            contain colons (`:`). The path must point to an empty directory. If the
                            directory does not exist, it is created.
                        format: regex
                    readonly:
                        example: false
                        type: boolean
                        description: Whether the volume should be mounted read-only.
                - oneOf:
                    - title: uuid
                      required:
                        - uuid
                      type: object
                      properties:
                        uuid:
                            example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                            type: string
                            description: |-
                                The UUID of the volume to attach. Mutually exclusive with name.
                                Exactly one of uuid or name must be provided.
                            format: uuid
                    - title: name
                      required:
                        - name
                      type: object
                      properties:
                        name:
                            example: funky-vol-g7gum5cj
                            type: string
                            description: |-
                                The name of the volume to attach. Mutually exclusive with UUID.
                                Exactly one of uuid or name must be provided.
            description: A single request item for attaching a volume to an instance.
        AttachVolumesResponse:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    example: Failed to perform all operations
                    type: string
                    description: |-
                        An optional message providing additional information about the status.
                        This field is useful when the status is not `success`.
                data:
                    allOf:
                        - $ref: '#/components/schemas/AttachVolumesResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                op_time_us:
                    example: 46
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                        the request and generate the response.
                    format: uint64
            description: |-
                The response message for attaching one or more volume(s) given their
                UUID(s) or name(s).
        AttachVolumesResponseAttachedVolume:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                uuid:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    description: The UUID of the volume that was attached.
                    format: uuid
                name:
                    example: funky-vol-g7gum5cj
                    type: string
                    description: The name of the volume that was attached.
                metro:
                    example: fra
                    type: string
                    description: |-
                        (Only applies when using global control plane).
                        The metro of the volume.
                message:
                    example: No volume with name 'funky-town-g756b5d'
                    type: string
                    description: |-
                        An optional message providing additional information about the status.
                        This field is useful when the status is not `success`.
                error:
                    example: 8
                    type: integer
                    description: |-
                        An optional error code providing additional information about the status.
                        This field is useful when the status is not `success`.
                    format: int32
        AttachVolumesResponseData:
            type: object
            properties:
                volumes:
                    type: array
                    items:
                        $ref: '#/components/schemas/AttachVolumesResponseAttachedVolume'
                    description: The volume(s) which were attached by the request.
        AutoscalePolicy:
            type: object
            properties:
                name:
                    example: funky-policy
                    type: string
                    description: The name of the policy.
                metro:
                    example: fra
                    type: string
                    description: |-
                        (Only applies when using global control plane).
                        The metro of the service group the policy applies to.
                enabled:
                    example: true
                    type: boolean
                    description: If the policy is enabled.
                metric:
                    enum:
                        - "cpu"
                    type: string
                    description: Metric to use for the step policy.
                    format: enum
                adjustment_type:
                    enum:
                        - "change"
                        - "exact"
                        - "percentage"
                    type: string
                    description: The type of adjustment to be made in the step policy.
                    format: enum
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/AutoscalePolicyStep'
                    description: |-
                        The steps for the step policy.
                        Each step defines an adjustment value and optional bounds.
            description: |-
                AutoscalePolicy defines the autoscale policy for a service.
                Right now it contains fields from both the `ondemand` and `step` policies.
                They are marked both as optional, so only one of them should be set at a
                time. This is a current limitation of the API design.
        AutoscalePolicyStep:
            type: object
            properties:
                adjustment:
                    example: 50
                    type: integer
                    description: The adjustment value for the step.
                    format: int64
                lower_bound:
                    example: 10
                    type: integer
                    description: Lower bound for the step.
                    format: int64
                upper_bound:
                    example: 500
                    type: integer
                    description: Upper bound for the step.
                    format: int64
        BodyInstanceID:
            type: object
            properties:
                uuid:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    description: The UUID of the instance that the volume is detached from.
                    format: uuid
                name:
                    example: funky-town-g7gum5cj
                    type: string
                    description: The name of the instance that the volume is detached from.
            description: Reference to the instance to detach the volume from.
        Certificate:
            type: object
            properties:
                uuid:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    description: |-
                        The UUID of the certificate.

                        This is a unique identifier for the certificate that is generated when the
                        certificate is created.  The UUID is used to reference the certificate in
                        API calls and can be used to identify the certificate in all API calls that
                        require an identifier.
                    format: uuid
                name:
                    example: funky-certificate
                    type: string
                    description: |-
                        The name of the certificate.

                        This is a human-readable name that can be used to identify the certificate.
                        The name must be unique within the context of your account.  The name can
                        also be used to identify the certificate in API calls.
                metro:
                    example: fra
                    type: string
                    description: |-
                        (Only applies when using global control plane).
                        Where the certificate is located.
                created_at:
                    example: 2023-10-01T12:00:00Z
                    type: string
                    description: The time the certificate was created.
                    format: date-time
                common_name:
                    example: my-common-name
                    type: string
                    description: |-
                        The common name (CN) field from the certificate's subject.

                        This is typically the primary domain name that the certificate is issued
                        for. It represents the main identity that the certificate validates.
                subject:
                    example: example.com
                    type: string
                    description: |-
                        The complete subject distinguished name (DN) of the certificate.

                        This contains the full subject information from the certificate, including
                        the common name, organization, organizational unit, locality, state, and
                        country. The subject identifies the entity that the certificate is issued to.
                issuer:
                    example: CN=R10,O=Let's Encrypt,C=US
                    type: string
                    description: |-
                        The complete issuer distinguished name (DN) of the certificate.

                        This identifies the Certificate Authority (CA) that issued the certificate.
                        It contains information about the CA including its common name, organization,
                        and country.
                serial_number:
                    example: 123456789ABCDEF123456789ABCDEF123456
                    type: string
                    description: |-
                        The unique serial number assigned to the certificate by the issuing CA.

                        This is a unique identifier within the scope of the issuing CA that can be
                        used to identify and track the certificate. Serial numbers are typically
                        represented as hexadecimal strings.
                not_before:
                    example: 2023-10-01T12:00:00Z
                    type: string
                    description: |-
                        The date and time when the certificate becomes valid.

                        The certificate should not be trusted before this date. This timestamp
                        marks the beginning of the certificate's validity period.
                    format: date-time
                not_after:
                    example: 2023-10-01T12:00:00Z
                    type: string
                    description: |-
                        The date and time when the certificate expires.

                        The certificate should not be trusted after this date. This timestamp
                        marks the end of the certificate's validity period. Certificates should
                        be renewed before this date to maintain service availability.
                    format: date-time
                state:
                    enum:
                        - "pending"
                        - "valid"
                        - "error"
                    type: string
                    description: |-
                        The current state of the certificate.

                        This indicates whether the certificate is pending issuance, valid and
                        ready for use, or in an error state. See CertificateState enum for
                        detailed state descriptions.
                    format: enum
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: |-
                        An optional field representing the status of the request.  This field is
                        only set when this message object is used as a response message.
                message:
                    example: No certificate with name 'funky-town-g756b5d'
                    type: string
                    description: |-
                        An optional message providing additional information about the status.
                        This field is only set when this message object is used as a response
                        message, and is useful when the status is not `success`.
                error:
                    example: 8
                    type: integer
                    description: |-
                        An optional error code providing additional information about the status.
                        This field is only set when this message object is used as a response
                        message, and is useful when the status is not `success`.
                    format: int32
        CloneVolumeByUUIDRequestBody:
            type: object
            properties:
                vol_name:
                    example: funky-vol-t7qumh5j
                    type: string
                    description: |-
                        The name of the new cloned volume.  If not provided, a random name
                        of the form `vol-X` is generated for you, where `X` is a 5 character
                        long random alphanumeric suffix.
                quota_policy:
                    example: static
                    enum:
                        - "static"
                        - "dynamic"
                    type: string
                    description: |-
                        The quota policy for the new cloned volume.  If not provided, the quota
                        policy of the source volume is used.
                    format: enum
                tags:
                    type: array
                    items:
                        type: string
                    description: A list of tags to assign to the new cloned volume.
        CloneVolumesRequestItem:
            type: object
            allOf:
                - type: object
                  properties:
                    vol_name:
                        example: funky-vol-t7qumh5j
                        type: string
                        description: |-
