  /v1/instances/checkpoints:
    get:
      operationId: GetCheckpointInstances
      summary: List Checkpoint Instances
      description: Get one or more checkpoint instances by their UUID(s) or name(s).
      parameters:
        - $ref: '#/components/parameters/Common.NameOrUUIDQueryParams.uuid'
        - $ref: '#/components/parameters/Common.NameOrUUIDQueryParams.name'
        - $ref: '#/components/parameters/Common.ListQueryParams.details'
        - $ref: '#/components/parameters/Common.ListQueryParams.count'
        - $ref: '#/components/parameters/Common.ListQueryParams.from'
        - $ref: '#/components/parameters/Common.ListQueryParams.order'
        - $ref: '#/components/parameters/Common.ListQueryParams.sortby'
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.GetCheckpointInstancesResponse'
      tags:
        - instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Common.NameOrUUID'
    post:
      operationId: CreateCheckpointInstances
      summary: Create Checkpoint Instances
      description: |-
        Create a checkpoint from an existing instance. A checkpoint captures the
        state of an instance at a specific point in time. Checkpoints can be
        created from running, stopped, or standby instances.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.CreateCheckpointInstancesResponse'
      tags:
        - instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Instances.CreateCheckpointInstancesRequestItem'
    delete:
      operationId: DeleteCheckpointInstances
      summary: Delete Checkpoint Instances
      description: |-
        Delete the specified checkpoint instance(s) by ID(s) (name or UUID).
        After this call the IDs of the checkpoint instances are no longer valid.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.DeleteCheckpointInstancesResponse'
      tags:
        - instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Common.NameOrUUID'
    patch:
      operationId: UpdateCheckpointInstances
      summary: Update Checkpoint Instances
      description: Update (modify) one or more checkpoint instances by ID(s) (name or UUID).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.UpdateCheckpointInstancesResponse'
      tags:
        - instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Instances.UpdateCheckpointInstancesRequestItem'
  /v1/instances/checkpoints/history:
    get:
      operationId: GetCheckpointHistory
      summary: Get Checkpoint History
      description: |-
        Get the checkpoint history of one or more checkpoint instances.
        Returns the ordered list of checkpoints in each checkpoint's history.
      parameters:
        - $ref: '#/components/parameters/Common.NameOrUUIDQueryParams.uuid'
        - $ref: '#/components/parameters/Common.NameOrUUIDQueryParams.name'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.GetCheckpointHistoryResponse'
      tags:
        - instances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Common.NameOrUUID'
  /v1/instances/checkpoints/{uuid}:
    get:
      operationId: GetCheckpointInstanceByUUID
      summary: Get Checkpoint Instance by UUID
      description: Get a single checkpoint instance by its UUID.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: details
          in: query
          required: false
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.GetCheckpointInstancesResponse'
      tags:
        - instances
    delete:
      operationId: DeleteCheckpointInstanceByUUID
      summary: Delete Checkpoint Instance by UUID
      description: |-
        Delete a specified checkpoint instance by its UUID. After this call the
        UUID of the checkpoint instance is no longer valid.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
