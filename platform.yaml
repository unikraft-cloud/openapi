    Certificates.Certificate:
      type: object
      required:
        - uuid
        - name
        - created_at
        - common_name
        - state
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/Common.ResponseStatus'
          description: Indicates whether the operation was successful for this item.
        message:
          type: string
          description: An optional message providing additional information.
        error:
          type: integer
          format: int32
          description: An optional error code.
        uuid:
          type: string
          format: uuid
          description: The UUID of the resource.
        name:
          type: string
          description: The human-readable name of the resource.
        created_at:
          type: string
          format: date-time
          description: The time the certificate was created.
        common_name:
          type: string
          description: |-
            The common name (CN) field from the certificate's subject.

            This is typically the primary domain name that the certificate is issued
            for. It represents the main identity that the certificate validates.
          example: my-common-name
        subject:
          type: string
          description: |-
            The complete subject distinguished name (DN) of the certificate.

            This contains the full subject information from the certificate, including
            the common name, organization, organizational unit, locality, state, and
            country. The subject identifies the entity that the certificate is issued to.
            Only present when the certificate has been issued.
          example: example.com
        issuer:
          type: string
          description: |-
            The complete issuer distinguished name (DN) of the certificate.

            This identifies the Certificate Authority (CA) that issued the certificate.
            It contains information about the CA including its common name, organization,
            and country.
            Only present when the certificate has been issued.
          example: CN=R10,O=Let's Encrypt,C=US
        serial_number:
          type: string
          description: |-
            The unique serial number assigned to the certificate by the issuing CA.

            This is a unique identifier within the scope of the issuing CA that can be
            used to identify and track the certificate. Serial numbers are typically
            represented as hexadecimal strings.
            Only present when the certificate has been issued.
          example: 123456789ABCDEF123456789ABCDEF123456
        not_before:
          type: string
          format: date-time
          description: |-
            The date and time when the certificate becomes valid.

            The certificate should not be trusted before this date. This timestamp
            marks the beginning of the certificate's validity period.
            Only present when the certificate has been issued.
        not_after:
          type: string
          format: date-time
          description: |-
            The date and time when the certificate expires.

            The certificate should not be trusted after this date. This timestamp
            marks the end of the certificate's validity period. Certificates should
            be renewed before this date to maintain service availability.
            Only present when the certificate has been issued.
        state:
          allOf:
            - $ref: '#/components/schemas/Certificates.CertificateState'
          description: |-
            The current state of the certificate.

            This indicates whether the certificate is pending issuance, valid and
            ready for use, or in an error state. See CertificateState enum for
            detailed state descriptions.
        validation:
          allOf:
            - $ref: '#/components/schemas/Certificates.CertificateValidation'
          description: Validation status when state is pending.
        service_groups:
          type: array
          items:
            $ref: '#/components/schemas/Common.ID'
          description: Service groups using this certificate.
      description: Certificate with per-item response envelope fields merged in.
    Certificates.CertificateState:
      type: string
      enum:
        - pending
        - valid
        - error
      description: |-
        The current state of a certificate.

        The certificate can be in one of the following states:

        | State     | Description |
        |-----------|-------------|
        | `pending` | The certificate request is pending while the certificate is being requested from the certification authority. During this phase any service using this certificate is not available if this is not a renewal. |
        | `valid`   | The certificate is valid and can be used by your services. |
        | `error`   | The certificate request failed after multiple attempts. This can happen, for example, if your DNS configuration is not correct, you run into Let's Encrypt™ quota limits, or the domain validation process failed for some other reason. There won't be any further automatic attempts. |
    Certificates.CertificateValidation:
      type: object
      required:
        - attempt
        - next
      properties:
        attempt:
          type: integer
          format: int32
          description: The current validation attempt number.
        next:
          type: string
          format: date-time
          description: The next validation attempt time.
      description: Validation status for a pending certificate.
    Certificates.CreateCertificateRequest:
      type: object
      required:
        - chain
        - pkey
      properties:
        name:
          type: string
          description: |-
            The name of the certificate.

            This is a human-readable name that can be used to identify the certificate.
            The name must be unique within the context of your account. If no name is
            specified, a random name is generated for you. The name can also be used
            to identify the certificate in API calls.
          example: funky-certificate
        cn:
          type: string
          description: |-
            The common name (CN) of the certificate.

            Deprecated: Use `common_name` instead.
          deprecated: true
          example: funky-town.com
        common_name:
          type: string
          description: |-
            The common name (CN) of the certificate.

            This must be a fully-qualified domain name (FQDN). Exactly one of `cn`
            or `common_name` must be specified.
          example: funky-town.com
        chain:
          type: string
          description: The certificate chain in PEM format. Required for user-uploaded certificates.
        pkey:
          type: string
          description: The private key in PEM format. Required for user-uploaded certificates.
      description: The request message for creating/uploading a new certificate.
    Certificates.CreateCertificateResponse:
      type: object
