                    items:
                        type: string
                    description: |-
                        The entrypoint of the image is the command that is run when the image is
                        started.
                cmd:
                    type: array
                    items:
                        type: string
                    description: The command to run when the image is started.
                env:
                    type: array
                    items:
                        type: string
                    description: The environment variables to set when the image is started.
                ports:
