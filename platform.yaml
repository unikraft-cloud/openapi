                $ref: '#/components/schemas/Images.GetImagesResponse'
      tags:
        - images
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Images.GetImagesRequestTagOrDigest'
    post:
      operationId: PinImages
      summary: Pin Images
      description: |-
        Pull and pin one or more images so they stay cached and are never
        evicted, without relying on an on-demand pull to succeed at instance
        start. If a pull fails, the agent's error is returned in the entry's
        `message` field.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Images.PinImagesResponse'
      tags:
        - images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Images.PinImageRequestItem'
    delete:
      operationId: UnpinImages
      summary: Unpin Images
      description: |-
        Unpin one or more images by UUID, making them eligible for normal
        cache eviction again. This does not delete the image.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Images.UnpinImagesResponse'
      tags:
        - images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Images.UnpinImageRequestItem'
