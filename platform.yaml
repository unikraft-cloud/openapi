        Service:
            type: object
            properties:
                port:
                    type: integer
                    description: |-
                        This is the public-facing port that the service will be accessible from
                        on the Internet.
                    format: uint32
                destination_port:
                    type: string
                    description: |-
                        The port number that the instance is listening on.  This is the internal
