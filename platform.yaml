                        that this volume is attached to.
                attached_to:
                    type: array
                    items:
                        $ref: '#/components/schemas/VolumeInstanceID'
                    description: List of instances that this volume is attached to.
                mounted_by:
                    type: array
                    items:
                        $ref: '#/components/schemas/VolumeInstanceMount'
                    description: |-
                        List of instances that have this volume mounted.
                        This does not apply to template volumes.
                tags:
                    type: array
                    items:
                        type: string
                    description: |-
                        The tags associated with the volume.
                        Maximum 16 tags are allowed, and each tag may not be longer than 256 characters.
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: |-
                        An optional field representing the status of the request.  This field is
                        only set when this message object is used as a response message.
                message:
                    example: No volume with name 'funky-town-g756b5d'
                    type: string
                    description: |-
                        An optional message providing additional information about the status.
                        This field is only set when this message object is used as a response
                        message, and is useful when the status is not `success`.
                error:
                    example: 8
                    type: integer
                    description: |-
                        An optional error code providing additional information about the status.
                        This field is only set when this message object is used as a response
                        message, and is useful when the status is not `success`.
                    format: int32
                quota_policy:
                    example: static
                    enum:
                        - "static"
                        - "dynamic"
                    type: string
                    description: Either static or dynamic reservation.
                    format: enum
                delete_lock:
                    example: false
                    type: boolean
                    description: If set to true, the volume cannot be deleted.
                free_mb:
                    example: 32
                    type: integer
                    description: The amount of free space in the volume in megabytes.
                    format: uint32
                filesystem:
                    example: ext4
                    type: string
                    description: |-
                        The filesystem type of this volume.
                        Without custom configuration, this is either `ext4` or `virtiofs`.
                host_path:
                    example: /usr/lib/unikraft/volumes/my-vol
                    type: string
                    description: |-
                        Host path backing this managed volume.
                        This field is only available for managed volumes and users with
                        appropriate permissions.
                args:
                    example: {"arg1": "value1", "arg2": "value2"}
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Optional script arguments that were applied to the custom volume filesystem
                        initialization scripts.
            description: A volume represents a storage device that can be attached to an instance.
        VolumeInstanceID:
            type: object
            properties:
                uuid:
                    example: c1d2e3f4-5678-90ab-cdef-1234567890ab
                    type: string
                    description: The UUID of the instance that the volume is attached to.
                    format: uuid
                name:
                    example: funky-town-g7gum5cj
                    type: string
                    description: The name of the instance that the volume is attached to.
            description: Reference to the instance to attach the volume to.
        VolumeInstanceMount:
            type: object
            properties:
                uuid:
                    example: funky-town-g7gum5cj
                    type: string
                    description: The UUID of the instance that the volume is mounted in.
                    format: uuid
                name:
                    example: funky-town-g7gum5cj
                    type: string
                    description: The name of the instance that the volume is mounted in.
                readonly:
                    example: true
                    type: boolean
                    description: Whether the volume is mounted read-only or read-write.
        WaitInstanceByUUIDRequestBody:
            type: object
            properties:
                state:
                    enum:
                        - "stopped"
                        - "starting"
                        - "running"
                        - "draining"
                        - "stopping"
                        - "template"
                        - "standby"
                    type: string
                    description: The desired state to wait for.  Default is `running`.
                    format: enum
                timeout_ms:
                    example: 450
                    type: integer
                    description: |-
                        Timeout in milliseconds to wait for the instance to reach the desired
                        state.  If the timeout is reached, the request will fail with an error.
                        A value of -1 means to wait indefinitely until the instance reaches the
                        desired state.
                    format: int64
            description: Wait parameters.
        WaitInstancesRequestItem:
            type: object
            allOf:
                - type: object
                  properties:
                    state:
                        enum:
                            - "stopped"
                            - "starting"
                            - "running"
                            - "draining"
                            - "stopping"
                            - "template"
                            - "standby"
                        type: string
                        description: The desired state to wait for.  Default is `running`.
                        format: enum
                    timeout_ms:
                        example: 450
                        type: integer
                        description: |-
                            Timeout in milliseconds to wait for the instance to reach the desired
                            state.  If the timeout is reached, the request will fail with an error.
                            A value of -1 means to wait indefinitely until the instance reaches the
                            desired state.
                        format: int64
                - oneOf:
                    - title: uuid
                      type: object
                      properties:
                        uuid:
                            example: 123e4567-e89b-12d3-a456-426614174000
                            type: string
                            description: The UUID of the instance to wait for.  Mutually exclusive with name.
                            format: uuid
                    - title: name
                      type: object
                      properties:
                        name:
                            example: funky-town-g756b5d
                            type: string
                            description: The name of the instance to wait for.  Mutually exclusive with UUID.
            description: A single wait operation to be applied to an instance.
        WaitInstancesResponse:
            type: object
            properties:
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
                message:
                    example: Failed to perform all operations
                    type: string
                    description: |-
                        An optional message providing additional information about the status.
                        This field is useful when the status is not `success`.
                data:
                    allOf:
                        - $ref: '#/components/schemas/WaitInstancesResponseData'
                    description: The response data for this request.
                errors:
                    type: array
                    items:
                        $ref: '#/components/schemas/ResponseError'
                    description: A list of errors which may have occurred during the request.
                op_time_us:
                    example: 450
                    type: integer
                    description: |-
                        The operation time in microseconds.  This is the time it took to process
                        the request and generate the response.
                    format: uint64
            description: |-
                The response message for waiting for one or more instance(s) to reach a
                certain state given their UUID(s) or name(s).
        WaitInstancesResponseData:
            type: object
            properties:
                instances:
                    type: array
                    items:
                        $ref: '#/components/schemas/WaitInstancesResponseWaitedInstance'
                    description: The instance(s) which this requested waited on.
        WaitInstancesResponseWaitedInstance:
            type: object
            properties:
                uuid:
                    example: 123e4567-e89b-12d3-a456-426614174000
                    type: string
                    description: The UUID of the instance.
                    format: uuid
                name:
                    example: funky-town-g756b5d
                    type: string
                    description: The name of the instance.
                state:
                    enum:
                        - "stopped"
                        - "starting"
                        - "running"
                        - "draining"
                        - "stopping"
                        - "template"
                        - "standby"
                    type: string
                    description: The current state of the instance.
                    format: enum
                message:
                    example: No instance with name 'funky-town-g756b5d'
                    type: string
                    description: |-
                        An optional message providing additional information about the status.
                        This field is useful when the status is not `success`.
                error:
                    example: 8
                    type: integer
                    description: |-
                        An optional error code providing additional information about the status.
                        This field is useful when the status is not `success`.
                    format: int32
                status:
                    allOf:
                        - $ref: '#/components/schemas/ResponseStatus'
                    description: The status of the response.
    securitySchemes:
        bearerToken:
            type: http
            scheme: bearer
security:
    - bearerToken: []
tags:
    - name: Autoscale
      description: |-
        Services allow you to load balance traffic for an Internet-facing service
        like a webserver by creating multiple instances within the same service.
        While you can add or remove instances to a service to scale your service,
        doing this manually makes it hard to react to changes in service load. On
        the other hand, always keeping a large number of instances running to cope
        with bursts is not an option either. This is where autoscale comes into play.
        With autoscale enabled, Unikraft Cloud takes the heavy lifting of constantly
        monitoring the load of your service and automatically creates or deletes
        instances as needed.
    - name: Certificates
      description: |-
        Unikraft Cloud allows you to host your deployment at subdomains of the
        intended metro and/or use custom domains (e.g., example.com).  Typically,
        Unikraft Cloud will automatically generate a TLS certificate for you based
        on Let's Encrypt™ via a DNS-01 challenge.

        For subdomains, your deployment will use the wildcard TLS certificate of the
        respective Unikraft Cloud metro.

        For wildcard domains you have to supply your own certificate.  If you want to
        use Let's Encrypt™ you can use their DNS-based challenge and upload the
        resulting certificate to Unikraft Cloud.
    - name: Images
      description: |-
        An image is a collection of objects representing a VM which can be deployed
        on Unikraft Cloud.  Its format is based on the OCI Image Specification.
        Within the context of Unikraft Cloud, these images also include a kernel
        component.
    - name: Instances
      description: An instance is a unikernel virtual machine running an application.
    - name: Node
    - name: ServiceGroups
      description: |-
        A service group on Unikraft Cloud is used to describe how your application
        exposes its functionality to the outside world.  Once defined, assigning an
        instance to the service will make it accessible from the Internet.

        An application, running as an instance, may expose one or more ports, e.g. it
        listens on port 80 because your application exposes a HTTP web service. This,
        along with a set of additional metadata defines how the "service" is
        configured and accessed.  For example, a service may be configured to use
        TLS, or be bound to a specific domain name.

        When an instance is assigned to a service group, it immediately becomes
        accessible over the Internet on the exposed public port, using the set DNS
        name, and is routed to the set destination port.

        Note: If you do not specify a DNS name when you create a service and you
        indicate that the application exposes some ports, Unikraft Cloud will
        generates a random DNS name for you.  Unikraft Cloud also supports custom
        domains like www.example.com and wildcard domains like *.example.com.
    - name: Users
      description: |-
        Unikraft Cloud user accounts are used to manage resources, grant permissions
        and control usage quotas when interacting with the Unikraft Cloud API.
    - name: Volumes
      description: |-
        Initrd (initial ramdisk) and actual volumes serve different purposes.
        An initrd is a file system loaded into memory during the boot process of the
        instance. Any new files created as well as any modifications made to files
        in the initrd are lost when the instance is stopped. In contrast, a volume
        is a persistent storage device that keeps data across restarts. In addition,
        it can be initialized with a set of files with one instance and then be
        detached and attached to a another one.
