        - $ref: '#/components/parameters/Common.ListQueryParams.details'
        - $ref: '#/components/parameters/Common.ListQueryParams.count'
        - $ref: '#/components/parameters/Common.ListQueryParams.from'
        - $ref: '#/components/parameters/Common.ListQueryParams.order'
        - $ref: '#/components/parameters/Common.ListQueryParams.sortby'
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instances.GetInstancesResponse'
      tags:
        - instances
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Common.NameOrUUID'
    delete:
      operationId: DeleteInstances
      summary: Delete Instances
      description: Delete instances by ID(s).
      parameters: []
      responses:
        '200':
