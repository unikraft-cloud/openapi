          schema:
            type: string
          explode: false
        - name: tag
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Images.GetImagesResponse'
      tags:
        - images
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Images.GetImagesRequestTagOrDigest'
  /v1/images:
    get:
      operationId: GetImages
      summary: Get Images
      description: Retrieve all images.
      parameters:
        - name: digest
          in: query
          required: false
          schema:
            type: string
          explode: false
        - name: tag
          in: query
          required: false
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
