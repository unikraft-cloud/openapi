openapi: 3.0.3
info:
    title: Unikraft Cloud Platform API
    description: This specification describes the Unikraft Cloud Platform API, which provides mechanisms to interact with Unikraft Cloud metros. It allows you to create, manage, and interact with instances running on the platform.
    contact:
        name: Unikraft Support
        url: https://unikraft.com/contact
        email: support@unikraft.com
    version: v1.0.0
servers:
    - url: https://api.{metro}.unikraft.cloud
      description: Official Unikraft Cloud Metros
      variables:
        metro:
            enum:
                - dal0
                - fra0
                - sin0
                - was1
            default: fra0
            description: The IATA and numeric code of the metro to connect to.
paths:
    /v1/certificates:
        get:
            tags:
                - Certificates
            description: |-
                Get one or many certificates with their current status and configuration.
                It's possible to filter this list by name or UUID.
            operationId: GetCertificates
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the certificate in the response.  By
                    default this is set to true, meaning that all information about the
                    certificate will be included in the response.  If set to false, only the
                    basic information about the certificate will be included, such as its name
                    and UUID.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetCertificatesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCertificatesResponse'
        post:
            tags:
                - Certificates
            description: Upload a new certificate with the given configuration.
            operationId: CreateCertificate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCertificateRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateCertificateResponse'
        delete:
            tags:
                - Certificates
            description: |-
                Delete a specified certificate by its UUID.  After this call the UUID of
                the certificate are no longer valid.
            operationId: DeleteCertificates
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DeleteCertificatesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCertificatesResponse'
    /v1/certificates/{uuid}:
        get:
            tags:
                - Certificates
            description: Get a specified certificate by its UUID.
            operationId: GetCertificateByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the certificate.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCertificatesResponse'
        delete:
            tags:
                - Certificates
            description: |-
                Delete the specified certificate(s).  After this call the name of the
                certificate(s) are no longer valid.
            operationId: DeleteCertificateByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the certificate to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteCertificatesResponse'
    /v1/images/digest/{digest}:
        get:
            tags:
                - Images
            description: GetImageByDigest retrieves an image by its digest.
            operationId: GetImageByDigest
            parameters:
                - name: digest
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetImageResponse'
    /v1/images/tag/{tag}:
        get:
            tags:
                - Images
            description: GetImageByTag retrieves an image by its tag.
            operationId: GetImageByTag
            parameters:
                - name: tag
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetImageResponse'
    /v1/instances:
        get:
            tags:
                - Instances
            description: |-
                Get one or many instances with their current status and configuration.
                It's possible to filter this list by name or UUID.
            operationId: GetInstances
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the instance in the response.  By default
                    this is set to true, meaning that all information about the instance will
                    be included in the response.  If set to false, only the basic information
                    about the instance will be included, such as its name and UUID.
                  schema:
                    type: boolean
                - name: metrics
                  in: query
                  description: |-
                    Whether to include metrics about the instance in the response.  By default
                    this is set to false, meaning that no metrics will be included in the
                    response.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetInstancesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesResponse'
        post:
            tags:
                - Instances
            description: Creates one or more new instances.
            operationId: CreateInstance
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateInstanceRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateInstanceResponse'
        delete:
            tags:
                - Instances
            description: |-
                Delete the specified instance(s).  After this call the name of the
                instances are no longer valid.  If the instances are currently running,
                they are force stopped.
            operationId: DeleteInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DeleteInstancesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteInstancesResponse'
    /v1/instances/logs:
        put:
            tags:
                - Instances
            description: Retrieve the logs of an instance by its UUID or name.
            operationId: GetInstanceLogs
            parameters:
                - name: uuid
                  in: query
                  description: |-
                    The UUID of the instance to retrieve logs for.  Mutually exclusive with
                    name.
                  schema:
                    type: string
                - name: name
                  in: query
                  description: |-
                    The name of the instance to retrieve logs for.  Mutually exclusive with
                    UUID.
                  schema:
                    type: string
                - name: offset
                  in: query
                  description: |-
                    The byte offset of the log output to receive.  A negative sign makes the
                    offset relative to the end of the log.
                  schema:
                    type: integer
                    format: uint64
                - name: limit
                  in: query
                  description: The amount of bytes to return at most.
                  schema:
                    type: integer
                    format: int64
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceLogsResponse'
    /v1/instances/metrics:
        put:
            tags:
                - Instances
            description: Get the metrics of an instance by its UUID or name.
            operationId: GetInstanceMetrics
            parameters:
                - name: uuid
                  in: query
                  description: |-
                    The UUID of the instance to retrieve metrics for.  Mutually exclusive
                    with name.
                  schema:
                    type: string
                - name: name
                  in: query
                  description: |-
                    The name of the instance to retrieve metrics for.  Mutually exclusive
                    with UUID.
                  schema:
                    type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceMetricsResponse'
    /v1/instances/start:
        put:
            tags:
                - Instances
            description: |-
                Starts previously stopped instances by their UUID(s) or name(s) or does
                nothing if the instance is already running.
            operationId: StartInstances
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/StartInstancesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StartInstanceResponse'
    /v1/instances/stop:
        put:
            tags:
                - Instances
            description: |-
                Stops one or more running instance by their UUID(s) or name(s) or does
                nothing if the instance is already stopped.
            operationId: StopInstances
            parameters:
                - name: force
                  in: query
                  description: Whether to immediately force stop the instance.
                  schema:
                    type: boolean
                - name: drain_timeout_ms
                  in: query
                  description: |-
                    Timeout for draining connections in milliseconds.  The instance does not
                    receive new connections in the draining phase.  The instance is stopped
                    when the last connection has been closed or the timeout expired.  The
                    maximum timeout may vary.  Use -1 for the largest possible value.

                    Note: This endpoint does not block.  Use the wait endpoint for the
                    instance to reach the stopped state.
                  schema:
                    type: integer
                    format: uint64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/StopInstancesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StopInstanceResponse'
    /v1/instances/wait:
        get:
            tags:
                - Instances
            description: |-
                Waits for an instance to reach a certain state by its UUID or name.

                If the instance is already in the desired state, the request will return
                immediately.  If the instance is not in the desired state, the request will
                block until the instance reaches the desired state or the timeout is
                reached.  If the timeout is reached, the request will fail with an error.
                If the timeout is -1, the request will block indefinitely until the
                instance reaches the desired state.
            operationId: WaitInstances
            parameters:
                - name: state
                  in: query
                  description: The desired state to wait for.  Default is `running`.
                  schema:
                    enum:
                        - "stopped"
                        - "starting"
                        - "running"
                        - "draining"
                        - "stopping"
                        - "standby"
                    type: string
                    format: enum
                - name: timeout_ms
                  in: query
                  description: |-
                    Timeout in milliseconds to wait for the instance to reach the desired
                    state.  If the timeout is reached, the request will fail with an error.
                    A value of -1 means to wait indefinitely until the instance reaches the
                    desired state.
                  schema:
                    type: integer
                    format: int64
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/WaitInstancesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WaitInstanceResponse'
    /v1/instances/{uuid}:
        get:
            tags:
                - Instances
            description: Get a single instance by its ID which can either be its name or UUID.
            operationId: GetInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to get.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the instance in the response.  By default
                    this is set to true, meaning that all information about the instance will
                    be included in the response.  If set to false, only the basic information
                    about the instance will be included, such as its name and UUID.
                  schema:
                    type: boolean
                - name: metrics
                  in: query
                  description: |-
                    Whether to include metrics about the instance in the response.  By default
                    this is set to false, meaning that no metrics will be included in the
                    response.
                  schema:
                    type: boolean
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstancesResponse'
        delete:
            tags:
                - Instances
            description: |-
                Delete a specified instance by its UUID.  After this call the UUID of the
                instances are no longer valid.  If the instances are currently running,
                they are force stopped.
            operationId: DeleteInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteInstancesResponse'
    /v1/instances/{uuid}/logs:
        put:
            tags:
                - Instances
            description: Retrieve the logs of an instance by its UUID.
            operationId: GetInstanceLogsByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: offset
                  in: query
                  description: |-
                    The byte offset of the log output to receive.  A negative sign makes the
                    offset relative to the end of the log.
                  schema:
                    type: integer
                    format: uint64
                - name: limit
                  in: query
                  description: The amount of bytes to return at most.
                  schema:
                    type: integer
                    format: int64
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceLogsResponse'
    /v1/instances/{uuid}/metrics:
        put:
            tags:
                - Instances
            description: Get the metrics of an instance by its UUID.
            operationId: GetInstanceMetricsByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to retrieve metrics for.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetInstanceMetricsResponse'
    /v1/instances/{uuid}/start:
        put:
            tags:
                - Instances
            description: |-
                Starts previously stopped instance by its UUID or does nothing if the
                instance is already running.
            operationId: StartInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to start.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StartInstanceResponse'
    /v1/instances/{uuid}/stop:
        put:
            tags:
                - Instances
            description: |-
                Stops a running instance by its UUID or does nothing if the instance is
                already stopped.
            operationId: StopInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to stop.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: force
                  in: query
                  description: Whether to immediately force stop the instance.
                  schema:
                    type: boolean
                - name: drain_timeout_ms
                  in: query
                  description: |-
                    Timeout for draining connections in milliseconds.  The instance does not
                    receive new connections in the draining phase.  The instance is stopped
                    when the last connection has been closed or the timeout expired.  The
                    maximum timeout may vary.  Use -1 for the largest possible value.

                    Note: This endpoint does not block.  Use the wait endpoint for the instance
                    to reach the stopped state.
                  schema:
                    type: integer
                    format: uint64
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StopInstanceResponse'
    /v1/instances/{uuid}/wait:
        get:
            tags:
                - Instances
            description: |-
                Waits for an instance to reach a certain state by its UUID.

                If the instance is already in the desired state, the request will return
                immediately.  If the instance is not in the desired state, the request will
                block until the instance reaches the desired state or the timeout is
                reached.  If the timeout is reached, the request will fail with an error.
                If the timeout is -1, the request will block indefinitely until the
                instance reaches the desired state.
            operationId: WaitInstanceByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the instance to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WaitInstanceByUUIDRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WaitInstanceResponse'
    /v1/service/autoscale:
        get:
            tags:
                - Autoscale
            description: |-
                GetAutoscaleConfigurations returns the current states and configurations of
                autoscale configurations.
            operationId: GetAutoscaleConfigurations
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetAutoscaleConfigurationsRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetAutoscaleConfigurationsResponse'
        post:
            tags:
                - Autoscale
            description: |-
                CreateAutoscaleConfiguration creates an autoscale configuration for the
                specified service.
            operationId: CreateAutoscaleConfiguration
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAutoscaleConfigurationRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAutoscaleConfigurationResponse'
        delete:
            tags:
                - Autoscale
            description: DeleteAutoscaleConfigurations deletes autoscale configurations.
            operationId: DeleteAutoscaleConfigurations
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DeleteAutoscaleConfigurationsRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteAutoscaleConfigurationsResponse'
    /v1/service/{uuid}/autoscale:
        get:
            tags:
                - Autoscale
            description: |-
                GetAutoscaleConfigurationsByServiceGroupUUID returns the current states
                and configurations of autoscale configurations by service UUID.
            operationId: GetAutoscaleConfigurationsByServiceGroupUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the service group.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetAutoscaleConfigurationsResponse'
        post:
            tags:
                - Autoscale
            description: |-
                CreateAutoscaleConfigurationsByServiceGroupUUID creates an autoscale
                configuration for the specified service by UUID.
            operationId: CreateAutoscaleConfigurationsByServiceGroupUUID
            parameters:
                - name: uuid
                  in: path
                  description: |-
                    The UUID of the service to create a configuration for.
                    Mutually exclusive with name.
                  required: true
                  schema:
                    type: string
                    format: uuid
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAutoscaleConfigurationByServiceGroupUUIDRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAutoscaleConfigurationResponse'
        delete:
            tags:
                - Autoscale
            description: |-
                DeleteAutoscaleConfigurationsByServiceGroupUUID deletes autoscale
                configurations by service UUID.
            operationId: DeleteAutoscaleConfigurationsByServiceGroupUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the service group.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteAutoscaleConfigurationsResponse'
    /v1/service/{uuid}/autoscale/policies:
        get:
            tags:
                - Autoscale
            description: |-
                GetAutoscaleConfigurationPolicies returns the current state and
                configuration of an autoscale policy.
            operationId: GetAutoscaleConfigurationPolicies
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GetAutoscaleConfigurationPolicyRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetAutoscaleConfigurationPolicyResponse'
        post:
            tags:
                - Autoscale
            description: |-
                CreateAutoscaleConfigurationPolicy adds a new autoscale policy to an
                autoscale configuration.
            operationId: CreateAutoscaleConfigurationPolicy
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateAutoscaleConfigurationPolicyRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateAutoscaleConfigurationPolicyResponse'
        delete:
            tags:
                - Autoscale
            description: DeleteAutoscaleConfigurationPolicies deletes an autoscale policy.
            operationId: DeleteAutoscaleConfigurationPolicies
            parameters:
                - name: uuid
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeletePolicyRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteAutoscaleConfigurationPolicyResponse'
    /v1/service/{uuid}/autoscale/policies/{name}:
        get:
            tags:
                - Autoscale
            description: |-
                GetAutoscaleConfigurationPolicyByName returns the current state and
                configuration of an autoscale policy by it's name.
            operationId: GetAutoscaleConfigurationPolicyByName
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the service group.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: name
                  in: path
                  description: The name of the policy to get.
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetAutoscaleConfigurationPolicyResponse'
        delete:
            tags:
                - Autoscale
            description: |-
                DeleteAutoscaleConfigurationPolicyByName deletes an autoscale policy by
                name.
            operationId: DeleteAutoscaleConfigurationPolicyByName
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the service group.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: name
                  in: path
                  description: The name of the policy to delete.
                  required: true
                  schema:
                    type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteAutoscaleConfigurationPolicyResponse'
    /v1/services:
        get:
            tags:
                - ServiceGroups
            description: |-
                Get one or many service groups with their current status and configuration.
                It's possible to filter this list by name or UUID.
            operationId: GetServiceGroups
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the service group in the response.  By
                    default this is set to true, meaning that all information about the service
                    group will be included in the response.  If set to false, only the basic
                    information about the service group will be included, such as its name and
                    UUID.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetServiceGroupsRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetServiceGroupsResponse'
        post:
            tags:
                - ServiceGroups
            description: |-
                Create a new service with the given configuration.

                Note that the service properties like published ports can only be defined
                during creation.  They cannot be changed later.  Each port in a service can
                specify a list of handlers that determine how traffic arriving at the port
                is handled. See Connection Handlers for a complete overview.
            operationId: CreateServiceGroup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateServiceGroupRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateServiceGroupResponse'
        delete:
            tags:
                - ServiceGroups
            description: |-
                Delete a specified service group by its UUID.  After this call the UUID of
                the service group are no longer valid.
            operationId: DeleteServiceGroups
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DeleteServiceGroupsRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteServiceGroupsResponse'
    /v1/services/{uuid}:
        get:
            tags:
                - ServiceGroups
            description: Get a specified service group by its UUID.
            operationId: GetServiceGroupByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the service group to retrieve.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetServiceGroupsResponse'
        delete:
            tags:
                - ServiceGroups
            description: |-
                Delete the specified service group(s).  After this call the name of the
                service group(s) are no longer valid.
            operationId: DeleteServiceGroupByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the service group to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteServiceGroupsResponse'
    /v1/users/quotas:
        get:
            tags:
                - Users
            description: |-
                Lists quota usage and limits of your user account.
                Limits are hard limits that cannot be exceeded.
            operationId: GetUser
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QuotasResponse'
    /v1/users/{uuid}/quotas:
        get:
            tags:
                - Users
            description: |-
                Lists quota usage and limits of your user account by UUID.
                Limits are hard limits that cannot be exceeded.
            operationId: GetUserByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the user to retrieve quotas for.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/QuotasResponse'
    /v1/volumes:
        get:
            tags:
                - Volumes
            description: |-
                Returns the current status and the configuration of a particular volume if
                name is specified. Otherwise, returns the current status and configuration
                of all volumes.
            operationId: GetVolumes
            parameters:
                - name: details
                  in: query
                  description: |-
                    Whether to include details about the volume in the response.  By
                    default this is set to true, meaning that all information about the
                    volume will be included in the response.  If set to false, only the
                    basic information about the volume will be included, such as its name
                    and UUID.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/GetVolumesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetVolumesResponse'
        post:
            tags:
                - Volumes
            description: |-
                Creates one or more volumes with the given configuration.
                The volumes are automatically initialized with an empty file system.
                After initialization the volumes are in the available state and can be
                attached to an instance with the `PUT /v1/volumes/attach` endpoint.
                Note that, the size of a volume cannot be changed after creation.
            operationId: CreateVolume
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateVolumeRequest'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateVolumeResponse'
        delete:
            tags:
                - Volumes
            description: |-
                Deletes the specified volume by its name or UUID. Fails if the volume is
                still attached to an instance. After this call the IDs associated with
                the volume are no longer valid.
            operationId: DeleteVolume
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DeleteVolumesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteVolumesResponse'
    /v1/volumes/attach:
        put:
            tags:
                - Volumes
            description: |-
                Attaches a volume to an instance so that the volume is mounted when the
                instance starts. The volume needs to be in available state and the instance
                must in stopped state. Currently, each instance can have only one volume
                attached at most.
            operationId: AttachVolumes
            parameters:
                - name: attach_to.uuid
                  in: query
                  description: The UUID of the instance that the volume is attached to.
                  schema:
                    type: string
                - name: attach_to.name
                  in: query
                  description: The name of the instance that the volume is attached to.
                  schema:
                    type: string
                - name: at
                  in: query
                  description: |-
                    Path of the mountpoint.

                    The path must be absolute, not contain `.` and `..` components, and not
                    contain colons (`:`). The path must point to an empty directory. If the
                    directory does not exist, it is created.
                  schema:
                    type: string
                - name: read_only
                  in: query
                  description: Whether the volume should be mounted read-only.
                  schema:
                    type: boolean
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/AttachVolumesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttachVolumesResponse'
    /v1/volumes/detach:
        post:
            tags:
                - Volumes
            description: |-
                Detaches a volume from instances. If no particular instance is specified
                the volume is detached from all instances. The instances from which to
                detach must not have the volume mounted. The API returns an error for each
                instance from which it was unable to detach the volume. If the volume has
                been created together with an instance, detaching the volume will make it
                persistent (i.e., it survives the deletion of the instance).
            operationId: DetachVolumes
            parameters:
                - name: from.uuid
                  in: query
                  description: The UUID of the instance that the volume is detached from.
                  schema:
                    type: string
                - name: from.name
                  in: query
                  description: The name of the instance that the volume is detached from.
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            type: array
                            items:
                                $ref: '#/components/schemas/DetachVolumesRequestID'
                required: true
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetachVolumesResponse'
    /v1/volumes/{uuid}:
        get:
            tags:
                - Volumes
            description: |-
                Deletes the specified volume by its UUID. Fails if the volume is still
                attached to an instance. After this call the IDs associated with the
                volume are no longer valid.
            operationId: DeleteVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to delete.
                  required: true
                  schema:
                    type: string
                    format: uuid
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteVolumesResponse'
    /v1/volumes/{uuid}/attach:
        get:
            tags:
                - Volumes
            description: |-
                Attaches a volume by UUID to an instance so that the volume is mounted when
                the instance starts. The volume needs to be in available state and the
                instance must in stopped state. Currently, each instance can have only one
                volume attached at most.
            operationId: AttachVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to attach.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: attach_to.uuid
                  in: query
                  description: The UUID of the instance that the volume is attached to.
                  schema:
                    type: string
                - name: attach_to.name
                  in: query
                  description: The name of the instance that the volume is attached to.
                  schema:
                    type: string
                - name: at
                  in: query
                  description: |-
                    Path of the mountpoint.

                    The path must be absolute, not contain `.` and `..` components, and not
                    contain colons (`:`). The path must point to an empty directory. If the
                    directory does not exist, it is created.
                  schema:
                    type: string
                - name: read_only
                  in: query
                  description: Whether the volume should be mounted read-only.
                  schema:
                    type: boolean
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AttachVolumesResponse'
    /v1/volumes/{uuid}/detach:
        get:
            tags:
                - Volumes
            description: |-
                Detaches a volume by UUID from instances. If no particular instance is
                specified the volume is detached from all instances. The instances from
                which to detach must not have the volume mounted. The API returns an error
                for each instance from which it was unable to detach the volume. If the
                volume has been created together with an instance, detaching the volume
                will make it persistent (i.e., it survives the deletion of the instance).
            operationId: DetachVolumeByUUID
            parameters:
                - name: uuid
                  in: path
                  description: The UUID of the volume to detach.
                  required: true
                  schema:
                    type: string
                    format: uuid
                - name: from.uuid
                  in: query
                  description: The UUID of the instance that the volume is detached from.
                  schema:
                    type: string
                - name: from.name
                  in: query
                  description: The name of the instance that the volume is detached from.
                  schema:
                    type: string
            responses:
                default:
                    description: default
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DetachVolumesResponse'
components:
    schemas:
        AttachVolumesRequestID:
            type: object
            allOf:
                - oneOf:
                    - title: uuid
                      required:
                        - uuid
                      type: object
                      properties:
                        uuid:
                            type: string
                            description: The UUID of the volume to attach.  Mutually exclusive with name.
                            format: uuid
                    - title: name
                      required:
                        - name
                      type: object
                      properties:
                        name:
                            type: string
                            description: The name of the volume to attach.  Mutually exclusive with UUID.
            description: An identifier for the volume(s) to attach.
        AttachVolumesResponse:
            type: object
            allOf:
                - type: object
                  properties:
                    status:
                        enum:
                            - "success"
                            - "error"
                        type: string
                        description: The status of the response.
                        format: enum
                    data:
                        allOf:
                            - $ref: '#/components/schemas/AttachVolumesResponseData'
                        description: The response data for this request.
                    op_time_us:
                        type: integer
                        description: |-
                            The operation time in microseconds.  This is the time it took to process
                            the request and generate the response.
                        format: uint64
                - oneOf:
                    - title: message
                      type: object
                      properties:
                        message:
                            type: string
                            description: An optional message providing additional information about the response.
            description: |-
                The response message for attaching one or more volume(s) given their
                UUID(s) or name(s).
        AttachVolumesResponseAttachedVolume:
            type: object
            properties:
                status:
                    enum:
                        - "success"
                        - "error"
                    type: string
                    description: The status of the response.
                    format: enum
                uuid:
                    type: string
                    description: The UUID of the volume that was attached.
                    format: uuid
                name:
                    type: string
                    description: The name of the volume that was attached.
        AttachVolumesResponseData:
            type: object
            properties:
                volumes:
                    type: array
                    items:
                        $ref: '#/components/schemas/AttachVolumesResponseAttachedVolume'
                    description: The volume(s) which were attached by the request.
        AutoscalePolicy:
            type: object
            properties:
                name:
                    type: string
                    description: The name of the policy.
                enabled:
                    type: boolean
                    description: If the policy is enabled.
                metric:
                    enum:
                        - "cpu"
                    type: string
                    description: Metric to use for the step policy.
                    format: enum
                adjustment_type:
                    enum:
                        - "change"
                        - "exact"
                        - "percentage"
                    type: string
                    description: The type of adjustment to be made in the step policy.
                    format: enum
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/AutoscalePolicyStep'
                    description: |-
                        The steps for the step policy.
                        Each step defines an adjustment value and optional bounds.
            description: |-
                AutoscalePolicy defines the autoscale policy for a service.
                Right now it contains fields from both the `ondemand` and `step` policies.
                They are marked both as optional, so only one of them should be set at a
                time. This is a current limitation of the API design.
        AutoscalePolicyStep:
            type: object
            properties:
                adjustment:
                    type: integer
                    description: The adjustment value for the step.
                    format: int64
                lower_bound:
                    type: integer
                    description: Lower bound for the step.
                    format: int64
                upper_bound:
                    type: integer
                    description: Upper bound for the step.
                    format: int64
        Certificate:
            type: object
            properties:
                uuid:
                    type: string
                    description: |-
                        The UUID of the certificate.

                        This is a unique identifier for the certificate that is generated when the
                        certificate is created.  The UUID is used to reference the certificate in
                        API calls and can be used to identify the certificate in all API calls that
                        require an identifier.
                    format: uuid
                name:
                    type: string
                    description: |-
                        The name of the certificate.

                        This is a human-readable name that can be used to identify the certificate.
                        The name must be unique within the context of your account.  The name can
                        also be used to identify the certificate in API calls.
                created_at:
                    type: string
                    description: The time the certificate was created.
                    format: date-time
                common_name:
                    type: string
                state:
                    enum:
                        - "pending"
                        - "valid"
                        - "error"
                    type: string
                    format: enum
        CreateAutoscaleConfigurationByServiceGroupUUIDRequest:
            type: object
            properties:
                uuid:
                    type: string
                    description: |-
                        The UUID of the service to create a configuration for.
                        Mutually exclusive with name.
                    format: uuid
                min_size:
                    type: integer
                    description: The minimum number of instances to keep running.
                    format: int64
                max_size:
                    type: integer
                    description: The maximum number of instances to keep running.
                    format: int64
                warmup_time_ms:
                    type: integer
                    description: The warmup time in milliseconds for new instances.
                    format: int64
                cooldown_time_ms:
                    type: integer
                    description: The cooldown time in milliseconds for the autoscale configuration.
                    format: int64
                create_args:
                    allOf:
                        - $ref: '#/components/schemas/CreateAutoscaleConfigurationByServiceGroupUUIDRequestInstanceCreateArgs'
                    description: The arguments to use when creating the autoscale configuration.
                policies:
                    type: array
                    items:
                        $ref: '#/components/schemas/AutoscalePolicy'
                    description: The policies to apply to the autoscale configuration.
            description: |-
                The request to create an autoscale configuration for a service group based on
                its UUID.
        CreateAutoscaleConfigurationByServiceGroupUUIDRequestInstanceCreateArgs:
            type: object
            allOf:
                - oneOf:
                    - title: roms
                      type: object
                      properties:
                        roms:
                            allOf:
                                - $ref: '#/components/schemas/InstanceCreateArgsInstanceCreateRequestRoms'
                            description: The ROM to use for the autoscale configuration.
                    - title: template
                      type: object
                      properties:
                        template:
                            allOf:
                                - $ref: '#/components/schemas/InstanceCreateArgsInstanceTemplateCreateRequest'
                            description: The template to use for the autoscale configuration.
        CreateAutoscaleConfigurationPolicyRequest:
            required:
                - name
                - type
            type: object
            properties:
                name:
                    type: string
                    description: The Name of the service to add a policy to.
                type:
                    allOf:
                        - $ref: '#/components/schemas/AutoscalePolicy'
                    description: The policy type to add to the autoscale configuration.
        CreateAutoscaleConfigurationPolicyResponse:
            type: object
            allOf:
                - type: object
                  properties:
                    status:
                        enum:
                            - "success"
                            - "error"
                        type: string
                        description: The status of the response.
                        format: enum
                    data:
                        allOf:
                            - $ref: '#/components/schemas/CreateAutoscaleConfigurationPolicyResponseData'
                        description: The response data for this request.
                    op_time_us:
                        type: integer
                        description: |-
                            The operation time in microseconds.  This is the time it took to process
                            the request and generate the response.
                        format: uint64
                - oneOf:
                    - title: message
                      type: object
                      properties:
                        message:
                            type: string
                            description: An optional message providing additional information about the response.
        CreateAutoscaleConfigurationPolicyResponseData:
            type: object
            properties:
                policies:
                    type: array
                    items:
                        $ref: '#/components/schemas/CreateAutoscaleConfigurationPolicyResponsePolicy'
                    description: The policies which were added by the request.
        CreateAutoscaleConfigurationPolicyResponsePolicy:
            type: object
            properties:
                status:
                    enum:
                        - "success"
                        - "error"
                    type: string
                    description: The status of the response.
                    format: enum
                uuid:
                    type: string
                    description: The UUID of the service of the added policy.
                    format: uuid
                name:
                    type: string
                    description: The name of the service of the added policy.
        CreateAutoscaleConfigurationRequest:
            required:
                - uuid
                - name
            type: object
            properties:
                uuid:
                    type: string
                    description: |-
                        The UUID of the service to create a configuration for.
                        Mutually exclusive with name.
                    format: uuid
                name:
                    type: string
                    description: |-
                        The name of the service to create a configuration for.
                        Mutually exclusive with UUID.
                min_size:
                    type: integer
                    description: The minimum number of instances to keep running.
                    format: int64
                max_size:
                    type: integer
                    description: The maximum number of instances to keep running.
                    format: int64
                warmup_time_ms:
                    type: integer
                    description: The warmup time in milliseconds for new instances.
                    format: int64
                cooldown_time_ms:
                    type: integer
                    description: The cooldown time in milliseconds for the autoscale configuration.
                    format: int64
                create_args:
                    allOf:
                        - $ref: '#/components/schemas/CreateAutoscaleConfigurationRequestInstanceCreateArgs'
                    description: The arguments to use when creating the autoscale configuration.
                policies:
                    type: array
                    items:
                        $ref: '#/components/schemas/AutoscalePolicy'
                    description: The policies to apply to the autoscale configuration.
            description: The request to create an autoscale configuration for a service.
        CreateAutoscaleConfigurationRequestInstanceCreateArgs:
            type: object
            allOf:
                - oneOf:
                    - title: roms
                      type: object
                      properties:
                        roms:
                            allOf:
                                - $ref: '#/components/schemas/InstanceCreateArgsInstanceCreateRequestRoms'
                            description: The ROM to use for the autoscale configuration.
                    - title: template
                      type: object
                      properties:
                        template:
                            allOf:
                                - $ref: '#/components/schemas/InstanceCreateArgsInstanceTemplateCreateRequest'
                            description: The template to use for the autoscale configuration.
        CreateAutoscaleConfigurationResponse:
            type: object
            allOf:
                - type: object
                  properties:
                    status:
                        enum:
                            - "success"
                            - "error"
                        type: string
                        description: The status of the response.
                        format: enum
                    data:
                        allOf:
                            - $ref: '#/components/schemas/CreateAutoscaleConfigurationResponseData'
                        description: The response data for this request.
                    op_time_us:
                        type: integer
                        description: |-
                            The operation time in microseconds.  This is the time it took to process
