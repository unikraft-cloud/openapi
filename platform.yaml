          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates.GetCertificatesResponse'
      tags:
        - certificates
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Common.NameOrUUID'
    delete:
      operationId: DeleteCertificates
      summary: Delete Certificates
      description: Delete certificates by ID(s).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates.DeleteCertificatesResponse'
      tags:
        - certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Common.NameOrUUID'
    put:
      operationId: UpdateCertificates
      summary: Update Certificates
      description: Update certificates.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates.UpdateCertificatesResponse'
      tags:
        - certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Certificates.UpdateCertificatesRequestItem'
  /v1/certificates/{uuid}:
    get:
      operationId: GetCertificateByUUID
      summary: Get Certificate by UUID
      description: Get a certificate by UUID.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates.GetCertificatesResponse'
      tags:
        - certificates
    delete:
      operationId: DeleteCertificateByUUID
      summary: Delete Certificate by UUID
      description: Delete a certificate by UUID.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates.DeleteCertificatesResponse'
      tags:
        - certificates
    put:
      operationId: UpdateCertificateByUUID
      summary: Update Certificate by UUID
      description: Update a certificate by UUID.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificates.UpdateCertificatesResponse'
      tags:
        - certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Certificates.UpdateCertificateByUUIDRequestBody'
