openapi: 3.0.0
info:
  title: Unikraft Cloud Sandbox Plugin API
  version: v1.2.0
  description: |-
    This specification describes the Sandbox plugin API, a control API exposed by
    a sandbox instance running on Unikraft Cloud. It provides two services: the
    management of shell commands running inside the sandbox, and reading and
    writing files in the sandbox filesystem.

    Every operation declares a single `default` response: the standard response
    envelope, which carries the outcome of the request in `status`, the
    human-readable reason for a failure in `message` and the HTTP status code in
    `errors`. The HTTP status code itself distinguishes success from failure; the
    status codes an operation can return are documented on the operation. The two
    endpoints which stream bytes rather than JSON (the raw command log and the
    raw file download) return their payload verbatim, unenveloped.

    One endpoint is not an HTTP operation and so does not appear below:
    `GET /commands/{uuid}/ws` upgrades to a WebSocket that streams a command's
    output as it is produced and takes its input, `eof`, `resize` and `signal`
    as frames. The frame contract is documented in the plugin's README.
tags:
  - name: fs
    x-displayName: Filesystem
  - name: commands
    x-displayName: Commands
paths:
  /commands:
    get:
      operationId: ListCommands
      summary: List Commands
      description: |-
        List the UUIDs of all commands, in the order they were started.

        This operation is also the plugin's readiness probe: it takes no
        parameters, changes nothing, and answers on an empty sandbox, so a client
        can call it to establish that the plugin is serving before it sends any
        real work. Hence `x-unikraft-plugin-readiness`, which the SDK generators
        read to render their readiness helpers against this operation.
      parameters: []
      responses:
        default:
          description: The UUIDs of all known commands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCommandsResponse'
      tags:
        - commands
      x-unikraft-plugin-readiness: true
    post:
      operationId: RunCommand
      summary: Start Command
      description: |-
        Start a command in the sandbox, and with `req_timeout_s` wait for it, so
        that starting, waiting, inspecting and fetching the output take one
        request. `500` is returned when the command could not be spawned, and
        `400` when `cols` or `rows` are given without `pty` or are zero, when
        `req_timeout_s` is not between 0 (exclusive) and 55 seconds, or when
        `logs_limit` or `forget` are given without `req_timeout_s`.
      parameters: []
      responses:
        default:
          description: The command that was started, as GET .../{uuid} describes it, plus its output (logs) when req_timeout_s was given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCommandResponse'
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCommandRequest'
  /commands/{uuid}:
    get:
      operationId: GetCommandByUUID
      summary: Get Command by UUID
      description: |-
        Inspect a command by UUID. `404` is returned, with an empty body, when no
        such command exists.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The command line and exit status of the command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCommandResponse'
      tags:
        - commands
    delete:
      operationId: DeleteCommandByUUID
      summary: Delete Command by UUID
      description: |-
        Forget a command by UUID. `404` is returned, with an empty body, when no
        such command exists, and `409` when the command has not finished
        executing: commands which are still running cannot be forgotten.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The outcome of forgetting the command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - commands
  /commands/{uuid}/logs:
    delete:
      operationId: DeleteCommandLogsByUUID
      summary: Delete Command Logs
      description: |-
        Forget the output logs of an existing command, freeing up memory.
        The stdin/out/err pipes of running commands will be closed. Idempotent.
        `404` is returned, with an empty body, when no such command exists.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The outcome of forgetting command logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - commands
    get:
      operationId: GetCommandLogs
      summary: Get Command Logs
      description: |-
        Fetch the collected output of a command. Both streams are base64-encoded;
        use the raw log endpoint for binary output. `404` is returned, with an
        empty body, when no such command exists. `410` is returned, with an empty body,
        if the command's logs have been deleted.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The requested parts of the two output streams.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandLogsResponse'
      tags:
        - commands
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandLogsRequest'
  /commands/{uuid}/logs/raw/{stream}:
    get:
      operationId: GetRawCommandLog
      summary: Get Raw Command Log
      description: |-
        Fetch an output stream of a command as raw bytes. A single contiguous
        `Range` header is honoured, as described in RFC 9110.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stream
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CommandLogStream'
        - name: Range
          in: header
          required: false
          description: A single contiguous byte range, e.g. `bytes=0-1023`.
          schema:
            type: string
      responses:
        default:
          description: |-
            An output stream of a command, returned verbatim and unenveloped. A request
            carrying no `Range` header is answered with `200` and the whole stream; a
            satisfiable `Range` is answered with `206`, the requested bytes and a
            `Content-Range` header. `404` is returned when the command or the stream does
            not exist, `410` is returned, with an empty body, if the command's logs have been
            deleted, and `416` — with a `Content-Range` header reporting the total length —
            when the range cannot be satisfied.
          headers:
            Content-Range:
              required: false
              description: |-
                The range of bytes returned and the total length of the stream, as
                described in RFC 9110. Only present on a partial (`206`) response.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      tags:
        - commands
  /commands/{uuid}/resize:
    post:
      operationId: ResizeCommandTerminal
      summary: Resize Command Terminal
      description: |-
        Resize a command's terminal; the foreground job is told with SIGWINCH.
        `404` is returned, with an empty body, when no such command exists, `400`
        when the command has no terminal or the size is zero, and `409` once the
        command has finished.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The outcome of resizing the terminal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandResizeRequest'
  /commands/{uuid}/signal:
    post:
      operationId: SignalCommand
      summary: Signal Command
      description: |-
        Send a signal to a command. `404` is returned, with an empty body, when no
        such command exists, and `400` when the signal is not a known signal, by
        name or by number.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The outcome of sending the signal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandSignalRequest'
  /commands/{uuid}/stdin:
    post:
      operationId: WriteCommandStdin
      summary: Write Command Stdin
      description: |-
        Feed data into the standard input of a command. `404` is returned, with an
        empty body, when no such command exists, `410` if the command's logs have been
        deleted, `400` when `data` is not valid base64, `409` when the command has
        finished or its standard input is closed (an `eof` alone is still fine),
        and `429` when the command has not yet read what it was already given
        (its stdin queue holds 8 MiB; on a terminal an `eof` counts as the byte
        it types).
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: The outcome of feeding the data into standard input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandStdinRequest'
  /commands/{uuid}/wait:
    post:
      operationId: WaitForCommand
      summary: Wait for Command
      description: |-
        Wait for a command to finish, without a timeout. `404` is returned, with an
        empty body, when no such command exists.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: Returned once the command has finished.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - commands
  /commands/{uuid}/wait_timeout:
    post:
      operationId: WaitForCommandWithTimeout
      summary: Wait for Command with Timeout
      description: |-
        Wait for a command to finish, up to a timeout. Commands which are still
        running when the timeout elapses return `408`. `404` is returned, with an
        empty body, when no such command exists, and `400` when the timeout is not
        a representable duration.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        default:
          description: Returned once the command has finished, within the timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - commands
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandWaitTimeoutRequest'
  /fs/mkdir:
    post:
      operationId: CreateDirectory
      summary: Create Directory
      description: |-
        Create a directory in the sandbox filesystem. `500` is returned when the
        directory could not be created.
      parameters: []
      responses:
        default:
          description: The outcome of creating the directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - fs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MkdirRequest'
  /fs/read:
    post:
      operationId: ReadFile
      summary: Read File
      description: |-
        Read the contents of a file, base64-encoded. `500` is returned when the
        file could not be read.
      parameters: []
      responses:
        default:
          description: The base64-encoded contents of the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadFileResponse'
      tags:
        - fs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadFileRequest'
  /fs/read_raw:
    post:
      operationId: ReadRawFile
      summary: Read Raw File
      description: Download the contents of a file verbatim.
      parameters: []
      responses:
        default:
          description: |-
            The contents of a file, returned verbatim and unenveloped. `404` is returned
            when the file does not exist.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      tags:
        - fs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadFileRequest'
  /fs/upload:
    post:
      operationId: UploadFile
      summary: Upload File
      description: |-
        Upload a file to the sandbox at a given path. A new file will be created at
        - if `path` ends with '/' or exists and is a directory: path/filename
        - else: path
        `400` is returned when `encoding` is not a known encoding or `data` is not
        valid base64, and `500` when the file could not be created.
      parameters: []
      responses:
        default:
          description: The outcome of uploading the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - fs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
  /fs/write:
    post:
      operationId: WriteFile
      summary: Write File
      description: |-
        Write data to a file, creating it if it does not exist. `400` is returned
        when `encoding` is not a known encoding or `data` is not valid base64, and
        `500` when the file could not be written.
      parameters: []
      responses:
        default:
          description: The outcome of writing the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyResponse'
      tags:
        - fs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteFileRequest'
security:
  - bearerToken: []
components:
  schemas:
    CommandLineArgs:
      type: array
      items:
        type: string
      description: The command as an argument vector, executed directly without a shell.
    CommandLineShell:
      type: string
      description: The command line, interpreted by the shell.
    CommandLogStream:
      type: string
      enum:
        - stdout
        - stderr
      description: The output stream to read raw bytes from.
    CommandLogsData:
      type: object
      required:
        - stdout
        - stderr
        - stdout_available
        - stderr_available
      properties:
        stdout:
          type: string
          description: The requested part of the standard output stream, base64-encoded.
          example: aGVsbG8K
        stderr:
          type: string
          description: The requested part of the standard error stream, base64-encoded.
        stdout_available:
          type: integer
          format: uint64
          description: The total number of bytes available in the standard output stream.
        stderr_available:
          type: integer
          format: uint64
          description: The total number of bytes available in the standard error stream.
      description: The collected output of a command.
    CommandLogsRange:
      type: object
      required:
        - offset
      properties:
        offset:
          type: integer
          format: uint64
          description: The first byte of the stream to return.
          default: 0
        limit:
          type: integer
          format: uint64
          description: |-
            The maximum number of bytes to return. When omitted, everything from
            `offset` to the end of the stream is returned.
      description: The byte range of a single output stream to return.
    CommandLogsRequest:
      type: object
      required:
        - stdout
        - stderr
      properties:
        stdout:
          allOf:
            - $ref: '#/components/schemas/CommandLogsRange'
          description: The part of the standard output stream to return.
        stderr:
          allOf:
            - $ref: '#/components/schemas/CommandLogsRange'
          description: The part of the standard error stream to return.
      description: |-
        The (optional) request body limiting which parts of the output streams are
        returned. When omitted, both streams are returned in their entirety.
    CommandLogsResponse:
      type: object
      required:
        - status
        - data
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/CommandLogsData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: |-
        The response to fetching the output of a command. `404` is returned, with an
        empty body, when no command with the given UUID exists. `410` is returned, with an
        empty body, if the command's logs have been deleted.
    CommandResizeRequest:
      type: object
      required:
        - cols
        - rows
      properties:
        cols:
          type: integer
          format: uint16
          description: The new width, in columns.
          example: 120
        rows:
          type: integer
          format: uint16
          description: The new height, in rows.
          example: 40
      description: The request to resize a command's terminal.
    CommandSignalRequest:
      type: object
      required:
        - signal
      properties:
        signal:
          anyOf:
            - type: integer
              format: int32
            - type: string
          description: |-
            The signal to send, either as a number or as a name, with or without the
            `SIG` prefix, e.g. `15`, `TERM` or `SIGTERM`.
          example: 15
      description: The request to send a signal to a command.
    CommandStdinRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: string
          description: The bytes to feed into standard input, base64-encoded.
          example: aGVsbG8K
        eof:
          type: boolean
          description: Whether to close standard input after injecting `data`.
      description: The request to feed data into a command's standard input.
    CommandWaitTimeoutRequest:
      type: object
      required:
        - timeout_s
      properties:
        timeout_s:
          type: number
          format: double
          description: The maximum time to wait, in seconds. Decimals are accepted.
          example: 1
      description: The request to wait for a command to finish, up to a timeout.
    EmptyResponse:
      type: object
      required:
        - status
        - data
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          nullable: true
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: |-
        A response which carries no data of its own. `data` is `null`; the outcome of
        the request is the HTTP status code.
    FileEncoding:
      type: string
      enum:
        - utf-8
        - base64
      description: The encoding of the data written to a file.
    GetCommandData:
      type: object
      required:
        - uuid
        - cmdline
        - cwd
        - env
        - pty
        - duration_ms
        - exitcode
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the command.
        cmdline:
          anyOf:
            - $ref: '#/components/schemas/CommandLineShell'
            - $ref: '#/components/schemas/CommandLineArgs'
          description: |-
            The command the command was started with, in the form it was supplied in:
            a shell command line, or an argument vector.
        cwd:
          type: string
          nullable: true
          description: The current working directory, if supplied at startup, else null
        env:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Environment variables, if supplied at startup, else null
        pty:
          type: boolean
          description: Whether the command runs on a pseudo-terminal.
        duration_ms:
          type: integer
          format: uint64
          nullable: true
          description: |-
            Milliseconds from start to exit, or to now while the command runs. `null`
            for a command restored from a status file written before it was recorded.
        exitcode:
          type: integer
          format: int32
          nullable: true
          description: |-
            The exit code of the command. It is `null` while the command is still
            running.
      description: The state of a single command.
    GetCommandResponse:
      type: object
      required:
        - status
        - data
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/GetCommandData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: |-
        The response to inspecting a command. `404` is returned, with an empty body,
        when no command with the given UUID exists.
    ListCommandsData:
      type: object
      required:
        - commands
      properties:
        commands:
          type: array
          items:
            type: string
          description: The UUIDs of all known commands, in the order they were started.
      description: The known commands.
    ListCommandsResponse:
      type: object
      required:
        - status
        - data
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ListCommandsData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: The response to listing the commands known to the sandbox.
    MkdirRequest:
      type: object
      required:
        - path
        - parents
      properties:
        path:
          type: string
          description: The absolute path of the directory to create.
          example: /tmp/demo
        parents:
          type: boolean
          description: Whether to create missing parent directories.
      description: The request to create a directory in the sandbox filesystem.
    ReadFileData:
      type: object
      required:
        - contents
      properties:
        contents:
          type: string
          description: The contents of the file, base64-encoded.
          example: SGVsbG8gV29ybGQhCg==
      description: The contents of a file.
    ReadFileRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: The absolute path of the file to read.
          example: /tmp/demo/file.txt
      description: The request to read a file from the sandbox filesystem.
    ReadFileResponse:
      type: object
      required:
        - status
        - data
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/ReadFileData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: |-
        The response to reading a file. `500` is returned when the file could not be
        read.
    ResponseError:
      type: object
      required:
        - status
      properties:
        status:
          type: integer
          format: uint64
          description: The HTTP status code of the error.
      description: The error response message for an API request.
    ResponseStatus:
      type: string
      enum:
        - success
        - error
        - partial_success
      description: The response status of an API request.
    RunCommandData:
      type: object
      required:
        - uuid
        - cmdline
        - cwd
        - env
        - pty
        - duration_ms
        - exitcode
      properties:
        uuid:
          type: string
          format: uuid
          description: The UUID of the command.
        cmdline:
          anyOf:
            - $ref: '#/components/schemas/CommandLineShell'
            - $ref: '#/components/schemas/CommandLineArgs'
          description: |-
            The command the command was started with, in the form it was supplied in:
            a shell command line, or an argument vector.
        cwd:
          type: string
          nullable: true
          description: The current working directory, if supplied at startup, else null
        env:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: Environment variables, if supplied at startup, else null
        pty:
          type: boolean
          description: Whether the command runs on a pseudo-terminal.
        duration_ms:
          type: integer
          format: uint64
          nullable: true
          description: |-
            Milliseconds from start to exit, or to now while the command runs. `null`
            for a command restored from a status file written before it was recorded.
        exitcode:
          type: integer
          format: int32
          nullable: true
          description: |-
            The exit code of the command. It is `null` while the command is still
            running.
        logs:
          allOf:
            - $ref: '#/components/schemas/CommandLogsData'
          description: |-
            Only with `req_timeout_s`: the output, as `GET .../logs` returns it.
            Absent if the logs were deleted while the request waited.
      description: The command that was started, as `GET .../{uuid}` describes it.
    RunCommandRequest:
      type: object
      required:
        - cmd
      properties:
        cmd:
          anyOf:
            - $ref: '#/components/schemas/CommandLineShell'
            - $ref: '#/components/schemas/CommandLineArgs'
          description: |-
            The command to run: a command line interpreted by the shell, or an argument
            vector executed directly. A bare program name in a vector is looked up in
            the `PATH` of `env`, falling back to the sandbox's own `PATH`. `400` is
            returned if the vector is empty, the program cannot be resolved or run,
            `cwd` is not a directory, an environment variable name is empty or has a
            `=` in it, or the request holds what exec will not take (NUL bytes, an
            argument list past the kernel's limit).
          example: echo hello
        cwd:
          type: string
          description: (OPTIONAL) Current working directory
          example: /tmp
        env:
          type: object
          additionalProperties:
            type: string
          description: (OPTIONAL) Environment variables
        pty:
          type: boolean
          description: |-
            (OPTIONAL) Run the command on a pseudo-terminal instead of pipes. Its
            output, stdout and stderr merged as a terminal shows them, is served as
            `stdout`; input fed to it is echoed by the terminal; an `eof` on stdin
            types the terminal's end-of-input character rather than closing anything;
            and deleting the logs hangs the terminal up, which ends most commands.
            `TERM` is set to `xterm-256color` unless `env` provides one.
        cols:
          type: integer
          format: uint16
          description: (OPTIONAL) The terminal's width in columns. Needs `pty`; 80 by default.
        rows:
          type: integer
          format: uint16
          description: (OPTIONAL) The terminal's height in rows. Needs `pty`; 24 by default.
        stdin:
          type: string
          description: |-
            (OPTIONAL) Bytes to feed into standard input before anything else,
            base64-encoded, exactly as a `POST .../stdin` right after the start would.
          example: aGVsbG8K
        stdin_eof:
          type: boolean
          description: |-
            (OPTIONAL) Whether to close standard input after `stdin` (at once when
            there is none). Defaults to `true` when `req_timeout_s` is given, since
            nothing can be fed until the request answers, and to `false` otherwise.
        req_timeout_s:
          type: number
          format: double
          description: |-
            (OPTIONAL) Block until the command exits or this many seconds have
            passed, then answer with the command's state and output (`logs`). More
            than 0 and at most 55: a proxy in front cuts a silent request at about a
            minute. A timeout is not an error: the answer has `exitcode: null`, the
            output so far, and the command keeps running, addressable by UUID as any
            other. Absent: answer as soon as the command has started.
          example: 30
        logs_limit:
          type: integer
          format: uint64
          description: |-
            (OPTIONAL) With `req_timeout_s`: at most this many bytes of each stream in
            the answer, the rest staying at `GET .../logs`. Whole streams by default.
        forget:
          type: boolean
          description: |-
            (OPTIONAL) With `req_timeout_s`: forget the command once it has finished,
            as `DELETE .../{uuid}` would, so that one request is the whole exchange.
            Does nothing on a timeout, when the UUID is still needed.
      description: The request to start a command in the sandbox.
    RunCommandResponse:
      type: object
      required:
        - status
        - data
        - op_time_us
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/ResponseStatus'
          description: The status of the response.
        message:
          type: string
          description: An optional message providing additional information about the status.
        data:
          allOf:
            - $ref: '#/components/schemas/RunCommandData'
          description: The response data for this request.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ResponseError'
          description: A list of errors which may have occurred during the request.
        op_time_us:
          type: integer
          format: uint64
          description: The operation time in microseconds.
      description: |-
        The response to starting a command. `500` is returned when the command could
        not be spawned.
    UploadFileRequest:
      type: object
      required:
        - path
        - filename
        - parents
        - encoding
        - data
      properties:
        path:
          type: string
          description: Path where to upload the file.
          example: /tmp/demo
        filename:
          type: string
          description: Name of uploaded file; will be used if `path` is a directory.
          example: file.txt
        parents:
          type: boolean
          description: Whether to create parent directories of `path`.
        encoding:
          allOf:
            - $ref: '#/components/schemas/FileEncoding'
          description: The encoding of `data`.
        data:
          type: string
          description: The data to write, in the given encoding
          example: hello
      description: The request to upload a file to the sandbox filesystem.
    WriteFileRequest:
      type: object
      required:
        - path
        - append
        - encoding
        - data
      properties:
        path:
          type: string
          description: The absolute path of the file to write. It is created if missing.
          example: /tmp/demo/file.txt
        append:
          type: boolean
          description: Whether to append to the file instead of truncating it.
        encoding:
          allOf:
            - $ref: '#/components/schemas/FileEncoding'
          description: The encoding of `data`.
        data:
          type: string
          description: The data to write, in the given encoding.
          example: hello
      description: The request to write a file in the sandbox filesystem.
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
servers:
  - url: http://localhost:7263
    description: A sandbox running locally, listening on its default port
    variables: {}
  - url: https://api.{metro}.unikraft.cloud/v1/instances/{instance}/plugins/sandbox
    description: The sandbox plugin route of an instance running on a Unikraft Cloud metro
    variables:
      metro:
        default: ''
        description: The metro the instance is running in, e.g. `fra`.
      instance:
        default: ''
        description: The UUID or name of the instance running the sandbox.
x-unikraft-plugin-rom: unikraft.io/plugins/sandbox
x-unikraft-plugin-name: sandbox
